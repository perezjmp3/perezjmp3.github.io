                gameState.winner = !opponentColor ? 'white' : 'black';
                console.log(`[Player] Checkmate! ${gameState.winner} wins!`);
            } else if (opponentIsStalemate) {
                gameState.gameOver = true;
                gameState.winner = 'draw';
                console.log('[Player] Stalemate! Game is a draw.');
            }
            
            updateUI();
            
            // If AI mode and game not over, schedule AI move after a delay
            if (gameMode.type === 'ai' && !gameState.gameOver) {
                setTimeout(() => {
                    console.log('[END TURN] Invoking AI.makeMove after delay');
                    AI.makeMove();
                }, 800); // 800ms delay for better UX
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Pulse highlight effect
            const pulseIntensity = 0.3 + Math.sin(performance.now() / 500) * 0.2;
            highlightMaterial.emissiveIntensity = pulseIntensity;
            
            // Update dragged piece position on every frame
            if (draggedPiece) {
                updateDraggedPiecePosition();
            }
            // Animate snapping pieces into square centers
            const now = performance.now();
            snappingPieces.forEach((anim, piece) => {
                if (anim.mode === 'aiThreePhase') {
                    const total = (anim.durUp || 0) + (anim.durFlat || 0) + (anim.durDown || 0);
                    const elapsed = now - anim.startTime;
                    let pos;

                    if (elapsed <= anim.durUp) {
                        const k = easeOutCubic(elapsed / Math.max(1, anim.durUp));
                        pos = new THREE.Vector3().lerpVectors(anim.start, anim.mid1, k);
                    } else if (elapsed <= anim.durUp + anim.durFlat) {
                        const tFlat = (elapsed - anim.durUp) / Math.max(1, anim.durFlat);
                        const k = easeOutCubic(tFlat);
                        pos = new THREE.Vector3().lerpVectors(anim.mid1, anim.mid2, k);
                    } else if (elapsed <= total) {
                        const tDown = (elapsed - anim.durUp - anim.durFlat) / Math.max(1, anim.durDown);
                        const k = easeOutCubic(tDown);
                        pos = new THREE.Vector3().lerpVectors(anim.mid2, anim.end, k);
                    } else {
                        pos = anim.end.clone();
                    }

                    piece.body.setNextKinematicTranslation({ x: pos.x, y: pos.y, z: pos.z });
                    piece.mesh.position.copy(pos);

                    if (elapsed >= total) {
                        piece.body.setBodyType(RAPIER.RigidBodyType.Dynamic);
                        piece.body.wakeUp();
                        snappingPieces.delete(piece);
                        if (piece.promotionPendingType) {
                            const promotionType = piece.promotionPendingType;
                            applyPromotion(piece, promotionType);
                        }
                        // Re-enable controls if both snapping and sliding are now complete
                        if (snappingPieces.size === 0 && slidingOffPieces.size === 0) {
                            controls.enabled = true;
                        }
                    }
                } else {
                    const t = Math.min((now - anim.startTime) / Math.max(1, anim.duration), 1);
                    const k = easeOutCubic(t);
                    const pos = new THREE.Vector3().lerpVectors(anim.start, anim.end, k);
                    piece.body.setNextKinematicTranslation({ x: pos.x, y: pos.y, z: pos.z });
                    piece.mesh.position.copy(pos);
                    if (t >= 1) {
                        piece.body.setBodyType(RAPIER.RigidBodyType.Dynamic);
                        piece.body.wakeUp();
                        snappingPieces.delete(piece);
                        if (piece.promotionPendingType) {
                            const promotionType = piece.promotionPendingType;
                            applyPromotion(piece, promotionType);
                        }
                        // Re-enable controls if both snapping and sliding are now complete
                        if (snappingPieces.size === 0 && slidingOffPieces.size === 0) {
                            controls.enabled = true;
                        }
                    }
                }
            });

            // Animate captured pieces sliding off the board
            slidingOffPieces.forEach((anim, piece) => {
                const t = Math.min((now - anim.startTime) / Math.max(1, anim.duration), 1);
                
                // Three-stage animation: start -> up -> over -> end
                let pos;
                if (t < 0.33) {
                    const t1 = t / 0.33; // 0 to 1
                    const k = easeOutCubic(t1);
                    pos = new THREE.Vector3().lerpVectors(anim.start, anim.up, k);
                } else if (t < 0.66) {
                    const t2 = (t - 0.33) / 0.33; // 0 to 1
                    const k = easeOutCubic(t2);
                    pos = new THREE.Vector3().lerpVectors(anim.up, anim.over, k);
                } else {
                    const t3 = (t - 0.66) / 0.34; // 0 to 1
                    const k = easeOutCubic(t3);
                    pos = new THREE.Vector3().lerpVectors(anim.over, anim.end, k);
                }
                
                piece.body.setNextKinematicTranslation({ x: pos.x, y: pos.y, z: pos.z });
                piece.mesh.position.copy(pos);
                if (t >= 1) {
                    piece.mesh.scale.set(0.6, 0.6, 0.6); // Make smaller once settled
                    piece.body.setBodyType(RAPIER.RigidBodyType.Dynamic);
                    piece.body.wakeUp();
                    slidingOffPieces.delete(piece);
                    // Re-enable controls if both snapping and sliding are now complete
                    if (snappingPieces.size === 0 && slidingOffPieces.size === 0) {
                        controls.enabled = true;
                    }
                }
            });

            promotionAnimations.forEach((anim, piece) => {
                const t = Math.min((now - anim.startTime) / Math.max(1, anim.duration), 1);
                const k = easeOutCubic(t);
                const scale = anim.startScale + (anim.endScale - anim.startScale) * k;
                piece.mesh.scale.set(scale, scale, scale);
                if (t >= 1) {
                    piece.mesh.scale.set(anim.endScale, anim.endScale, anim.endScale);
                    promotionAnimations.delete(piece);
                }
            });
            
            rapierWorld.step();
            Object.values(gameState.pieces).forEach(p => {
                const t = p.body.translation();
                const r = p.body.rotation();
                p.mesh.position.set(t.x, t.y, t.z);
                p.mesh.quaternion.set(r.x, r.y, r.z, r.w);
            });
            bodyWireframes.forEach(({ rb, line }) => {
                const t = rb.translation();
                const r = rb.rotation();
                line.position.set(t.x, t.y, t.z);
                line.quaternion.set(r.x, r.y, r.z, r.w);
            });
            
            // Restore camera state if we're dragging (protects against unexpected right-click rotations)
            if (draggedPiece && cameraSnapshot.valid) {
                camera.position.copy(cameraSnapshot.position);
                controls.target.copy(cameraSnapshot.target);
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Debug GUI
        const gui = new GUI();
        gui.add(wireframeState, 'showPhysicsWireframes').name('Physics Wireframes').onChange((v) => {
            bodyWireframes.forEach(({ line }) => { line.visible = v; });
        });
        gui.add(wireframeState, 'showAxes').name('Show Axes').onChange((v) => { axes.visible = v; });
        gui.add(wireframeState, 'showGrid').name('Show Grid').onChange((v) => { grid.visible = v; });

        // Start game mode selection on page load
        showModeSelection();
        animate();
    </script>
</body>
