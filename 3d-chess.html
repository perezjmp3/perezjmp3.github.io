        // Convert BufferGeometry to convex hull vertices (keeping original local positioning)
        function geometryToHull(geometry) {
            const geom = geometry.clone();
            geom.computeBoundingBox();
            const size = new THREE.Vector3();
            geom.boundingBox.getSize(size);
            const pos = geom.attributes.position;
            const verts = new Float32Array(pos.count * 3);
            for (let i = 0; i < pos.count; i++) {
                verts[i * 3] = pos.getX(i);
                verts[i * 3 + 1] = pos.getY(i);
                verts[i * 3 + 2] = pos.getZ(i);
            }
            return { verts, size };
        }

        // Create exact convex hull collider from piece geometry
        function createPieceCollider(geometry) {
            const { verts } = geometryToHull(geometry);
            const hullDesc = RAPIER.ColliderDesc.convexHull(verts);
            if (!hullDesc) {
                // Fallback if convex hull fails
                return RAPIER.ColliderDesc.cuboid(0.15, 0.2, 0.15);
            }
            return hullDesc;
        }

        function createPieceGeometry(type) {
            switch (type) {
                case 'pawn': return createPawnGeometry();
                case 'rook': return createRookGeometry();
                case 'knight': return createKnightGeometry();
                case 'bishop': return createBishopGeometry();
                case 'queen': return createQueenGeometry();
                case 'king': return createKingGeometry();
                default: return createPawnGeometry();
            }
        }

        function createPieceMesh(type, isWhite) {
            const geom = createPieceGeometry(type);
            const mesh = new THREE.Mesh(geom, isWhite ? pieceMatWhite : pieceMatBlack);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // --- Game state ---
        const gameState = {
            pieces: {}, // key "r_c"
            moveHistory: [],
            isWhiteTurn: true,
            selectedSquare: null,
            validMoves: [],
            gameOver: false,
            winner: null // 'white', 'black', or 'draw'
        };

        let pendingMove = null; // {from, to, isWhite, piece}

        function algebra(row, col) {
            return `${String.fromCharCode(97 + col)}${8 - row}`;
        }

        function addPiece(row, col, type, isWhite) {
            const key = `${row}_${col}`;
            const mesh = createPieceMesh(type, isWhite);
            const x = (col - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
            const z = (row - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
            
            // Start pieces just above the board so they settle quickly with gravity
            const y = BOARD_SURFACE_Y + 0.3;
            
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // Position body at same location as mesh
            const rb = rapierWorld.createRigidBody(
                RAPIER.RigidBodyDesc.dynamic()
                    .setTranslation(x, y, z)
                    .setCanSleep(true)
                    .setLinearDamping(4.0)
                    .setAngularDamping(4.0)
                    .setCcdEnabled(true)
            );

            // Create exact convex hull collider - Rapier will use geometry as-is
            const colliderDesc = createPieceCollider(mesh.geometry);
            colliderDesc.setFriction(0.95).setRestitution(0.0);
            rapierWorld.createCollider(colliderDesc, rb);
            trackWireframe(rb, type, isWhite ? 0xffffff : 0x555555);

            gameState.pieces[key] = { type, isWhite, mesh, body: rb, row, col, hasMoved: false };
        }

        function clearPieces() {
            Object.values(gameState.pieces).forEach(p => {
                scene.remove(p.mesh);
                rapierWorld.removeRigidBody(p.body);
                removeWireframe(p.body);
            });
            gameState.pieces = {};
        }

        function setupInitialPosition() {
            clearPieces();
            gameState.moveHistory = [];
            gameState.isWhiteTurn = true;
            gameState.selectedSquare = null;
            gameState.validMoves = [];
            gameState.gameOver = false;
            gameState.winner = null;
            lastCommittedBoardState = null;
            promotionState = null;
            promotionPending = false;
            hidePromotionModal();

            const backRank = ['rook', 'knight', 'bishop', 'queen', 'king', 'bishop', 'knight', 'rook'];
            backRank.forEach((type, c) => addPiece(0, c, type, false));
            for (let c = 0; c < 8; c++) addPiece(1, c, 'pawn', false);
            for (let c = 0; c < 8; c++) addPiece(6, c, 'pawn', true);
            backRank.forEach((type, c) => addPiece(7, c, type, true));
            updateUI();
            // Capture initial committed state
            lastCommittedBoardState = getBoardState();
            
            // If AI is white (player is black), schedule AI's first move
            if (gameMode.type === 'ai' && gameMode.playerColor === 'black') {
                setTimeout(() => AI.makeMove(), 800);
            }
        }

        function raycastSquare(evt) {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            mouse.x = (evt.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(evt.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boardGroup.children);
            if (!intersects.length) return null;
            const { row, col } = intersects[0].object.userData;
            return { row, col };
        }

        function movePiece(fromRow, fromCol, toRow, toCol, { record = true } = {}) {
            const fromKey = `${fromRow}_${fromCol}`;
            const toKey = `${toRow}_${toCol}`;
            const piece = gameState.pieces[fromKey];
            if (!piece) return false;

            const target = gameState.pieces[toKey];
            if (target) {
                scene.remove(target.mesh);
                rapierWorld.removeRigidBody(target.body);
                removeWireframe(target.body);
                delete gameState.pieces[toKey];
            }

            const x = (toCol - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
            const z = (toRow - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
            const y = BOARD_SURFACE_Y + 0.5;
            
            piece.mesh.position.set(x, y, z);
            piece.body.setTranslation({ x, y, z }, true);
            piece.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
            piece.body.setAngvel({ x: 0, y: 0, z: 0 }, true);

            piece.row = toRow;
            piece.col = toCol;
            piece.hasMoved = true;
            delete gameState.pieces[fromKey];
            gameState.pieces[toKey] = piece;

            if (record) {
                // Check if opponent is in check after this move
                const newBoardState = getBoardState();
                const opponentIsInCheck = AI.isKingInCheck(newBoardState, !piece.isWhite);
                
                gameState.moveHistory.push({ from: algebra(fromRow, fromCol), to: algebra(toRow, toCol), isWhite: piece.isWhite, piece: piece.type, isCapture: !!target, isCheck: opponentIsInCheck });
                gameState.isWhiteTurn = !gameState.isWhiteTurn;
                gameState.selectedSquare = null;
                gameState.validMoves = [];
                updateUI();
            }
            return true;
        }

        function formatChessNotation(move) {
            // Convert move to standard chess notation
            if (move.piece === 'castle') {
                // Add checkmate/check notation to castle moves
                const suffix = move.isCheckmate ? '#' : (move.isCheck ? '+' : '');
                return `${move.notation}${suffix}`;
            }
            
            const pieceSymbols = {
                king: 'K',
                queen: 'Q',
                rook: 'R',
                bishop: 'B',
                knight: 'N',
                pawn: ''
            };
            
            const piece = pieceSymbols[move.piece] || '';
            const capture = move.isCapture ? 'x' : '';
            
            // For pawn captures, include the file (column) of origin
            if (move.piece === 'pawn' && move.isCapture) {
                const fromFile = move.from.charAt(0);
                const notation = `${fromFile}${capture}${move.to}`;
                const suffix = move.isCheckmate ? '#' : (move.isCheck ? '+' : '');
                return `${notation}${suffix}`;
            }
            
            // Standard notation: Piece + capture + destination
            const notation = `${piece}${capture}${move.to}`;
            const suffix = move.isCheckmate ? '#' : (move.isCheck ? '+' : '');
            return `${notation}${suffix}`;
        }

        function updateUI() {
            // Update turn display or game over message
            if (gameState.gameOver) {
                let message = '';
                if (gameState.winner === 'white') {
                    message = 'White wins by checkmate!';
                } else if (gameState.winner === 'black') {
                    message = 'Black wins by checkmate!';
                } else if (gameState.winner === 'draw') {
                    message = 'Draw by stalemate';
                }
                document.getElementById('currentTurn').textContent = message;
                document.getElementById('currentTurn').style.fontWeight = 'bold';
                document.getElementById('currentTurn').style.color = '#4CAF50';
            } else {
                document.getElementById('currentTurn').textContent = gameState.isWhiteTurn ? 'White to move' : 'Black to move';
                document.getElementById('currentTurn').style.fontWeight = 'normal';
                document.getElementById('currentTurn').style.color = '';
            }
            
            const historyDiv = document.getElementById('moveHistoryEntries');
            historyDiv.innerHTML = '';
            gameState.moveHistory.forEach((m, idx) => {
                const entry = document.createElement('div');
                entry.className = `move-entry ${m.isWhite ? 'white' : 'black'}`;
                const notation = formatChessNotation(m);
                const moveNumber = Math.floor(idx / 2) + 1;
                entry.textContent = m.isWhite ? `${moveNumber}. ${notation}` : notation;
                historyDiv.appendChild(entry);
            });
        }

        // --- Drag control (same system as blackjack chips) ---
        let DRAG_PLANE_Y = BOARD_SURFACE_Y + 0.8;
        let DRAG_RISE_DURATION_MS = 400;
        
        // Create white X marker for dragged piece indicator
        function createXMarker() {
            const group = new THREE.Group();
            const material = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
            
            // First diagonal (\)
            const geom1 = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-0.08, 0.001, -0.08),
                new THREE.Vector3(0.08, 0.001, 0.08)
            ]);
            const line1 = new THREE.Line(geom1, material);
            group.add(line1);
            
            // Second diagonal (/)
            const geom2 = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-0.08, 0.001, 0.08),
                new THREE.Vector3(0.08, 0.001, -0.08)
            ]);
            const line2 = new THREE.Line(geom2, material);
            group.add(line2);
            
            group.visible = false;
            return group;
        }
        
        const xMarker = createXMarker();
        scene.add(xMarker);
        
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -DRAG_PLANE_Y);
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const _dragPlaneIntersect = new THREE.Vector3();
        const dragOffset = new THREE.Vector3();
        let draggedPiece = null;
        const snappingPieces = new Map(); // piece -> { start, end, startTime, duration }
        const slidingOffPieces = new Map(); // piece -> { start, end, startTime, duration } for captured pieces
        const capturedPieces = { white: [], black: [] }; // Track captured pieces by side
        let lastHighlightedMoves = []; // Track which moves are captures
        
        // Camera state snapshot to protect against unwanted rotations
        const cameraSnapshot = {
            position: new THREE.Vector3(),
            target: new THREE.Vector3(),
            valid: false
        };

        const promotionAnimations = new Map(); // piece -> { startTime, duration, startScale, endScale }
        let promotionState = null; // { pawn, targetNotation }
        let promotionPending = false;

        function getCapturedSlot(captureIndex, isWhite) {
            const boardHalfWidth = (BOARD_SIZE * SQUARE_SIZE) / 2;
            const col = Math.floor(captureIndex / 4); // new column every 4 pieces
            const row = captureIndex % 4;
            const finalX = boardHalfWidth + 0.35 + (col * 0.2);
            const finalY = BOARD_SURFACE_Y -0.05;
            const zDirection = isWhite ? -0.2 : 0.2;
            const zBase = zDirection * (boardHalfWidth + 0.02);
            const finalZ = zBase + (zDirection * (row * 0.65));
            return { x: finalX, y: finalY, z: finalZ };
        }

        function positionCapturedPiece(piece, captureIndex) {
            const slot = getCapturedSlot(captureIndex, piece.isWhite);
            piece.mesh.position.set(slot.x, slot.y, slot.z);
            piece.body.setTranslation({ x: slot.x, y: slot.y, z: slot.z }, true);
            piece.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
            piece.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
        }

        function reflowCapturedPieces(bucket) {
            capturedPieces[bucket].forEach((piece, idx) => {
                positionCapturedPiece(piece, idx);
            });
        }

        function takeCapturedPiece(type, isWhite) {
            const bucket = isWhite ? 'white' : 'black';
            const idx = capturedPieces[bucket].findIndex(p => p.type === type);
            if (idx === -1) return null;
            const piece = capturedPieces[bucket].splice(idx, 1)[0];
            slidingOffPieces.delete(piece);
            reflowCapturedPieces(bucket);
            return piece;
        }

        function isPawnPromotionSquare(piece) {
            if (!piece || piece.type !== 'pawn') return false;
            return (piece.isWhite && piece.row === 0) || (!piece.isWhite && piece.row === 7);
        }

        function applyPromotion(pawnPiece, newType) {
            if (!pawnPiece || pawnPiece.type !== 'pawn') return pawnPiece;
            promotionPending = false;
            const row = pawnPiece.row;
            const col = pawnPiece.col;
            const key = `${row}_${col}`;

            if (snappingPieces.has(pawnPiece)) {
                snappingPieces.delete(pawnPiece);
            }
            delete pawnPiece.promotionPendingType;

            scene.remove(pawnPiece.mesh);
            rapierWorld.removeRigidBody(pawnPiece.body);
            removeWireframe(pawnPiece.body);
            delete gameState.pieces[key];

            const resurrected = takeCapturedPiece(newType, pawnPiece.isWhite);
            let promotedPiece;
            if (resurrected) {
                promotedPiece = resurrected;
            } else {
                addPiece(row, col, newType, pawnPiece.isWhite);
                promotedPiece = gameState.pieces[key];
            }

            const targetX = (col - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
            const targetZ = (row - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
            const targetY = BOARD_SURFACE_Y + 0.5;
            promotedPiece.mesh.position.set(targetX, targetY, targetZ);
            promotedPiece.body.setTranslation({ x: targetX, y: targetY, z: targetZ }, true);
            promotedPiece.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
            promotedPiece.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
            promotedPiece.body.setBodyType(RAPIER.RigidBodyType.Dynamic);
            promotedPiece.row = row;
            promotedPiece.col = col;
            promotedPiece.hasMoved = true;
            promotedPiece.mesh.scale.set(1, 1, 1);
            gameState.pieces[key] = promotedPiece;

            if (!resurrected) {
                promotedPiece.mesh.scale.set(0.2, 0.2, 0.2);
                promotionAnimations.set(promotedPiece, {
                    startTime: performance.now(),
                    duration: 350,
                    startScale: 0.2,
                    endScale: 1
                });
            }

            return promotedPiece;
        }

        function queuePromotion(pawnPiece, newType) {
            if (!pawnPiece) return;
            promotionPending = true;
            pawnPiece.promotionPendingType = newType;
            if (!snappingPieces.has(pawnPiece)) {
                applyPromotion(pawnPiece, newType);
            }
        }

        function showPromotionModal(pawnPiece) {
            promotionState = {
                pawn: pawnPiece,
                targetNotation: pawnPiece ? getPieceSquareNotation(pawnPiece) : null
            };
            const modal = document.getElementById('promotionModal');
            modal.classList.add('active');
        }

        function hidePromotionModal() {
            const modal = document.getElementById('promotionModal');
            modal.classList.remove('active');
        }

        function handlePromotionChoice(newType) {
            if (!promotionState || !promotionState.pawn) return;
            const pawnPiece = promotionState.pawn;
            const targetNotation = promotionState.targetNotation;
            promotionState = null;
            hidePromotionModal();
            queuePromotion(pawnPiece, newType);
            if (pendingMove && (!targetNotation || pendingMove.to === targetNotation)) {
                pendingMove.piece = newType;
                pendingMove.promotion = newType;
            }
        }

        function capturePieceToZone(targetPiece, boardKey = null) {
            if (!targetPiece) return;
            // Remove from logical board mapping if provided
            if (boardKey && gameState.pieces[boardKey] === targetPiece) {
                delete gameState.pieces[boardKey];
            }

            // Track captured piece by side
            const bucket = targetPiece.isWhite ? 'white' : 'black';
            capturedPieces[bucket].push(targetPiece);
            const captureIndex = capturedPieces[bucket].length - 1;

            // Compute capture zone placement
            const slot = getCapturedSlot(captureIndex, targetPiece.isWhite);
            const finalX = slot.x;
            const finalY = slot.y;
            const finalZ = slot.z;

            const intermediateY = DRAG_PLANE_Y + 1.5; // lift high first

            // Animate piece off the board
            targetPiece.body.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased);
            targetPiece.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
            targetPiece.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
            slidingOffPieces.set(targetPiece, {
                start: targetPiece.mesh.position.clone(),
                up: new THREE.Vector3(targetPiece.mesh.position.x, intermediateY, targetPiece.mesh.position.z),
                over: new THREE.Vector3(finalX, intermediateY, finalZ),
                end: new THREE.Vector3(finalX, finalY, finalZ),
                startTime: performance.now(),
                duration: 1200
            });
        }
        
        // --- Chess AI Engine ---
        const PIECE_VALUES = {
            pawn: 100,
            knight: 320,
            bishop: 330,
            rook: 500,
            queen: 900,
            king: 0
        };

        // Piece-square tables for position evaluation (white perspective)
        const PAWN_TABLE = [
            0, 0, 0, 0, 0, 0, 0, 0,
            50, 50, 50, 50, 50, 50, 50, 50,
            10, 10, 20, 30, 30, 20, 10, 10,
            5, 5, 10, 25, 25, 10, 5, 5,
            0, 0, 0, 20, 20, 0, 0, 0,
            5, -5, -10, 0, 0, -10, -5, 5,
            5, 10, 10, -20, -20, 10, 10, 5,
            0, 0, 0, 0, 0, 0, 0, 0
        ];

        const KNIGHT_TABLE = [
            -50, -40, -30, -30, -30, -30, -40, -50,
            -40, -20, 0, 0, 0, 0, -20, -40,
            -30, 0, 10, 15, 15, 10, 0, -30,
            -30, 5, 15, 20, 20, 15, 5, -30,
            -30, 0, 15, 20, 20, 15, 0, -30,
            -30, 5, 10, 15, 15, 10, 5, -30,
            -40, -20, 0, 5, 5, 0, -20, -40,
            -50, -40, -30, -30, -30, -30, -40, -50
        ];

        const BISHOP_TABLE = [
            -20, -10, -10, -10, -10, -10, -10, -20,
            -10, 0, 0, 0, 0, 0, 0, -10,
            -10, 0, 5, 10, 10, 5, 0, -10,
            -10, 5, 5, 10, 10, 5, 5, -10,
            -10, 0, 10, 10, 10, 10, 0, -10,
            -10, 10, 10, 10, 10, 10, 10, -10,
            -10, 5, 0, 0, 0, 0, 5, -10,
            -20, -10, -10, -10, -10, -10, -10, -20
        ];

        const ROOK_TABLE = [
            0, 0, 0, 0, 0, 0, 0, 0,
            5, 10, 10, 10, 10, 10, 10, 5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            0, 0, 0, 5, 5, 0, 0, 0
        ];

        const QUEEN_TABLE = [
            -20, -10, -10, -5, -5, -10, -10, -20,
            -10, 0, 0, 0, 0, 0, 0, -10,
            -10, 0, 5, 5, 5, 5, 0, -10,
            -5, 0, 5, 5, 5, 5, 0, -5,
            0, 0, 5, 5, 5, 5, 0, -5,
            -10, 5, 5, 5, 5, 5, 0, -10,
            -10, 0, 5, 0, 0, 0, 0, -10,
            -20, -10, -10, -5, -5, -10, -10, -20
        ];

        const KING_MIDGAME = [
            -30, -40, -40, -50, -50, -40, -40, -30,
            -30, -40, -40, -50, -50, -40, -40, -30,
            -30, -40, -40, -50, -50, -40, -40, -30,
            -30, -40, -40, -50, -50, -40, -40, -30,
            -20, -30, -30, -40, -40, -30, -30, -20,
            -10, -20, -20, -20, -20, -20, -20, -10,
            20, 20, 0, 0, 0, 0, 20, 20,
            20, 30, 10, 0, 0, 10, 30, 20
        ];

        function getPieceSquareValue(type, isWhite, row, col) {
            // Convert row/col to index (0-63)
            const idx = isWhite ? row * 8 + col : (7 - row) * 8 + (7 - col);
            
            const tables = {
                pawn: PAWN_TABLE,
                knight: KNIGHT_TABLE,
                bishop: BISHOP_TABLE,
                rook: ROOK_TABLE,
                queen: QUEEN_TABLE,
                king: KING_MIDGAME
            };
            
            return (tables[type] || [])[idx] || 0;
        }

        const AI = {
            transpositionTable: new Map(),
            transpositionTableSize: 100000,
            maxThinkTime: 5500, // Maximum 5.5 seconds per move (higher for stronger play)
            searchStartTime: 0,

            getSearchDepth() {
                const elo = gameMode.aiElo;
                // Increased depths for better play - iterative deepening scales with time
                if (elo < 400) return 2;
                if (elo < 800) return 3;
                if (elo < 1000) return 4;
                if (elo < 1200) return 5;  // Increased from 4 to 5 for better 1200 play
                if (elo < 1400) return 5;
                if (elo < 1600) return 6;
                if (elo < 2000) return 6;
                if (elo < 2400) return 7;
                return 7;
            },
            
            getQuiescenceDepth() {
                const elo = gameMode.aiElo;
                // Lower ELO stops tactical searches earlier; higher ELO sees deeper
                if (elo < 400) return 1;   // Minimal tactical search
                if (elo < 800) return 2;
                if (elo < 1200) return 3;
                if (elo < 1600) return 4;
                if (elo < 2000) return 5;
                if (elo < 2400) return 6;
                return 8;                  // Strong engines go very deep in tactics
            },
            
            getPositionalWeight() {
                const elo = gameMode.aiElo;
                // Lower ELO weights material more heavily; higher ELO values position
                if (elo < 400) return 0.2;  // Almost pure material
                if (elo < 800) return 0.3;
                if (elo < 1200) return 0.4;
                if (elo < 1600) return 0.5; // Balanced
                if (elo < 2000) return 0.6;
                if (elo < 2400) return 0.7;
                return 0.8;                // Strong engines heavily value position
            },
            
            getContemptFactor() {
                const elo = gameMode.aiElo;
                // Lower ELO slightly prefers draws; higher ELO seeks wins
                if (elo < 400) return 60;   // Strong draw preference
                if (elo < 800) return 40;
                if (elo < 1200) return 20;
                if (elo < 1600) return 5;   // Minimal draw preference
                if (elo < 2400) return 0;   // No draw preference
                return -10;                 // Slight win-seeking tendency
            },
            
            shouldStopSearch() {
                return (performance.now() - this.searchStartTime) > this.maxThinkTime;
            },

            // Hash position for transposition table
            hashPosition(boardState) {
                return JSON.stringify(
                    Object.keys(boardState)
                        .sort()
                        .filter(k => boardState[k] && boardState[k].type)
                        .map(k => k + ':' + boardState[k].type + boardState[k].isWhite)
                );
            },

            // Advanced position evaluation
            evaluatePosition(boardState) {
                let score = 0;
                let materialCount = 0;
                
                // Huge penalty if king is in check (this handles illegal positions during search)
                if (this.isKingInCheck(boardState, true)) {
                    score -= 3000; // Massive penalty for white king in check
                }
                if (this.isKingInCheck(boardState, false)) {
                    score += 3000; // Massive bonus if black king in check
                }
                
                // Get ELO-dependent weights
                const positionalWeight = this.getPositionalWeight();
                const contemptFactor = this.getContemptFactor();
                
                // Material and piece-square evaluation
                for (let notation in boardState) {
                    const { piece, isWhite, type } = boardState[notation];
                    const { row, col } = boardSquares[notation];
                    
                    const materialValue = PIECE_VALUES[type] || 0;
                    const posValue = getPieceSquareValue(type, isWhite, row, col);
                    
                    // Scale positional value based on ELO: lower ELO weights material more
                    const weightedPosValue = posValue * positionalWeight;
                    const totalValue = materialValue + weightedPosValue;
                    score += isWhite ? totalValue : -totalValue;
                    materialCount += materialValue;
                }
                
                // King safety bonus/penalty
                for (let notation in boardState) {
                    const { piece, isWhite, type } = boardState[notation];
                    if (type === 'king') {
                        const { row, col } = boardSquares[notation];
                        const kingSafety = this.evaluateKingSafety(boardState, isWhite, row, col);
                        score += isWhite ? kingSafety : -kingSafety;
                    }
                }
                
                // Pawn structure evaluation
                const pawnStructureScore = this.evaluatePawnStructure(boardState);
                score += pawnStructureScore;
                
                // Mobility bonus (more moves available = better position)
                const whiteMoves = this.getAllMoves(boardState, true).length;
                const blackMoves = this.getAllMoves(boardState, false).length;
                score += (whiteMoves - blackMoves) * 2;
                
                // Contempt factor: lower ELO prefers draws, higher ELO seeks wins
                // Slight bonus if material is equal (draw tendency for lower ELO)
                let whiteMaterial = 0, blackMaterial = 0;
                for (let notation in boardState) {
                    const val = PIECE_VALUES[boardState[notation].type] || 0;
                    if (boardState[notation].isWhite) whiteMaterial += val;
                    else blackMaterial += val;
                }
                if (Math.abs(whiteMaterial - blackMaterial) < 5) {
                    score += contemptFactor; // Balanced position: lower ELO finds it safer
                }
                
                return score;
            },

            evaluateKingSafety(boardState, isWhite, kRow, kCol) {
                let safety = 0;
                
                // Castling bonus if king hasn't moved far
                if ((isWhite && kRow === 7 && (kCol === 4 || kCol === 6)) ||
                    (!isWhite && kRow === 0 && (kCol === 4 || kCol === 6))) {
                    safety += 30;
                }
                
                // Penalty for exposed king (no pawns nearby)
                const nearbyRows = isWhite ? [6, 7] : [0, 1];
                let pawnShield = 0;
                for (let r of nearbyRows) {
                    for (let c = Math.max(0, kCol - 1); c <= Math.min(7, kCol + 1); c++) {
                        const key = `${r}_${c}`;
                        const row = 8 - parseInt(Object.keys(boardSquares).find(n => boardSquares[n].row === r && boardSquares[n].col === c)?.split('')[1] || '0', 10);
                        // Simplified pawn shield check
                    }
                }
                
                return safety;
            },

            evaluatePawnStructure(boardState) {
                let score = 0;
                
                for (let notation in boardState) {
                    const { piece, isWhite, type } = boardState[notation];
                    if (type === 'pawn') {
                        const { row, col } = boardSquares[notation];
                        
                        // Doubled pawns penalty
                        for (let otherNotation in boardState) {
                            const { piece: other, isWhite: otherIsWhite, type: otherType } = boardState[otherNotation];
                            if (otherType === 'pawn' && otherIsWhite === isWhite && otherNotation !== notation) {
                                const { col: otherCol } = boardSquares[otherNotation];
                                if (col === otherCol) {
                                    score += isWhite ? -20 : 20;
                                }
                            }
                        }
                        
                        // Passed pawn bonus
                        const isPassedPawn = this.isPassedPawn(boardState, notation, isWhite);
                        if (isPassedPawn) {
                            score += isWhite ? 30 : -30;
                        }
                    }
                }
                
                return score;
            },

            isPassedPawn(boardState, notation, isWhite) {
                const { row, col } = boardSquares[notation];
                const direction = isWhite ? -1 : 1;
                
                for (let r = row + direction; (isWhite ? r >= 0 : r <= 7); r += direction) {
                    for (let c = col - 1; c <= col + 1; c++) {
                        if (c >= 0 && c <= 7) {
                            const findNotation = Object.keys(boardSquares).find(n => boardSquares[n].row === r && boardSquares[n].col === c);
                            if (findNotation && boardState[findNotation]) {
                                const { type: otherType, isWhite: otherIsWhite } = boardState[findNotation];
                                if (otherType === 'pawn' && otherIsWhite !== isWhite) {
                                    return false;
                                }
                            }
                        }
                    }
                }
                return true;
            },
            
            // Check if a king is under attack
            isKingInCheck(boardState, isWhite) {
                // Find the king
                let kingNotation = null;
                for (let notation in boardState) {
                    const piece = boardState[notation];
                    if (piece && piece.type === 'king' && piece.isWhite === isWhite) {
                        kingNotation = notation;
                        break;
                    }
                }
                
                if (!kingNotation) return false; // No king found
                
                const kingPos = squareToRowCol(kingNotation);
                
                // Check if any opponent piece can attack the king's square
                for (let notation in boardState) {
                    const piece = boardState[notation];
                    if (piece && piece.isWhite !== isWhite) {
                        const pseudoPiece = { isWhite: piece.isWhite, type: piece.type };
                        const moves = getValidMoves(notation, pseudoPiece, boardState, false, true);
                        for (let move of moves) {
                            const moveNotation = typeof move === 'object' ? move.notation : move;
                            if (moveNotation === kingNotation) {
                                return true; // King is under attack
                            }
                        }
                    }
                }
                
                return false;
            },
            
            // Check if a player is in checkmate (in check AND has no legal moves)
            isCheckmate(boardState, isWhite) {
                if (!this.isKingInCheck(boardState, isWhite)) return false; // Not in check
                const legalMoves = this.getAllMoves(boardState, isWhite, true);
                return legalMoves.length === 0; // No legal moves = checkmate
            },
            
            // Check if a player is in stalemate (not in check AND has no legal moves)
            isStalemate(boardState, isWhite) {
                if (this.isKingInCheck(boardState, isWhite)) return false; // In check, not stalemate
                const legalMoves = this.getAllMoves(boardState, isWhite, true);
                return legalMoves.length === 0; // No legal moves but not in check = stalemate
            },
            
            // Filter out moves that leave the king in check
            filterLegalMoves(boardState, moves, isWhite) {
                return moves.filter(move => {
                    let newState = boardState;
                    
                    // If it's a castle move, simulate both king and rook movement
                    if (move.isCastle) {
                        // Use simulateMove with the castle flag to handle it properly
                        newState = this.simulateMove(boardState, move.from, move.to, move.isCastle);
                    } else {
                        // Regular move simulation
                        newState = this.simulateMove(boardState, move.from, move.to);
                    }
                    
                    // Check if this move leaves our king in check
                    return !this.isKingInCheck(newState, isWhite);
                });
            },

            getAllMoves(boardState, isWhite, filterIllegal = true) {
                const moves = [];
                for (let notation in boardState) {
                    const entry = boardState[notation];
                    const pieceIsWhite = entry.isWhite;
                    if (pieceIsWhite === isWhite) {
                        // Provide a minimal piece-like object for move generation
                        const pseudoPiece = { isWhite: entry.isWhite, type: entry.type };
                        const validMoves = getValidMoves(notation, pseudoPiece, boardState);
                        validMoves.forEach(move => {
                            const moveNotation = typeof move === 'object' ? move.notation : move;
                            // Preserve castle info if present
                            const moveObj = { from: notation, to: moveNotation };
                            if (move.isCastle) {
                                moveObj.isCastle = move.isCastle;
                            }
                            moves.push(moveObj);
                        });
                    }
                }
                // Only filter illegal moves when explicitly requested (at root level)
                if (filterIllegal) {
                    return this.filterLegalMoves(boardState, moves, isWhite);
                }
                return moves;
            },

            simulateMove(boardState, from, to, isCastle = null) {
                const newState = JSON.parse(JSON.stringify(boardState));
                
                // Handle castling moves
                if (isCastle) {
                    const piece = newState[from];
                    if (piece && piece.type === 'king') {
                        const isKingside = isCastle === 'kingside';
                        const expectedRow = piece.isWhite ? 7 : 0;
                        
                        // Move king
                        const kingDestCol = isKingside ? 6 : 2;
                        const kingDest = rowColToSquare(expectedRow, kingDestCol);
                        newState[kingDest] = newState[from];
                        delete newState[from];
                        
                        // Move rook
                        const rookFromCol = isKingside ? 7 : 0;
                        const rookDestCol = isKingside ? 5 : 3;
                        const rookFrom = rowColToSquare(expectedRow, rookFromCol);
                        const rookDest = rowColToSquare(expectedRow, rookDestCol);
                        newState[rookDest] = newState[rookFrom];
                        delete newState[rookFrom];
                    }
                } else {
                    // Regular move simulation
                    if (newState[to]) delete newState[to]; // Capture
                    if (newState[from]) {
                        newState[to] = newState[from];
                        delete newState[from];
                    }
                }
                
                return newState;
            },
            
            // Quiescence search - continue searching captures to avoid missing tactics
            quiescence(boardState, isMaximizing, alpha, beta, depth = 0) {
                // Evaluate current position first
                const eval0 = this.evaluatePosition(boardState);
                if (isMaximizing) {
                    if (eval0 >= beta) return beta;
                    alpha = Math.max(alpha, eval0);
                } else {
                    if (eval0 <= alpha) return alpha;
                    beta = Math.min(beta, eval0);
                }
                
                // Stop quiescence search at depth limit for lower ELO
                const maxQuiescenceDepth = this.getQuiescenceDepth();
                if (depth >= maxQuiescenceDepth) return eval0;
                
                // Only search captures (forcing moves)
                const moves = this.getAllMoves(boardState, isMaximizing, false);
                const captures = moves.filter(m => boardState[m.to]); // Only captures
                
                if (captures.length === 0) return eval0;
                
                // Sort captures by piece value
                captures.sort((a, b) => {
                    const captureA = boardState[a.to] ? PIECE_VALUES[boardState[a.to].type] || 0 : 0;
                    const captureB = boardState[b.to] ? PIECE_VALUES[boardState[b.to].type] || 0 : 0;
                    return captureB - captureA;
                });
                
                if (isMaximizing) {
                    let maxEval = eval0;
                    for (let move of captures) {
                        if (this.shouldStopSearch()) break;
                        const newState = this.simulateMove(boardState, move.from, move.to, move.isCastle);
                        const evalScore = this.quiescence(newState, false, alpha, beta, depth + 1);
                        maxEval = Math.max(maxEval, evalScore);
                        alpha = Math.max(alpha, evalScore);
                        if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = eval0;
                    for (let move of captures) {
                        if (this.shouldStopSearch()) break;
                        const newState = this.simulateMove(boardState, move.from, move.to, move.isCastle);
                        const evalScore = this.quiescence(newState, true, alpha, beta, depth + 1);
                        minEval = Math.min(minEval, evalScore);
                        beta = Math.min(beta, evalScore);
                        if (beta <= alpha) break;
                    }
                    return minEval;
                }
            },

            minimax(boardState, depth, isMaximizing, alpha = -Infinity, beta = Infinity) {
                // Early termination if time limit exceeded
                if (this.shouldStopSearch()) {
                    return this.evaluatePosition(boardState);
                }
                
                const hash = this.hashPosition(boardState);
                if (this.transpositionTable.has(hash)) {
                    const cached = this.transpositionTable.get(hash);
                    if (cached.depth >= depth) {
                        return cached.score;
                    }
                }

                if (depth === 0) {
                    // At leaf nodes, use quiescence search to see forcing moves
                    const evalScore = this.quiescence(boardState, isMaximizing, -Infinity, Infinity);
                    this.transpositionTable.set(hash, { score: evalScore, depth });
                    if (this.transpositionTable.size > this.transpositionTableSize) {
                        this.transpositionTable.clear();
                    }
                    return evalScore;
                }

                // Use pseudo-legal moves during search (much faster)
                const moves = this.getAllMoves(boardState, isMaximizing, false);
                
                if (moves.length === 0) {
                    return isMaximizing ? -5000 : 5000;
                }

                // Improved move ordering: captures (sorted by value), checks, center control, pawn advancement
                moves.sort((a, b) => {
                    // Captures are highest priority
                    const captureA = boardState[a.to] ? PIECE_VALUES[boardState[a.to].type] || 0 : 0;
                    const captureB = boardState[b.to] ? PIECE_VALUES[boardState[b.to].type] || 0 : 0;
                    if (captureB !== captureA) return captureB - captureA;
                    
                    // Check if moves deliver check
                    const newStateA = this.simulateMove(boardState, a.from, a.to, a.isCastle);
                    const newStateB = this.simulateMove(boardState, b.from, b.to, b.isCastle);
                    const checkA = this.isKingInCheck(newStateA, !isMaximizing) ? 500 : 0;
                    const checkB = this.isKingInCheck(newStateB, !isMaximizing) ? 500 : 0;
                    if (checkB !== checkA) return checkB - checkA;
                    
                    // Prefer center squares
                    const toA = squareToRowCol(a.to);
                    const toB = squareToRowCol(b.to);
                    const centerDistA = Math.abs(toA.row - 3.5) + Math.abs(toA.col - 3.5);
                    const centerDistB = Math.abs(toB.row - 3.5) + Math.abs(toB.col - 3.5);
                    if (centerDistB !== centerDistA) return centerDistA - centerDistB;
                    
                    // Pawn advancement bonus
                    const pieceA = boardState[a.from];
                    const pieceB = boardState[b.from];
                    let advanceA = 0, advanceB = 0;
                    if (pieceA?.type === 'pawn') {
                        advanceA = pieceA.isWhite ? (7 - toA.row) : toA.row;
                    }
                    if (pieceB?.type === 'pawn') {
                        advanceB = pieceB.isWhite ? (7 - toB.row) : toB.row;
                    }
                    return advanceB - advanceA;
                });

                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (let move of moves) {
                        const newState = this.simulateMove(boardState, move.from, move.to, move.isCastle);
                        const evalScore = this.minimax(newState, depth - 1, false, alpha, beta);
                        maxEval = Math.max(maxEval, evalScore);
                        alpha = Math.max(alpha, evalScore);
                        if (beta <= alpha) break;
                    }
                    this.transpositionTable.set(hash, { score: maxEval, depth });
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (let move of moves) {
                        const newState = this.simulateMove(boardState, move.from, move.to, move.isCastle);
                        const evalScore = this.minimax(newState, depth - 1, true, alpha, beta);
                        minEval = Math.min(minEval, evalScore);
                        beta = Math.min(beta, evalScore);
                        if (beta <= alpha) break;
                    }
                    this.transpositionTable.set(hash, { score: minEval, depth });
                    return minEval;
                }
            },

            selectMove(boardState, isWhite) {
                // Start timer for time-based cutoff
                this.searchStartTime = performance.now();
                
                // Only filter for legal moves at the root level (filterIllegal = true by default)
                const moves = this.getAllMoves(boardState, isWhite, true);
                if (moves.length === 0) return null;

                const maxDepth = this.getSearchDepth();
                let bestMove = moves[0];
                let bestEval = isWhite ? -Infinity : Infinity;

                // Blunder chance scales with ELO - reduced for 1200+ to make them competent
                const blunderChance = Math.max(0, 1 - gameMode.aiElo / 2600);
                const willBlunder = Math.random() < blunderChance;

                // If blundering, only consider worst moves; otherwise consider all
                const movesToConsider = willBlunder ? 
                    moves.slice().sort(() => Math.random() - 0.5).slice(0, Math.max(1, Math.floor(moves.length / 4))) : 
                    moves;

                // Iterative deepening: search progressively deeper until time runs out
                for (let currentDepth = 1; currentDepth <= maxDepth; currentDepth++) {
                    if (this.shouldStopSearch()) break; // Stop if time limit reached
                    
                    let depthBestMove = bestMove;
                    let depthBestEval = isWhite ? -Infinity : Infinity;
                    
                    for (let move of movesToConsider) {
                        if (this.shouldStopSearch()) break; // Early exit if time runs out
                        
                        const newState = this.simulateMove(boardState, move.from, move.to);
                        const evalScore = this.minimax(newState, currentDepth - 1, !isWhite);

                        if (isWhite) {
                            if (evalScore > depthBestEval) {
                                depthBestEval = evalScore;
                                depthBestMove = move;
                            }
                        } else {
                            if (evalScore < depthBestEval) {
                                depthBestEval = evalScore;
                                depthBestMove = move;
                            }
                        }
                    }
                    
                    // Update best move if we completed the depth
                    if (!this.shouldStopSearch()) {
                        bestMove = depthBestMove;
                        bestEval = depthBestEval;
                    }
                }

                return bestMove;
            },

            makeMove() {
                if (gameMode.type !== 'ai') return;

                const isAiWhite = gameMode.playerColor !== 'white';
                if (gameState.isWhiteTurn !== isAiWhite) {
                    console.warn('[AI] Not my turn', { isAiWhite, isWhiteTurn: gameState.isWhiteTurn });
                    return;
                }

                const boardState = getBoardState();
                const move = this.selectMove(boardState, isAiWhite);

                if (!move) {
                    console.warn('[AI] No legal moves found');
                    return;
                }

                console.log('[AI] Selected move', move);

                const { from, to } = move;
                const { row: fromRow, col: fromCol } = squareToRowCol(from);
                const { row: toRow, col: toCol } = squareToRowCol(to);

                const fromKey = `${fromRow}_${fromCol}`;
                const toKey = `${toRow}_${toCol}`;
                let piece = gameState.pieces[fromKey];
                if (!piece) {
                    console.error('[AI] Missing piece at fromKey', { fromKey, move });
                    console.error('[AI] Current gameState.pieces keys:', Object.keys(gameState.pieces));
                    console.error('[AI] Move attempted:', move);
                    console.error('[AI] Available board state:', getBoardState());
                    return;
                }

                // Use the previous console algorithm for check detection (simulate move first)
                const boardStateBeforeMove = getBoardState();
                const simulated = this.simulateMove(boardStateBeforeMove, from, to, move.isCastle);
                const promotionType = (piece.type === 'pawn' && ((piece.isWhite && toRow === 0) || (!piece.isWhite && toRow === 7)))
                    ? 'queen'
                    : null;
                const simulatedForCheck = promotionType && simulated[to]
                    ? { ...simulated, [to]: { ...simulated[to], type: promotionType } }
                    : simulated;
                const simulatedCheck = AI.isKingInCheck(simulatedForCheck, !piece.isWhite);
                
                // Check if this is a castle move
                if (move.isCastle) {
                    const expectedRow = piece.isWhite ? 7 : 0;
                    const rookCol = move.isCastle === 'kingside' ? 7 : 0;
                    const rookKey = `${expectedRow}_${rookCol}`;
                    const rook = gameState.pieces[rookKey];
                    
                    if (rook) {
                        executeCastle(piece, rook);
                        // Record castle notation in history and check for checkmate/stalemate
                        const castleNotation = move.isCastle === 'kingside' ? 'O-O' : 'O-O-O';
                        const finalBoardState = getBoardState();
                        const opponentColor = !piece.isWhite;
                        const castleIsCheck = simulatedCheck;
                        const castleIsCheckmate = AI.isCheckmate(finalBoardState, opponentColor);
                        const castleIsStalemate = AI.isStalemate(finalBoardState, opponentColor);
                        const castleMove = { from, to, isWhite: piece.isWhite, piece: 'castle', isCapture: false, isCastle: move.isCastle, notation: castleNotation, isCheck: castleIsCheck, isCheckmate: castleIsCheckmate };
                        gameState.moveHistory.push(castleMove);
                        const aiSide = piece.isWhite ? 'White' : 'Black';
                        const checkSuffix = castleIsCheckmate ? '#' : (castleIsCheck ? '+' : '');
                        console.log(`[AI] ${aiSide} Selected move > {castle from: '${from}', to: '${to}'}${checkSuffix}`);
                        console.log('[AI] Castle move recorded to history:', castleMove);
                        gameState.isWhiteTurn = !gameState.isWhiteTurn;
                        lastCommittedBoardState = getBoardState();
                        
                        // Check for game over
                        if (castleIsCheckmate) {
                            gameState.gameOver = true;
                            gameState.winner = piece.isWhite ? 'white' : 'black';
                            console.log(`[AI] Checkmate! ${gameState.winner} wins!`);
                        } else if (castleIsStalemate) {
                            gameState.gameOver = true;
                            gameState.winner = 'draw';
                            console.log('[AI] Stalemate! Game is a draw.');
                        }
                        
                        updateUI();
                    }
                    return;
                }

                // Handle capture with same slide-off animation as player
                const target = gameState.pieces[toKey];
                if (target) {
                    // Safety check: never capture the king (this should never happen with correct move gen)
                    if (target.type === 'king') {
                        console.error('[AI] CRITICAL: Attempted to capture king! Move rejected.', { from, to, target });
                        return;
                    }
                    capturePieceToZone(target, toKey);
                }

                // Smooth three-phase animation for AI move (lift -> slide -> drop)
                const targetX = (toCol - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
                const targetZ = (toRow - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
                const targetY = BOARD_SURFACE_Y + 0.5;

                const startPos = piece.mesh.position.clone();
                const liftY = Math.max(startPos.y, targetY) + 1.2; // lift above board and current height
                const mid1 = new THREE.Vector3(startPos.x, liftY, startPos.z);
                const mid2 = new THREE.Vector3(targetX, liftY, targetZ);
                const endPos = new THREE.Vector3(targetX, targetY, targetZ);

                piece.body.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased);
                piece.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
                piece.body.setAngvel({ x: 0, y: 0, z: 0 }, true);

                snappingPieces.set(piece, {
                    mode: 'aiThreePhase',
                    start: startPos,
                    mid1,
                    mid2,
                    end: endPos,
                    startTime: performance.now(),
                    durUp: 200,
                    durFlat: 250,
                    durDown: 200
                });

                piece.row = toRow;
                piece.col = toCol;
                piece.hasMoved = true;
                delete gameState.pieces[fromKey];
                gameState.pieces[toKey] = piece;

                if (promotionType) {
                    piece.promotionPendingType = promotionType;
                    if (!snappingPieces.has(piece)) {
                        piece = applyPromotion(piece, promotionType);
                    }
                }

                // Check if opponent is in check/checkmate/stalemate after this move
                const newBoardState = getBoardState();
                const opponentColor = !piece.isWhite;
                const boardForOutcome = (promotionType && newBoardState[to] && newBoardState[to].type !== promotionType)
                    ? { ...newBoardState, [to]: { ...newBoardState[to], type: promotionType } }
                    : newBoardState;
                const opponentIsInCheck = simulatedCheck;
                const opponentIsCheckmate = AI.isCheckmate(boardForOutcome, opponentColor);
                const opponentIsStalemate = AI.isStalemate(boardForOutcome, opponentColor);

                const recordedPieceType = promotionType || piece.type;
                
                const moveToRecord = { from, to, isWhite: piece.isWhite, piece: recordedPieceType, isCapture: !!target, isCheck: opponentIsInCheck, isCheckmate: opponentIsCheckmate, promotion: promotionType || undefined };
                gameState.moveHistory.push(moveToRecord);
                const aiSide = piece.isWhite ? 'White' : 'Black';
                const checkSuffix = opponentIsCheckmate ? '#' : (opponentIsInCheck ? '+' : '');
                console.log(`[AI] ${aiSide} Selected move > {${recordedPieceType} from: '${from}', to: '${to}'}${checkSuffix}`);
                console.log('[AI] Move recorded to history:', moveToRecord);
                lastCommittedBoardState = getBoardState();
                gameState.isWhiteTurn = !gameState.isWhiteTurn;
                
                // Check for game over
                if (opponentIsCheckmate) {
                    gameState.gameOver = true;
                    gameState.winner = piece.isWhite ? 'white' : 'black';
                    console.log(`[AI] Checkmate! ${gameState.winner} wins!`);
                } else if (opponentIsStalemate) {
                    gameState.gameOver = true;
                    gameState.winner = 'draw';
                    console.log('[AI] Stalemate! Game is a draw.');
                }
                
                updateUI();
            }
        };
        
        function easeOutCubic(t) {
            t = Math.min(Math.max(t, 0), 1);
            return 1 - Math.pow(1 - t, 3);
        }
        
        function updateMousePosition(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }
        
        function getPieceUnderMouse() {
            raycaster.setFromCamera(mouse, camera);
            const pieceMeshes = Object.values(gameState.pieces).map(p => p.mesh);
            const intersects = raycaster.intersectObjects(pieceMeshes, false);
            
            if (intersects.length > 0) {
                const hitObject = intersects[0].object;
                for (let key in gameState.pieces) {
                    const piece = gameState.pieces[key];
                    if (piece.mesh === hitObject) {
                        return { piece, key };
                    }
                }
            }
            return null;
        }
        
        function updateDraggedPiecePosition() {
            if (!draggedPiece) return;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(dragPlane, _dragPlaneIntersect)) {
                const { piece } = draggedPiece;
                const targetY = DRAG_PLANE_Y;
                let yNow = targetY;
                
                if (piece.dragAnim) {
                    const now = performance.now();
                    const d = piece.dragAnim.duration || DRAG_RISE_DURATION_MS;
                    const t = (now - piece.dragAnim.startTime) / Math.max(1, d);
                    const k = easeOutCubic(t);
                    yNow = piece.dragAnim.startY + (targetY - piece.dragAnim.startY) * k;
                    
                    // Animate rotation to upright
                    const uprightQuat = new THREE.Quaternion(); // Identity = upright
                    piece.mesh.quaternion.slerpQuaternions(piece.dragAnim.startQuat, uprightQuat, k);
                    piece.body.setNextKinematicRotation(piece.mesh.quaternion);
                    
                    if (t >= 1) piece.dragAnim = null;
                }
                
                const newPos = _dragPlaneIntersect.clone().add(dragOffset);
                newPos.y = yNow;
                piece.body.setNextKinematicTranslation({ x: newPos.x, y: newPos.y, z: newPos.z });
                piece.mesh.position.set(newPos.x, newPos.y, newPos.z);
                
                // Update X marker position on board surface directly under piece
                xMarker.position.set(piece.mesh.position.x, BOARD_SURFACE_Y, piece.mesh.position.z);
            }
        }
        
        function onMouseDown(event) {
            if (event.button !== 0) return; // Only left click
            if (gameState.gameOver) return; // Don't allow moves after game is over
            if (promotionState || promotionPending) return; // Wait for promotion choice
            
            updateMousePosition(event);
            const result = getPieceUnderMouse();
            
            if (result) {
                draggedPiece = result;
                const { piece } = result;
                piece.isDragging = true;
                piece.didCapture = false;  // Track if capture was performed during this drag
                piece.startNotation = getPieceSquareNotation(piece);
                
                // Snapshot camera state to protect against unwanted rotations during right-click
                cameraSnapshot.position.copy(camera.position);
                cameraSnapshot.target.copy(controls.target);
                cameraSnapshot.valid = true;
                
                // Make piece kinematic while dragging
                piece.body.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased);
                piece.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
                piece.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
                
                // Start rise animation from current height
                piece.dragAnim = { 
                    startTime: performance.now(), 
                    startY: piece.mesh.position.y,
                    startQuat: piece.mesh.quaternion.clone(),
                    duration: DRAG_RISE_DURATION_MS 
                };
                
                // Calculate drag offset immediately from current mouse position
                raycaster.setFromCamera(mouse, camera);
                if (raycaster.ray.intersectPlane(dragPlane, _dragPlaneIntersect)) {
                    dragOffset.copy(piece.mesh.position).sub(_dragPlaneIntersect);
                    // Trigger an initial update so it starts rising on click
                    updateDraggedPiecePosition();
                    xMarker.visible = true;
                }
                
                // Get valid moves and highlight squares
                const currentSquare = getPieceSquareNotation(piece);
                if (currentSquare) {
                    const boardState = getBoardState();
                    const validMoveNotations = getValidMoves(currentSquare, piece, boardState);
                    const castleTarget = getCastleTarget(piece);
                    highlightSquares(validMoveNotations, castleTarget);
                }
                
                controls.enabled = false; // Disable camera controls while dragging
            }
        }
        
        function onMouseMove(event) {
            updateMousePosition(event);
            
            // If right-click was just pressed and we're dragging, save camera state
            // to detect if it changed unexpectedly
            if (draggedPiece && event.buttons === 1) {
                // Only left button pressed (not right), this is normal drag
            }
        }

        function onMouseDownCapture(event) {
            // Detect right-click (button 2) while dragging for capture or castle
            if (event.button !== 2) return; // Only right click
            
            if (!draggedPiece) return; // Only during drag
            
            // Prevent context menu from appearing during drag
            event.preventDefault();
            event.stopPropagation();

            // Find which square is currently under the piece
            const currentSquare = getPieceSquareNotation(draggedPiece.piece);
            if (!currentSquare) return;

            // Check if this square is a castle target
            const square = Array.from(boardGroup.children).find(s => s.userData.notation === currentSquare);
            if (square && square.userData.isCastle) {
                // The castle target is the piece at the castleNotation square
                const { row, col } = squareToRowCol(currentSquare);
                const targetKey = `${row}_${col}`;
                const targetPiece = gameState.pieces[targetKey];
                
                // The dragged piece and target piece: one is king, one is rook
                const draggedPiece_ = draggedPiece.piece;
                
                // Determine which is king and which is rook
                let king, rook;
                if (draggedPiece_.type === 'king') {
                    king = draggedPiece_;
                    rook = targetPiece;
                } else {
                    king = targetPiece;
                    rook = draggedPiece_;
                }
                
                // Mark as castle for onMouseUp to execute
                draggedPiece_.isCastleMove = true;
                draggedPiece_.castleKing = king;
                draggedPiece_.castleRook = rook;
                return;
            }

            // Check if this square is a capture target
            const move = lastHighlightedMoves.find(m => {
                const notation = typeof m === 'string' ? m : m.notation;
                return notation === currentSquare && (typeof m === 'object' ? m.isCapture : false);
            });

            if (!move || !move.isCapture) return; // Not a capture square

            // Find and capture the piece on this square
            const { row, col } = squareToRowCol(currentSquare);
            const key = `${row}_${col}`;
            let targetPiece = gameState.pieces[key];
            
            // Handle en passant - if no piece on destination but it's a pawn capture, 
            // the captured pawn is on an adjacent square (one row back in direction of opponent)
            if (!targetPiece && draggedPiece.piece.type === 'pawn') {
                const draggedFromRow = squareToRowCol(draggedPiece.piece.startNotation).row;
                const draggedFromCol = squareToRowCol(draggedPiece.piece.startNotation).col;
                
                // En passant target is on the same rank as the pawn's starting position
                // If moving down (increasing row), captured pawn is at current row - 1
                // If moving up (decreasing row), captured pawn is at current row + 1
                const capturedPawnRow = draggedFromRow < row ? row - 1 : row + 1;
                const capturedPawnKey = `${capturedPawnRow}_${col}`;
                targetPiece = gameState.pieces[capturedPawnKey];
                
                if (targetPiece && targetPiece.isWhite !== draggedPiece.piece.isWhite) {
                    draggedPiece.piece.didCapture = true;
                    draggedPiece.piece.captureTargetPiece = targetPiece;
                    draggedPiece.piece.captureTargetKey = capturedPawnKey;
                    return;
                }
            }

            if (targetPiece && targetPiece !== draggedPiece.piece && targetPiece.isWhite !== draggedPiece.piece.isWhite) {
                draggedPiece.piece.didCapture = true;  // Mark that a capture occurred
                draggedPiece.piece.captureTargetPiece = targetPiece;
                draggedPiece.piece.captureTargetKey = key;
            }
            // DO NOT clear drag state here - let onMouseUp handle it naturally
        }
        
        function onMouseUp(event) {
            if (draggedPiece) {
                const { piece } = draggedPiece;
                
                // Check if this was a castle move (marked in onMouseDownCapture)
                if (piece.isCastleMove && piece.castleKing && piece.castleRook) {
                    executeCastle(piece.castleKing, piece.castleRook);
                    piece.isCastleMove = false;
                    piece.castleKing = null;
                    piece.castleRook = null;
                    
                    // Clear drag state and highlights
                    piece.dragAnim = null;
                    piece.isDragging = false;
                    draggedPiece = null;
                    clearHighlights();
                    xMarker.visible = false;
                    piece.didCapture = false;
                    // Drag ended; stop protecting camera state
                    cameraSnapshot.valid = false;
                    
                    // Castle animation handles its own physics, so just return
                    return;
                }
                // Check if this was a capture move (marked in onMouseDownCapture)
                else if (piece.didCapture && piece.captureTargetPiece) {
                    capturePieceToZone(piece.captureTargetPiece, piece.captureTargetKey);
                    piece.captureTargetPiece = null;
                    piece.captureTargetKey = null;
                }
                
                // Clear drag animation state
                piece.dragAnim = null;
                piece.isDragging = false;
                draggedPiece = null;
                
                // Clear highlights and marker
                clearHighlights();
                xMarker.visible = false;
                
                // DO NOT re-enable controls yet - wait until snapping/sliding are done
                // controls will be re-enabled once animations complete

                // Snap and record pending move
                const fromNotation = piece.startNotation;
                const toNotation = getPieceSquareNotation(piece);
                let snapStarted = false;
                if (fromNotation && toNotation) {
                    const { row: fromRow, col: fromCol } = squareToRowCol(fromNotation);
                    const { row: toRow, col: toCol } = squareToRowCol(toNotation);
                    if (fromNotation !== toNotation) {
                        // Update logical board mapping without physically teleporting
                        const fromKey = `${fromRow}_${fromCol}`;
                        const toKey = `${toRow}_${toCol}`;
                        
                        // Check if there's a piece at destination BEFORE we move
                        const wasCapture = !!gameState.pieces[toKey] || piece.didCapture;
                        
                        delete gameState.pieces[fromKey];
                        gameState.pieces[toKey] = piece;
                        piece.row = toRow;
                        piece.col = toCol;

                        // Prepare smooth snap animation to square center
                        const targetX = (toCol - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
                        const targetZ = (toRow - BOARD_SIZE / 2) * SQUARE_SIZE + SQUARE_SIZE / 2;
                        const targetY = BOARD_SURFACE_Y + 0.5;
                        piece.body.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased);
                        piece.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
                        piece.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
                        snappingPieces.set(piece, {
                            start: piece.mesh.position.clone(),
                            end: new THREE.Vector3(targetX, targetY, targetZ),
                            startTime: performance.now(),
                            duration: 250
                        });
                        snapStarted = true;

                        // wasCapture was already determined before moving the piece
                        pendingMove = { from: fromNotation, to: toNotation, isWhite: piece.isWhite, piece: piece.type, isCapture: wasCapture };
                        if (isPawnPromotionSquare(piece)) {
                            showPromotionModal(piece);
                        }
                    }
                }

                // If we didn't start a snap animation, restore dynamic body now
                if (!snapStarted) {
                    piece.body.setBodyType(RAPIER.RigidBodyType.Dynamic);
                    piece.body.wakeUp();
                    // No animations pending; re-enable controls immediately
                    if (snappingPieces.size === 0 && slidingOffPieces.size === 0) {
                        controls.enabled = true;
                    }
                }
                
                // Reset capture/castle flags for next move
                piece.didCapture = false;
                // Drag ended; stop protecting camera state
                cameraSnapshot.valid = false;
                
                // Safety: if no animations are running at all, ensure controls are enabled
                if (!snapStarted && snappingPieces.size === 0 && slidingOffPieces.size === 0) {
                    controls.enabled = true;
                }
            }
        }
        
        renderer.domElement.addEventListener('mousedown', onMouseDown, false);
        renderer.domElement.addEventListener('mousedown', onMouseDownCapture, false);
        renderer.domElement.addEventListener('mousemove', onMouseMove, false);
        renderer.domElement.addEventListener('mouseup', onMouseUp, false);
        renderer.domElement.addEventListener('mouseleave', onMouseUp, false);
        
        // Prevent context menu from showing during piece drag - use capture phase and document level
        document.addEventListener('contextmenu', (event) => {

            if (draggedPiece || event.target === renderer.domElement || event.target.closest('canvas')) {

                event.stopPropagation();
                event.stopImmediatePropagation();

        }, true); // Use capture phase to intercept early

        document.getElementById('endTurnBtn').addEventListener('click', () => {

                return;

            // Fallback: if pendingMove went missing, try to reconstruct from board diff
            if (!pendingMove && lastCommittedBoardState) {
                const currentState = getBoardState();
                const missing = Object.keys(lastCommittedBoardState).filter(k => !currentState[k]);
                const added = Object.keys(currentState).filter(k => !lastCommittedBoardState[k]);
                if (missing.length === 1 && added.length === 1) {
                    const movedPiece = currentState[added[0]];
                    pendingMove = { from: missing[0], to: added[0], isWhite: movedPiece.isWhite, piece: movedPiece.type };
                    console.log('[END TURN] Reconstructed pendingMove', pendingMove);
                }
            }

            if (!pendingMove) {
                console.warn('[END TURN] No pendingMove; aborting end turn');
                return;
            }
            
            // Check if opponent is in check/checkmate/stalemate
            const finalBoardState = getBoardState();
            const opponentColor = !pendingMove.isWhite;
            const opponentIsInCheck = AI.isKingInCheck(finalBoardState, opponentColor);
            const opponentIsCheckmate = AI.isCheckmate(finalBoardState, opponentColor);
            const opponentIsStalemate = AI.isStalemate(finalBoardState, opponentColor);
            pendingMove.isCheck = opponentIsInCheck;
            pendingMove.isCheckmate = opponentIsCheckmate;
            
            // Log player move with piece type and check notation
            const playerSide = pendingMove.isWhite ? 'White' : 'Black';
            const playerCheckNotation = opponentIsCheckmate ? '#' : (opponentIsInCheck ? '+' : '');
            console.log(`[Player] ${playerSide} Selected move > {${pendingMove.piece} from: '${pendingMove.from}', to: '${pendingMove.to}'}${playerCheckNotation}`);
            console.log('[Player] Move recorded to history:', pendingMove);
            
            gameState.moveHistory.push(pendingMove);
