                    const highCardsInHand = hand.filter((sc) => {
                        const rv = getCardRankValue(sc.card);
                        return rv === aceRank || rv === kingRank || rv === twoRank;
                    }).length;
                    if (highCardsInHand > 3 && Math.random() < 0.35) return true;
                }
                return false;
            }
            
            // Standard logic for larger hands with non-critical cards
            const roll = Math.random();
            if (breaksStraight && roll < 0.45) return true;
            return false;
        }

        function selectGroupWithMinHigh(bucket, count, minSuitHigh) {
            if (bucket.length < count) return null;
            if (minSuitHigh < 0) return bucket.slice(0, count);
            const sorted = [...bucket].sort((a, b) => getCardSuitValue(a.card) - getCardSuitValue(b.card));
            const highCard = sorted.find((sc) => getCardSuitValue(sc.card) > minSuitHigh);
            if (!highCard) return null;
            const rest = sorted.filter((sc) => sc !== highCard).slice(0, count - 1);
            if (rest.length < count - 1) return null;
            return rest.concat(highCard);
        }

        function getStraightPlayAbove(hand, trick, length, groupSize) {
            const buckets = getRankBuckets(hand);
            const maxRank = rankOrder.length - 1;
            const rankValues = Array.from({ length: rankOrder.length }, (_, i) => i);

            for (let start = 0; start + length - 1 <= maxRank; start++) {
                const seq = rankValues.slice(start, start + length);
                if (!seq.every((rv) => buckets.has(rv) && buckets.get(rv).length >= groupSize)) continue;

                const highRank = seq[seq.length - 1];
                const needSuitHigh = (trick && highRank === trick.rankHigh)
                    ? trick.suitHigh
                    : -1;
                const highBucket = buckets.get(highRank);
                const highGroup = selectGroupWithMinHigh(highBucket, groupSize, needSuitHigh);
                if (!highGroup) continue;

                const selected = [];
                for (const rv of seq) {
                    const bucket = buckets.get(rv);
                    if (rv === highRank) {
                        selected.push(...highGroup);
                    } else {
                        selected.push(...bucket.slice(0, groupSize));
                    }
                }

                const pattern = {
                    type: groupSize === 1 ? 'straight' : (groupSize === 2 ? 'double-straight' : 'triple-straight'),
                    cardCount: length * groupSize,
                    rankHigh: highRank,
                    suitHigh: getHighestSuitValue(highGroup)
                };
                if (canPlayPattern(pattern, trick)) return selected;
            }
            return null;
        }

        function aiTakeTurn(playerIndex) {
            if (gameState.currentPlayer !== playerIndex) return;
            const hand = playerCards[playerIndex];
            if (!hand.length) {
                advanceTurn();
                return;
            }
            if (gameState.passed.has(playerIndex)) {
                advanceTurn();
                return;
            }
            if (!gameState.trick) {
                let play = null;
                if (gameState.mustInclude3S) {
                    const forced = hand.find(isThreeOfSpades);
                    if (forced) play = [forced];
                }
                if (!play) {
                    play = getBestStartingPlay(hand);
                }
                if (play) {
                    setAiSelection(playerIndex, play);
                    setAiHoverCard(playerIndex, play[0]);
                    const delay = st(650 + Math.random() * 450);
                    setTimeout(() => {
                        if (gameState.currentPlayer !== playerIndex) return;
                        clearAiHover(playerIndex);
                        playCardsForPlayer(playerIndex, play);
                        clearAiSelection(playerIndex);
                    }, delay);
                } else {
                    advanceTurn();
                }
                return;
            }
            const trick = gameState.trick;
            let play = null;
            if (trick.type === 'single') {
                if (trick.rankHigh === rankValue.get('2')) {
                    play = getGroupPlayAbove(hand, { type: 'four', cardCount: 4, rankHigh: -1, suitHigh: -1 }, 4, 'four');
                }
                if (!play) play = getSinglePlayAbove(hand, trick);
            } else if (trick.type === 'pair') {
                play = getGroupPlayAbove(hand, trick, 2, 'pair');
            } else if (trick.type === 'triple') {
                play = getGroupPlayAbove(hand, trick, 3, 'triple');
            } else if (trick.type === 'four') {
                play = getGroupPlayAbove(hand, trick, 4, 'four');
            } else if (trick.type === 'straight') {
                play = getStraightPlayAbove(hand, trick, trick.cardCount, 1);
            } else if (trick.type === 'double-straight') {
                play = getStraightPlayAbove(hand, trick, trick.cardCount / 2, 2);
            } else if (trick.type === 'triple-straight') {
                play = getStraightPlayAbove(hand, trick, trick.cardCount / 3, 3);
            }

            if (play && shouldAiPass(trick, play, hand)) {
                play = null;
            }

            if (play) {
                setAiSelection(playerIndex, play);
                setAiHoverCard(playerIndex, play[0]);
                const delay = st(700 + Math.random() * 500);
                setTimeout(() => {
                    if (gameState.currentPlayer !== playerIndex) return;
                    clearAiHover(playerIndex);
                    playCardsForPlayer(playerIndex, play);
                    clearAiSelection(playerIndex);
                }, delay);
            } else {
                clearAiSelection(playerIndex);
                const delay = st(450 + Math.random() * 300);
                setTimeout(() => {
                    if (gameState.currentPlayer !== playerIndex) return;
                    gameState.passed.add(playerIndex);
                    console.log(`[PASS] Player ${playerIndex} passed. Passed set now: [${Array.from(gameState.passed).join(', ')}]. trickPlayersCount: ${gameState.trickPlayersCount}, will end trick if passed.size (${gameState.passed.size}) >= ${gameState.trickPlayersCount - 1}`);
                    recordPlayerMove(playerIndex, 'Pass');
                    advanceTurn();
                }, delay);
            }
        }

        function maybeAutoPlay() {
            // In debug mode, human controls all players
            if (gameMode === 'debug') return;
            if (gameState.currentPlayer === 0) return;
            if (gameState.aiPending) return;
            gameState.aiPending = true;
            const delay = st(900 + Math.random() * 700);
            setTimeout(() => {
                gameState.aiPending = false;
                aiTakeTurn(gameState.currentPlayer);
            }, delay);
        }

        function findPlayerWithThreeSpades() {
            for (let i = 0; i < playerCards.length; i++) {
                if (playerCards[i].some(isThreeOfSpades)) return i;
            }
            return 0;
        }

        function startRound(startPlayer, mustInclude3S) {
            gameState.currentPlayer = startPlayer;
            gameState.leadPlayer = startPlayer;
            gameState.lastPlayed = null;
            gameState.trick = null;
            gameState.trickPlayersCount = null;
            gameState.passed.clear();
            gameState.mustInclude3S = mustInclude3S;
            playStackCounter = 0;
            for (let i = 0; i < lastMoves.length; i++) {
                if (playerPlacements[i] === null) {
                    lastMoves[i] = '—';
                }
            }
            renderMoveHistory();
            updateTurnStatus();
        }

        function sortCardsForTableFan(cards) {
            return [...cards].sort((a, b) => {
                const ra = getCardRankValue(a.card);
                const rb = getCardRankValue(b.card);
                if (ra !== rb) return ra - rb;
                return getCardSuitValue(a.card) - getCardSuitValue(b.card);
            });
        }

        function moveCardsToPile(cards, pos, pattern = null, options = {}) {
            const fanTypes = new Set(['straight', 'double-straight', 'triple-straight', 'pair', 'triple']);
            const useHandOffsets = options.useHandOffsets ?? false;
            const handFanPlayerIndex = options.handFanPlayerIndex;
            const useTableArc = options.useTableArc ?? false;
            const shouldFan = !useHandOffsets && pattern && cards.length > 1 && fanTypes.has(pattern.type);
            const ordered = shouldFan ? sortCardsForTableFan(cards) : cards;
            const count = ordered.length;
            const mid = (count - 1) / 2;
            const spread = CARD.width * 0.45;
            const arcDepth = CARD.length * 0.08;
            const angleSpread = 0.12;
            const usePhysics = options.usePhysics ?? false;
            const tossScale = options.tossScale ?? 0.3;
            const faceUp = options.faceUp ?? false;
            const useShoeSlots = options.useShoeSlots ?? false;
            const slotBase = useShoeSlots ? playStackCounter : 0;
            if (useShoeSlots) playStackCounter += ordered.length;

            let handOffsets = null;
            let handYawMap = null;
            let tableArcOffsets = null;
            if (useHandOffsets) {
                const center = ordered.reduce((acc, sc) => {
                    if (!sc.mesh.userData.basePos) setMeshBasePosition(sc.mesh);
                    acc.x += sc.mesh.userData.basePos.x;
                    acc.z += sc.mesh.userData.basePos.z;
                    return acc;
                }, { x: 0, z: 0 });
                center.x /= Math.max(1, ordered.length);
                center.z /= Math.max(1, ordered.length);
                handOffsets = new Map();
                if (handFanPlayerIndex !== undefined && playerPositions[handFanPlayerIndex]) {
                    const base = playerPositions[handFanPlayerIndex];
                    const forward = getPlayerForwardXZ(base);
                    const right = getRightFromForward(forward);
                    const bySpread = [...ordered].sort((a, b) => {
                        if (!a.mesh.userData.basePos) setMeshBasePosition(a.mesh);
                        if (!b.mesh.userData.basePos) setMeshBasePosition(b.mesh);
                        const ax = a.mesh.userData.basePos.x - center.x;
                        const az = a.mesh.userData.basePos.z - center.z;
                        const bx = b.mesh.userData.basePos.x - center.x;
                        const bz = b.mesh.userData.basePos.z - center.z;
                        const aProj = ax * right.x + az * right.z;
                        const bProj = bx * right.x + bz * right.z;
                        return aProj - bProj;
                    });
                    const fanCount = bySpread.length;
                    const yawSpread = Math.PI / 4;
                    handYawMap = new Map();
                    bySpread.forEach((sc, i) => {
                        const t = fanCount > 1 ? i / (fanCount - 1) : 0.5;
                        const yaw = (1 - 2 * t) * yawSpread;
                        handYawMap.set(sc, yaw);
                    });
                }
                ordered.forEach((sc) => {
                    if (!sc.mesh.userData.basePos) setMeshBasePosition(sc.mesh);
                    handOffsets.set(sc, {
                        x: sc.mesh.userData.basePos.x - center.x,
                        z: sc.mesh.userData.basePos.z - center.z,
                        rotY: getObjectYRotation(sc.mesh)
                    });
                });
            }

            if (useTableArc && ordered.length > 1) {
                // Rotate arc orientation based on player position
                // Player 0 (front): 0°, Player 1 (right): -90°, Player 2 (back): 180°, Player 3 (left): 90°
                const arcPlayerIndex = options.arcPlayerIndex ?? 0;
                const rotationAngles = [0, -Math.PI/2, Math.PI, Math.PI/2];
                const arcRotation = rotationAngles[arcPlayerIndex] || 0;
                
                const forward = { 
                    x: -Math.sin(arcRotation), 
                    z: Math.cos(arcRotation) 
                };
                
                const right = { 
                    x: Math.cos(arcRotation), 
                    z: Math.sin(arcRotation) 
                };
                const startOffset = -(ordered.length - 1) / 2;
                const midT = 0.5;
                const midScaled = 0.5 + (midT - 0.5) * HAND_FAN.arcSpan;
                const midOffset = (startOffset + midT * (ordered.length - 1))
                    * HAND_FAN.spread
                    * getCardSpreadMultiplier(Math.round(midT * (ordered.length - 1)), ordered.length, midScaled)
                    * HAND_FAN.arcSpan;
                const midDepth = midT * (ordered.length - 1) * HAND_FAN.depthStep;
                const midArc = getArcHeightAtParameter(midScaled) * HAND_FAN.arcLift;
                const midX = right.x * midOffset + forward.x * midDepth;
                const midZ = right.z * midOffset + forward.z * midDepth;
                
                // Rotation quaternion to orient the arc toward the player
                const arcRotationQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), arcRotation);
                
                tableArcOffsets = ordered.map((_, idx) => {
                    const t = ordered.length > 1 ? idx / (ordered.length - 1) : 0.5;
                    const tScaled = 0.5 + (t - 0.5) * HAND_FAN.arcSpan;
                    const spreadMultiplier = getCardSpreadMultiplier(Math.round(t * (ordered.length - 1)), ordered.length, tScaled);
                    const offset = (startOffset + t * (ordered.length - 1)) * HAND_FAN.spread * spreadMultiplier * HAND_FAN.arcSpan;
                    const depthOffset = t * (ordered.length - 1) * HAND_FAN.depthStep;
                    const localX = right.x * offset + forward.x * depthOffset;
                    const localZ = right.z * offset + forward.z * depthOffset;
                    
                    // Apply twist in local space (before rotation), then rotate entire system
                    const twistAngle = (1 - 2 * t) * (Math.PI / 4);
                    const localTwistQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), twistAngle);
                    
                    // Combine: first twist in local space, then rotate to face player
                    let targetQuat = arcRotationQuat.clone().multiply(localTwistQuat);
                    
                    // Add 180° card flip for Player 4 and Player 2 (indices 1 and 3)
                    if (arcPlayerIndex === 1 || arcPlayerIndex === 3) {
                        const cardFlipQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
                        targetQuat = targetQuat.multiply(cardFlipQuat);
                    }
                    
                    return { x: localX - midX, z: localZ - midZ, quat: targetQuat };
                });
            }

            ordered.forEach((sc, idx) => {
                let toX = pos.x + (idx % 4) * 0.04;
                let toZ = pos.z + Math.floor(idx / 4) * 0.04;
                let toY = pos.y + idx * CARD.thickness * 1.1;
                let rotY = 0;
                let toQuat = null;

                if (useShoeSlots) {
                    const slotIndex = slotBase + idx;
                    const slot = shoeStackSlots[slotIndex];
                    if (slot) toY = slot.y;
                }

                // Single card plays with table arc - orient toward player using quaternion
                // Use same rotation system as multi-card arcs to ensure consistency
                if (useTableArc && !tableArcOffsets && options.arcPlayerIndex !== undefined) {
                    const rotationAngles = [0, -Math.PI/2, Math.PI, Math.PI/2];
                    const arcRotation = rotationAngles[options.arcPlayerIndex] || 0;
                    
                    // Add 180° card flip for Player 4 and Player 2 (indices 1 and 3)
                    let cardFlipAdjustment = 0;
                    if (options.arcPlayerIndex === 1 || options.arcPlayerIndex === 3) {
                        cardFlipAdjustment = Math.PI;
                    }
                    
                    const finalRotation = arcRotation + cardFlipAdjustment;
                    toQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), finalRotation);
                }

                if (useTableArc && tableArcOffsets) {
                    const arc = tableArcOffsets[idx];
                    toX = pos.x + arc.x;
                    toZ = pos.z + arc.z;
                    toQuat = arc.quat;
                } else if (shouldFan) {
                    const offset = (idx - mid) * spread;
                    const arcT = mid > 0 ? Math.abs(idx - mid) / mid : 0;
                    const arcFactor = 0.5 * (1 + Math.cos(Math.PI * arcT));
                    const depth = (arcFactor - 1) * arcDepth;
                    toX = pos.x + offset;
                    toZ = pos.z + depth;
                    toY = pos.y + idx * CARD.thickness * 1.1;
                    rotY = (idx - mid) * angleSpread;
                } else if (useHandOffsets && handOffsets?.has(sc)) {
                    const offset = handOffsets.get(sc);
                    toX = pos.x + offset.x;
                    toZ = pos.z + offset.z;
                    rotY = handYawMap?.get(sc) ?? offset.rotY;
                } else if (usePhysics) {
                    // Stack plays directly on center for single/stacked hands
                    toX = pos.x;
                    toZ = pos.z;
                }

                if (usePhysics) {
                    const fromPos = {
                        x: sc.mesh.position.x,
                        y: sc.mesh.position.y,
                        z: sc.mesh.position.z
                    };
                    enableCardPhysics(sc, fromPos, { x: toX, y: toY, z: toZ }, toQuat || rotY, tossScale, faceUp);
                } else {
                    const slideOpts = toQuat
                        ? { useMesh: true, toQuat }
                        : { useMesh: true, rotX: 0, rotY, rotZ: 0 };
                    addSlideTween(
                        sc,
                        sc.mesh.position.x,
                        sc.mesh.position.z,
                        toX,
                        toZ,
                        sc.mesh.position.y,
                        toY,
                        st(280),
                        slideOpts
                    );
                }
            });
        }

        function enableCardPhysics(sc, fromPos, targetPos, rotYOrQuat = 0, tossScale = 0.25, faceUp = false) {
            if (!sc.body.world) {
                world.addBody(sc.body);
            }
            sc.body.type = CANNON.Body.DYNAMIC;
            sc.body.mass = CARD_MASS;
            sc.body.updateMassProperties();
            sc.body.linearDamping = 0.7;
            sc.body.angularDamping = 0.6;
            sc.body.position.set(fromPos.x, fromPos.y, fromPos.z);
            
            // Handle quaternion or euler angle
            if (rotYOrQuat instanceof THREE.Quaternion) {
                sc.body.quaternion.set(rotYOrQuat.x, rotYOrQuat.y, rotYOrQuat.z, rotYOrQuat.w);
            } else {
                sc.body.quaternion.setFromEuler(0, rotYOrQuat, 0);
            }
            
            if (!sc.body.userData) sc.body.userData = {};
            if (faceUp) {
                sc.body.fixedRotation = false;
                sc.body.angularFactor.set(1, 1, 1);
                sc.body.userData.faceUpLimit = true;
                sc.body.userData.pileLock = true;
            } else {
                sc.body.fixedRotation = false;
                sc.body.angularFactor.set(1, 1, 1);
                sc.body.userData.faceUpLimit = false;
                sc.body.userData.pileLock = false;
            }
            // Remember target Y so we can snap after sleep to avoid z-fighting
            sc.body.userData.targetY = targetPos.y;
            const dx = targetPos.x - fromPos.x;
            const dy = targetPos.y - fromPos.y;
            const dz = targetPos.z - fromPos.z;
            const dist = Math.hypot(dx, dy, dz) || 1;
            const g = Math.abs(world.gravity.y);
            const baseTime = Math.max(0.28, Math.min(0.55, dist / 3.2));
            const flightTime = baseTime / (0.6 + tossScale);
            sc.body.velocity.set(
                dx / flightTime,
                (dy + 0.5 * g * flightTime * flightTime) / flightTime,
                dz / flightTime
            );
            if (faceUp) {
                // Reduced tumble on X/Z for natural settling; full Y spin
                sc.body.angularVelocity.set(
                    (Math.random() - 0.5) * tossScale * 0.3,
                    (Math.random() - 0.5) * tossScale,
                    (Math.random() - 0.5) * tossScale * 0.3
                );
            } else {
                sc.body.angularVelocity.set((Math.random() - 0.5) * tossScale, (Math.random() - 0.5) * tossScale, (Math.random() - 0.5) * tossScale);
            }
            sc.body.wakeUp();
            sc.mesh.position.copy(sc.body.position);
            sc.mesh.quaternion.copy(sc.body.quaternion);
            setMeshBasePosition(sc.mesh);
        }

        function clampFaceUpTilt(sc) {
            if (!sc.body?.userData?.faceUpLimit) return;
            const maxTilt = Math.PI / 8;  // ~22.5° to prevent clipping while allowing settling
            const quat = new THREE.Quaternion(
                sc.body.quaternion.x,
                sc.body.quaternion.y,
                sc.body.quaternion.z,
                sc.body.quaternion.w
            );
            const euler = new THREE.Euler().setFromQuaternion(quat, 'YXZ');
            const clampedX = Math.max(-maxTilt, Math.min(maxTilt, euler.x));
            const clampedZ = Math.max(-maxTilt, Math.min(maxTilt, euler.z));
            if (clampedX !== euler.x || clampedZ !== euler.z) {
                const fixedQuat = new THREE.Quaternion().setFromEuler(
                    new THREE.Euler(clampedX, euler.y, clampedZ, 'YXZ')
                );
                sc.body.quaternion.set(fixedQuat.x, fixedQuat.y, fixedQuat.z, fixedQuat.w);
                sc.body.angularVelocity.set(0, 0, 0);
            }
        }

        function getAllCardRefs() {
            const set = new Set();
            shoeCards.forEach((sc) => set.add(sc));
            playerCards.forEach((hand) => hand.forEach((sc) => set.add(sc)));
            currentHandCards.forEach((sc) => set.add(sc));
            return Array.from(set);
        }

        function cancelActiveTweensOnCards(cardsToStop) {
            // Remove any active tweens that are animating these specific cards
            // This prevents tween conflicts when re-animating cards to new positions
            const cardSet = new Set(cardsToStop);
            for (let i = activeTweens.length - 1; i >= 0; i--) {
                const twn = activeTweens[i];
                if (cardSet.has(twn.sc)) {
                    activeTweens.splice(i, 1);
                }
            }
        }

        function clearTrickPile(context = 'unknown') {
            console.log(`[CLEAR TRICK] Before: currentHandCards has ${currentHandCards.length} cards`);
            if (!currentHandCards.length) {
                console.log(`[CLEAR TRICK] No cards to clear!`);
                return;
            }
            const movedCards = [...currentHandCards];
            
            // Cancel any active tweens on these cards to prevent animation conflicts
            cancelActiveTweensOnCards(movedCards);
            
            moveCardsToPile(currentHandCards, DISCARD_POS, null, { usePhysics: false, faceUp: false });
            currentHandCards = [];
            console.log(`[CLEAR TRICK] After: currentHandCards cleared`);
            setTimeout(() => {
                verifyTrickCardsCleared(context, movedCards);
            }, st(360));
        }

        function nextActivePlayer(fromIndex) {
            const clockwiseOrder = [1, 0, 3, 2];
            const total = clockwiseOrder.length;
            let pos = clockwiseOrder.indexOf(fromIndex);
            if (pos === -1) pos = 0;
            for (let i = 0; i < total; i++) {
                pos = (pos + 1) % total;
                const idx = clockwiseOrder[pos];
                // Skip players with no cards OR who have passed this trick
                if (playerCards[idx].length > 0 && !gameState.passed.has(idx)) return idx;
            }
            return fromIndex;
        }

        function nextPlayerWithCards(fromIndex) {
            const clockwiseOrder = [1, 0, 3, 2];
            const total = clockwiseOrder.length;
            let pos = clockwiseOrder.indexOf(fromIndex);
            if (pos === -1) pos = 0;
            for (let i = 0; i < total; i++) {
                pos = (pos + 1) % total;
                const idx = clockwiseOrder[pos];
                if (playerCards[idx].length > 0) return idx;
            }
            return fromIndex;
        }

        function checkRoundEnd() {
            const active = playerCards.filter((hand) => hand.length > 0).length;
            return active <= 1;
        }

        function animateEndGameTransition(callback) {
            console.log('Starting end-game transition animation...');
            const shoePos = SHOE_POS;
            
            // Flip all cards face-down and collect them to center
            const allCards = [];
            playerCards.forEach(hand => hand.forEach(sc => allCards.push(sc)));
            if (currentHandCards.length) allCards.push(...currentHandCards);
            shoeCards.forEach(sc => allCards.push(sc));
            
            console.log(`Collecting ${allCards.length} cards to center pile...`);
            
            // Flip each card face-down and move to center shoe position
            allCards.forEach((sc, idx) => {
                // Flip to face-down (rotate 180° on X)
                const faceDownQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI);
                
                // Animate to shoe center with slight randomness to avoid overlap during movement
                const randomX = (Math.random() - 0.5) * 0.3;
                const randomZ = (Math.random() - 0.5) * 0.3;
                const targetY = shoePos.y + idx * CARD.thickness * 0.5; // Stack height with buffer
                
                addSlideTween(
                    sc,
                    sc.mesh.position.x,
                    sc.mesh.position.z,
                    shoePos.x + randomX,
                    shoePos.z + randomZ,
                    sc.mesh.position.y,
                    targetY,
                    st(600),
                    {
                        useMesh: true,
                        toQuat: faceDownQuat,
                        lift: 0.2
                    }
                );
            });
            
            // Let shuffleShoe handle camera movement (saves player 1 POV and animates to shoe)
            // Start shuffle once animations settle
            setTimeout(() => {
                if (callback) callback();
            }, st(800));
        }

        function restartGameAfterRound(loserIndex) {
            const totalPlayers = playerCards.length;
            const winnerIndex = finishOrder.length > 0 ? finishOrder[0] : -1;

            if (loserIndex >= 0 && playerPlacements[loserIndex] === null) {
                const placement = finishOrder.length + 1;
                playerPlacements[loserIndex] = placement;
                const lastText = lastMoves[loserIndex] ?? '—';
                lastMoves[loserIndex] = `${lastText} - ${formatPlacement(placement)} place`;
                renderMoveHistory();
            }

            if (winnerIndex >= 0 && winnerIndex < totalPlayers) {
                gameState.leadPlayer = winnerIndex;
            }

            gameState.round += 1;
            gameState.currentPlayer = gameState.leadPlayer;
            gameState.lastPlayed = null;
            gameState.trick = null;
            gameState.trickPlayersCount = null;
            gameState.passed.clear();
            gameState.mustInclude3S = false;
            playStackCounter = 0;
            clearSelection();

            // Reset placements for the new game and re-deal a fresh shoe
            resetPlacementsForNewGame();
            
            // Animate transition: collect cards, flip to face-down, move to center
            animateEndGameTransition(() => {
                currentHandCards = [];
                initializeShoe();
                shuffleShoe(true);
            });
        }

        function advanceTurn() {
            // First check: does the active trick need to end before we check for round-end?
            // Compute pass threshold from live state so players still get a response turn
            // when the last-played player goes out.
            if (gameState.trick) {
                const activePlayersWithCards = playerCards
                    .map((hand, idx) => ({ idx, hasCards: hand.length > 0 }))
                    .filter((entry) => entry.hasCards)
                    .map((entry) => entry.idx);
                const activeResponders = gameState.lastPlayed === null
                    ? activePlayersWithCards
                    : activePlayersWithCards.filter((idx) => idx !== gameState.lastPlayed);
                const activePassedCount = activeResponders.filter((idx) => gameState.passed.has(idx)).length;
                const requiredPasses = activeResponders.length;

                if (requiredPasses > 0 && activePassedCount >= requiredPasses) {
                console.log(`[TRICK END] Clearing trick. Passed(responders): ${activePassedCount}, Required: ${requiredPasses}, ActiveWithCards: ${activePlayersWithCards.length}`);
                console.log(`[TRICK END] Responders: [${activeResponders.join(', ')}], Passed: [${Array.from(gameState.passed).join(', ')}]`);
                console.log(`[TRICK END] currentHandCards count: ${currentHandCards.length}`);
                clearTrickPile('advanceTurn:pass-threshold-reached');
                gameState.trick = null;
                gameState.trickPlayersCount = null;
                gameState.passed.clear();
                let nextLead = gameState.lastPlayed ?? gameState.leadPlayer;
                if (playerCards[nextLead].length === 0) {
                    console.log(`[TRICK END] Last played player ${nextLead} has no cards, finding next with cards`);
                    nextLead = nextPlayerWithCards(nextLead);
                    console.log(`[TRICK END] Next lead player (after out): ${nextLead}`);
                }
                gameState.currentPlayer = nextLead;
                gameState.leadPlayer = gameState.currentPlayer;
                gameState.mustInclude3S = false;
                // Clear selection when turn changes in debug mode
                if (gameMode === 'debug') clearSelection();
                // Refresh arc debug line for new player if enabled
                if (debugState.showArcLine) {
                    setArcDebugLinesVisible(true, gameState.currentPlayer);
                }
                // Now check if the game has ended after trick completion
                if (checkRoundEnd()) {
                    const loserIndex = playerCards.findIndex((hand) => hand.length > 0);
                    console.log(`[GAME END] Game over after trick end! Loser: ${loserIndex}, currentHandCards: ${currentHandCards.length}`);
                    if (loserIndex >= 0) {
                        setStatus(`Round over — ${getPlayerLabel(loserIndex)} loses.`);
                    }
                    updateActionButtons();
                    setTimeout(() => {
                        restartGameAfterRound(loserIndex);
                    }, st(1200));
                    return;
                }
                checkOpenHandState('advanceTurn:post-trick-end-before-status');
                updateTurnStatus();
                return;
                }
            }

            // Second check: now see if the game/round has ended
            if (checkRoundEnd()) {
                const loserIndex = playerCards.findIndex((hand) => hand.length > 0);
                console.log(`[GAME END] Game over! Loser: ${loserIndex}, currentHandCards: ${currentHandCards.length}`);
                if (loserIndex >= 0) {
                    setStatus(`Round over — ${getPlayerLabel(loserIndex)} loses.`);
                }
                updateActionButtons();
                setTimeout(() => {
                    restartGameAfterRound(loserIndex);
                }, st(1200));
                return;
            }

            gameState.currentPlayer = nextActivePlayer(gameState.currentPlayer);
            // Clear selection when turn changes in debug mode
            if (gameMode === 'debug') clearSelection();
            // Refresh arc debug line for new player if enabled
            if (debugState.showArcLine) {
                setArcDebugLinesVisible(true, gameState.currentPlayer);
            }
            checkOpenHandState('advanceTurn:normal-turn-advance');
            updateTurnStatus();
        }

        function playCardsForPlayer(playerIndex, cards) {
            const pattern = evaluatePattern(cards);
            
            // In debug mode, skip all validation checks
            if (gameMode !== 'debug') {
                if (!pattern) {
                    if (playerIndex === 0) setStatus('Invalid pattern selected.');
                    return false;
                }
                if (!gameState.trick && gameState.mustInclude3S && !cards.some(isThreeOfSpades)) {
                    if (playerIndex === 0) setStatus('First play must include the 3♠.');
                    return false;
                }
                if (!canPlayPattern(pattern, gameState.trick)) {
                    if (playerIndex === 0) setStatus('Selected cards do not beat the current hand.');
                    return false;
                }
            }

            if (!gameState.trick && currentHandCards.length > 0) {
                reportTrickCardError('Attempting to start a new hand while previous cards still tracked on table', 'playCardsForPlayer:pre-play-open-hand', {
                    playerIndex,
                    attemptedCards: cards.map((sc) => formatCardDebug(sc)),
                    likelyCause: 'Previous trick may not have been cleared before opening a new hand.'
                });
            }

            playerCards[playerIndex] = playerCards[playerIndex].filter((sc) => !cards.includes(sc));
            // Clear selection after playing cards (for any player in debug mode)
            clearSelection();
            gameState.trick = pattern;
            // Record how many players have cards now (before anyone goes out from this play)
            gameState.trickPlayersCount = playerCards.filter((hand) => hand.length > 0).length;
            console.log(`[PLAY CARDS] Player ${playerIndex} played ${cards.length} card(s). trickPlayersCount set to ${gameState.trickPlayersCount}. Remaining hands: [${playerCards.map(h => h.length).join(', ')}]`);
            gameState.lastPlayed = playerIndex;
            gameState.passed.delete(playerIndex);
            const highCard = getHighestCard(cards);
            const moveLabel = `${describePattern(pattern)} — ${formatCard(highCard)}`;
            recordPlayerMove(playerIndex, moveLabel);
            currentHandCards = currentHandCards.concat(cards);
            console.log(`[PLAY CARDS] currentHandCards now has ${currentHandCards.length} cards total`);
            moveCardsToPile(cards, TRICK_POS, pattern, { usePhysics: false, faceUp: true, useShoeSlots: true, useTableArc: true, arcPlayerIndex: playerIndex });
            fanPlayerHand(playerIndex);
            gameState.mustInclude3S = false;
            if (playerCards[playerIndex].length === 0) {
                console.log(`[PLAY CARDS] Player ${playerIndex} is out after this play`);
                markPlayerFinished(playerIndex, moveLabel);
            }
            advanceTurn();
            return true;
        }

        function playSelectedCards() {
            // In debug mode, allow current player to play; in AI mode, only player 0
            const controllablePlayer = gameMode === 'debug' ? gameState.currentPlayer : 0;
            if (gameState.currentPlayer !== controllablePlayer) return;
            const selected = playerCards[controllablePlayer].filter((sc) => selectedCards.has(sc));
            if (!selected.length) {
                setStatus('Select cards to play.');
                return;
            }
            if (!playCardsForPlayer(controllablePlayer, selected)) return;
        }

        function passTurn() {
            // In debug mode, allow current player to pass; in AI mode, only player 0
            const controllablePlayer = gameMode === 'debug' ? gameState.currentPlayer : 0;
            if (gameState.currentPlayer !== controllablePlayer) return;
            // In debug mode, allow passing even on open hands
            if (gameMode !== 'debug' && !gameState.trick) {
                setStatus('You cannot pass on an open hand.');
                return;
            }
            gameState.passed.add(controllablePlayer);
            console.log(`[PASS] Player ${controllablePlayer} (human) passed. Passed set now: [${Array.from(gameState.passed).join(', ')}]. trickPlayersCount: ${gameState.trickPlayersCount}, will end trick if passed.size (${gameState.passed.size}) >= ${gameState.trickPlayersCount - 1}`);
            recordPlayerMove(controllablePlayer, 'Pass');
            clearSelection();
            advanceTurn();
        }

        const HAND_FAN = {
            lift: 0.35,
            spread: CARD.width * 0.6,
            forwardOffset: 0.38,
            thicknessStep: 0,
            depthStep: CARD.thickness,
            arcLift: CARD.thickness * 200,
            arcSpan: 0.55,
            settleLift: 0.05,
            settleTime: 420
        };

        function getPlayerForwardXZ(pos) {
            const len = Math.hypot(pos.x, pos.z) || 1;
            return { x: pos.x / len, z: pos.z / len };
        }

        function getRightFromForward(forward) {
            return { x: forward.z, z: -forward.x };
        }

        // Smooth mathematical arc function
        // Takes a normalized parameter t from 0 (left edge) to 1 (right edge)
        // Returns the height multiplier (0 at edges, 1 at center)
        function getArcHeightAtParameter(t) {
            // Normalize t to range -1 to 1 (left to right)
            const x = (t - 0.5) * 2;
            // Slightly higher and uniformly steeper arc
            const amplitude = 1.5;
            const tightness = 1.2;
            const scaledX = x * tightness;
            const base = 1 - (scaledX * scaledX);
            return base * amplitude;
        }

        // Calculate height contribution from the arc at a given normalized distance from center
        function getCardHeightOnArc(cardIndex, totalCards, arcLift, tOverride) {
            // Map card index to parameter from 0 to 1
            const t = tOverride ?? (totalCards > 1 ? cardIndex / (totalCards - 1) : 0.5);
            const arcFactor = getArcHeightAtParameter(t);
            return arcFactor * arcLift;
        }

        // Calculate spread multiplier at a given normalized distance from center
        function getCardSpreadMultiplier(cardIndex, totalCards, tOverride) {
            const t = tOverride ?? (totalCards > 1 ? cardIndex / (totalCards - 1) : 0.5);
            const normalizedDistance = Math.abs(t - 0.5) * 2;
            
            // Taper inward at edges: full spread (1.0) at center, reduced at edges
            return 1.0 - (0.12 * normalizedDistance);
        }

        // Debug function: Draw the arc line for a player
        function drawDebugArcLine(playerIndex, numCards = 13) {
            const base = playerPositions[playerIndex];
            const forward = getPlayerForwardXZ(base);
            const right = getRightFromForward(forward);
            const startOffset = -(numCards - 1) / 2;
            
            const pivotX = base.x + forward.x * HAND_FAN.forwardOffset;
            const pivotZ = base.z + forward.z * HAND_FAN.forwardOffset;
            const pivotY = TABLE_Y_SHIFT + HAND_FAN.lift;
            
            let axis = 'z';
            if (playerIndex === 1 || playerIndex === 3) {
                axis = 'x';
            }
            
            const points = [];
            // Sample 100 points along the smooth arc curves
            for (let sample = 0; sample <= 100; sample++) {
                const t = sample / 100; // 0 to 1
                const tScaled = 0.5 + (t - 0.5) * HAND_FAN.arcSpan;
                const spreadMultiplier = getCardSpreadMultiplier(Math.round(t * (numCards - 1)), numCards, tScaled);
                const offset = (startOffset + t * (numCards - 1)) * HAND_FAN.spread * spreadMultiplier * HAND_FAN.arcSpan;
                const depthOffset = t * (numCards - 1) * HAND_FAN.depthStep;
                
                let px = pivotX + forward.x * depthOffset;
                let py = pivotY + t * (numCards - 1) * HAND_FAN.thicknessStep;
                const arcHeight = getArcHeightAtParameter(tScaled) * HAND_FAN.arcLift;
                py += arcHeight;
                py -= CARD.thickness / 2;
                
                let pz = pivotZ + forward.z * depthOffset;
                
                if (axis === 'z') {
                    px = pivotX + right.x * offset;
                } else {
                    pz = pivotZ + right.z * offset;
                }
                
                points.push(new THREE.Vector3(px, py, pz));
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            return line;
        }

        function drawTableArcLine(numCards = 13, playerIndex = 0) {
            // Apply same rotation logic as actual card placement
            const rotationAngles = [0, -Math.PI/2, Math.PI, Math.PI/2];
            const arcRotation = rotationAngles[playerIndex] || 0;
            
            const forward = { 
                x: -Math.sin(arcRotation), 
                z: Math.cos(arcRotation) 
            };
            
            const right = { 
                x: Math.cos(arcRotation), 
                z: Math.sin(arcRotation) 
            };
            
            const startOffset = -(numCards - 1) / 2;

            const pivotX = TRICK_POS.x;
            const pivotZ = TRICK_POS.z;
            const pivotY = TRICK_POS.y;

            const midT = 0.5;
            const midScaled = 0.5 + (midT - 0.5) * HAND_FAN.arcSpan;
            const midOffset = (startOffset + midT * (numCards - 1)) * HAND_FAN.spread * getCardSpreadMultiplier(Math.round(midT * (numCards - 1)), numCards, midScaled) * HAND_FAN.arcSpan;
            const midDepth = midT * (numCards - 1) * HAND_FAN.depthStep;
            const midArc = getArcHeightAtParameter(midScaled) * HAND_FAN.arcLift;
            const midPx = right.x * midOffset + forward.x * midDepth;
            const midPz = right.z * midOffset + forward.z * midDepth;

            const points = [];
            for (let sample = 0; sample <= 100; sample++) {
                const t = sample / 100;
                const tScaled = 0.5 + (t - 0.5) * HAND_FAN.arcSpan;
                const spreadMultiplier = getCardSpreadMultiplier(Math.round(t * (numCards - 1)), numCards, tScaled);
                const offset = (startOffset + t * (numCards - 1)) * HAND_FAN.spread * spreadMultiplier * HAND_FAN.arcSpan;
                const depthOffset = t * (numCards - 1) * HAND_FAN.depthStep;

                let px = right.x * offset + forward.x * depthOffset;
                let pz = right.z * offset + forward.z * depthOffset;

                px -= midPx;
                pz -= midPz;

                points.push(new THREE.Vector3(px + pivotX, pivotY, pz + pivotZ));
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xffaa00, linewidth: 2 });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            return line;
        }

        function getCardRefFromObject(obj) {
            let node = obj;
            while (node) {
                if (node.userData && node.userData.cardRef) return node.userData.cardRef;
                node = node.parent;
            }
            return null;
        }

        function setCardHighlight(sc, enabled) {
            sc.mesh.traverse((child) => {
                if (!child.isMesh || !child.material) return;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach((mat) => {
                    if (!mat.emissive) return;
                    if (mat.userData.baseEmissive === undefined) {
                        mat.userData.baseEmissive = mat.emissive.clone();
                    }
                    if (enabled) {
                        mat.emissive.set(0x334455);
                        mat.emissiveIntensity = 0.6;
                    } else {
                        mat.emissive.copy(mat.userData.baseEmissive);
                        mat.emissiveIntensity = 1;
                    }
                });
            });
        }

        function handleCardSelection(event) {
            // In debug mode, allow interaction with current player's hand
            // In AI mode, only allow player 0
            const controllablePlayer = gameMode === 'debug' ? gameState.currentPlayer : 0;
            if (gameState.currentPlayer !== controllablePlayer) return;
            const hand = playerCards[controllablePlayer];
            if (!hand.length) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(hand.map((sc) => sc.mesh), true);
            if (!hits.length) return;
            const sc = getCardRefFromObject(hits[0].object);
            if (!sc) return;
            toggleCardSelection(sc);
        }

        function toggleCardSelection(sc) {
            if (selectedCards.has(sc)) {
                selectedCards.delete(sc);
                setCardHighlight(sc, false);
            } else {
                selectedCards.add(sc);
                setCardHighlight(sc, true);
            }
        }

        function clearSelection() {
            selectedCards.forEach((sc) => setCardHighlight(sc, false));
            selectedCards.clear();
        }

        function updateHoveredCard() {
            // In debug mode, hover current player's cards; in AI mode, only player 0
            const controllablePlayer = gameMode === 'debug' ? gameState.currentPlayer : 0;
            if (gameState.currentPlayer !== controllablePlayer) {
                hoveredCard = null;
                return;
            }
            const hand = playerCards[controllablePlayer];
            if (!hand.length) {
                hoveredCard = null;
                return;
            }
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(hand.map((sc) => sc.mesh), true);
            if (!hits.length) {
                hoveredCard = null;
                return;
            }
            hoveredCard = getCardRefFromObject(hits[0].object);
        }

        function applyHoverOffsets() {
            // In debug mode, apply offsets to current player's cards; in AI mode, only player 0
            const controllablePlayer = gameMode === 'debug' ? gameState.currentPlayer : 0;
            const hand = playerCards[controllablePlayer];
            for (const sc of hand) {
                let state = hoverState.get(sc);
                if (!state) {
                    state = { current: 0 };
                    hoverState.set(sc, state);
                }
                let selState = selectState.get(sc);
                if (!selState) {
                    selState = { current: 0 };
                    selectState.set(sc, selState);
                }
                const isSelected = selectedCards.has(sc);
                const target = (!isSelected && sc === hoveredCard) ? 1 : 0;
                state.current += (target - state.current) * HOVER_LERP;
                const selectTarget = isSelected ? 1 : 0;
                selState.current += (selectTarget - selState.current) * SELECT_LERP;
                if (!sc.mesh.userData.basePos) {
                    setMeshBasePosition(sc.mesh);
                }
                const basePos = sc.mesh.userData.basePos;
                const liftAmount = (HOVER_LIFT * state.current) + (SELECT_LIFT * selState.current);
                if (liftAmount > 0.001) {
                    hoverForward.set(0, 0, -1).applyQuaternion(sc.mesh.quaternion).normalize();
                    sc.mesh.position.copy(basePos).addScaledVector(hoverForward, liftAmount);
                } else {
                    sc.mesh.position.copy(basePos);
                }
            }
        }

        function getAiSelectedSet(playerIndex) {
            if (!aiSelectedByPlayer.has(playerIndex)) {
                aiSelectedByPlayer.set(playerIndex, new Set());
            }
            return aiSelectedByPlayer.get(playerIndex);
        }

        function setAiSelection(playerIndex, cards) {
            const set = getAiSelectedSet(playerIndex);
            set.clear();
            cards.forEach((sc) => set.add(sc));
        }

        function clearAiSelection(playerIndex) {
            const set = getAiSelectedSet(playerIndex);
            set.clear();
        }

        function setAiHoverCard(playerIndex, sc) {
            aiHoverByPlayer.set(playerIndex, sc);
        }

        function clearAiHover(playerIndex) {
            aiHoverByPlayer.delete(playerIndex);
        }

        function applyAiOffsets() {
            for (let playerIndex = 1; playerIndex < playerCards.length; playerIndex++) {
                // In debug mode, skip the current player (they use human controls)
                if (gameMode === 'debug' && playerIndex === gameState.currentPlayer) {
                    continue;
                }
                const hand = playerCards[playerIndex];
                const selected = getAiSelectedSet(playerIndex);
                const hovered = aiHoverByPlayer.get(playerIndex) ?? null;
                for (const sc of hand) {
                    let hover = aiHoverState.get(sc);
                    if (!hover) {
                        hover = { current: 0 };
                        aiHoverState.set(sc, hover);
                    }
                    let sel = aiSelectState.get(sc);
                    if (!sel) {
                        sel = { current: 0 };
                        aiSelectState.set(sc, sel);
                    }
                    const hoverTarget = sc === hovered ? 1 : 0;
                    hover.current += (hoverTarget - hover.current) * AI_HOVER_LERP;
                    const selectTarget = selected.has(sc) ? 1 : 0;
                    sel.current += (selectTarget - sel.current) * AI_SELECT_LERP;

                    if (!sc.mesh.userData.basePos) {
                        setMeshBasePosition(sc.mesh);
                    }
                    const basePos = sc.mesh.userData.basePos;
                    const liftAmount = (AI_HOVER_LIFT * hover.current) + (AI_SELECT_LIFT * sel.current);
                    if (liftAmount > 0.001) {
                        hoverForward.set(0, 0, -1).applyQuaternion(sc.mesh.quaternion).normalize();
                        sc.mesh.position.copy(basePos).addScaledVector(hoverForward, liftAmount);
                    } else {
                        sc.mesh.position.copy(basePos);
                    }
                }
            }
        }

        function fanPlayerHand(playerIndex) {
            const cards = playerCards[playerIndex];
            if (!cards.length) return;
            const base = playerPositions[playerIndex];
            const forward = getPlayerForwardXZ(base);
            const right = getRightFromForward(forward);
            const startOffset = -(cards.length - 1) / 2;

            let baseYaw = 0;
            let baseRotX = 0;
            let baseRotZ = 0;
            let axis = 'z';

            if (playerIndex === 0) {
                baseRotX = Math.PI / 2;
                baseRotZ = 0;
                baseYaw = 0;
                axis = 'z';
            } else if (playerIndex === 2) {
                baseRotX = Math.PI / 2;
                baseRotZ = Math.PI;
                baseYaw = 0;
                axis = 'z';
            } else if (playerIndex === 1) {
                baseRotX = Math.PI / 2;
                baseRotZ = Math.PI / 2;
                baseYaw = Math.PI;
                axis = 'x';
            } else if (playerIndex === 3) {
                baseRotX = Math.PI / 2;
                baseRotZ = -Math.PI / 2;
                baseYaw = Math.PI;
                axis = 'x';
            }

            const pivotX = base.x + forward.x * HAND_FAN.forwardOffset;
            const pivotZ = base.z + forward.z * HAND_FAN.forwardOffset;
            const pivotY = TABLE_Y_SHIFT + HAND_FAN.lift;

            cards.forEach((card, i) => {
                // Get spread multiplier from arc function
                const t = cards.length > 1 ? i / (cards.length - 1) : 0.5;
                const tScaled = 0.5 + (t - 0.5) * HAND_FAN.arcSpan;
                const spreadMultiplier = getCardSpreadMultiplier(i, cards.length, tScaled);
                const offset = (startOffset + i) * HAND_FAN.spread * spreadMultiplier * HAND_FAN.arcSpan;
                const depthOffset = i * HAND_FAN.depthStep;
                let targetX = pivotX + forward.x * depthOffset;
                let targetY = pivotY + i * HAND_FAN.thicknessStep;
                
                // Get height contribution from arc (replaces all the old if statements)
                const arcHeight = getCardHeightOnArc(i, cards.length, HAND_FAN.arcLift, tScaled);
                targetY += arcHeight;
                // Shift down so the arc runs along the bottom surface of each card
                targetY -= CARD.thickness / 2;
                
                let targetZ = pivotZ + forward.z * depthOffset;
                const rotX = baseRotX;
                const rotY = baseYaw;
                const rotZ = baseRotZ;
                const baseQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX, rotY, rotZ, 'YXZ'));
                const faceNormal = new THREE.Vector3(0, 1, 0).applyQuaternion(baseQuat).normalize();
                const twistAngle = (1 - 2 * t) * (Math.PI / 4);
                const twistQuat = new THREE.Quaternion().setFromAxisAngle(faceNormal, twistAngle);
                const targetQuat = twistQuat.multiply(baseQuat);

                if (axis === 'z') {
                    targetX = pivotX + right.x * offset;
                } else {
                    targetZ = pivotZ + right.z * offset;
                }

                const fromX = card.mesh.position.x;
                const fromZ = card.mesh.position.z;
                const fromY = card.mesh.position.y;

                addSlideTween(
                    card,
                    fromX,
                    fromZ,
                    targetX,
                    targetZ,
                    fromY,
                    targetY,
                    st(HAND_FAN.settleTime),
                    {
                        toRotY: rotY,
                        rotStart: 0,
                        rotEnd: 1,
                        rotX,
                        rotZ,
                        toQuat: targetQuat,
                        lift: HAND_FAN.settleLift,
                        useMesh: true
                    }
                );
            });
        }

        function fanAllHands() {
            for (let i = 0; i < playerCards.length; i++) {
                fanPlayerHand(i);
            }
        }

        // Deal cards one at a time, clockwise, face down in piles
        function dealCards() {
            console.log('Starting card deal... Total cards:', shoeCards.length);
            const TOTAL_CARDS = shoeCards.length;
            let cardIndex = TOTAL_CARDS - 1; // Start from TOP of deck (highest index)
            let cardDealtCount = 0;
            
            // Reset player cards for this round
            playerCards[0] = [];
            playerCards[1] = [];
            playerCards[2] = [];
            playerCards[3] = [];

            function dealNextCard() {
                if (cardDealtCount >= TOTAL_CARDS) {
                    console.log('All cards dealt! Total:', cardDealtCount);
                    setTimeout(() => {
                        fanAllHands();
                        const startPlayer = gameState.round === 1 ? findPlayerWithThreeSpades() : gameState.leadPlayer;
                        const mustInclude3S = gameState.round === 1;
                        startRound(startPlayer, mustInclude3S);
                    }, st(500));
                    return;
                }

                if (!shoeCards[cardIndex]) {
                    console.error('Card at index', cardIndex, 'is undefined. cardDealtCount:', cardDealtCount);
                    return;
                }

                const card = shoeCards[cardIndex];
                // Clockwise order starting from back (player position): Back->Right->Front->Left
                const actualPlayerIndex = ((2 - cardDealtCount) % 4 + 4) % 4;
                const targetPosition = playerPositions[actualPlayerIndex];
                const cardCount = playerCards[actualPlayerIndex].length;

                // Place at player position with slight offset for pile stacking
                const targetX = targetPosition.x + (Math.random() - 0.5) * 0.15;
                const targetZ = targetPosition.z + (Math.random() - 0.5) * 0.15;
                const targetY = TABLE_Y_SHIFT + CARD.thickness/2 + PILE_CLEARANCE_Y + cardCount * CARD.thickness * 0.08;
                const targetRotY = Math.atan2(targetPosition.x, targetPosition.z);

                // Store original position
                const fromX = card.mesh.position.x;
                const fromZ = card.mesh.position.z;
                const fromY = card.mesh.position.y;

                console.log('Dealing card', cardDealtCount, 'to', playerPositions[actualPlayerIndex].name, 'from cardIndex', cardIndex);

                // Temporarily remove card from physics to avoid collisions during dealing
                world.removeBody(card.body);

                // Animate card from deck to player pile using custom tween system
                addSlideTween(
                    card,
                    fromX,
                    fromZ,
                    targetX,
                    targetZ,
                    fromY,
                    targetY,
                    st(450),
                    { toRotY: targetRotY, rotStart: 0.45, rotEnd: 1, lift: 0.12, useMesh: true }
                );

                playerCards[actualPlayerIndex].push(card);
                cardIndex--; // Move to next card from top
                cardDealtCount++;

                // Deal next card after short delay
                const timeoutId = setTimeout(() => {
                    try {
                        dealNextCard();
                    } catch (err) {
                        console.error('Error in dealNextCard:', err);
                    }
                }, st(120));
            }

            dealNextCard();
        }

        // --- GUI ---
        if (gameMode === 'debug') {
            const gui = new GUI();
            
            const cameraFolder = gui.addFolder('Camera');
            cameraFolder.add(camera.position, 'x', -20, 20, 0.1).name('Camera X');
            cameraFolder.add(camera.position, 'y', 2, 20, 0.1).name('Camera Y');
            cameraFolder.add(camera.position, 'z', -20, 20, 0.1).name('Camera Z');
            
            const debugFolder = gui.addFolder('Debug');
            debugFolder.add(debugState, 'showCannonWireframes').name('Cannon Wireframes');
            debugFolder.add(debugState, 'showVisualWireframes').name('Visual Wireframe Mode');
            debugFolder.add(debugState, 'showArcLine').name('Show Arc Line').onChange((v) => {
                setArcDebugLinesVisible(v, v ? gameState.currentPlayer : null);
            });
            
            const roomSettings = {
                showDebug: false,
                ambientIntensity: ambientLight.intensity,
                ceilingLightIntensity: mainCeilingLight.intensity,
                bulbGlow: lightBulb.material.emissiveIntensity
            };
            const roomFolder = gui.addFolder('Room');
            roomFolder.add(roomSettings, 'showDebug').name('Show Debug Grid/Axes').onChange((v)=>{
                axes.visible = v;
                grid.visible = v;
            });
            roomFolder.add(roomSettings, 'ambientIntensity', 0, 2, 0.01).name('Ambient Intensity').onChange((v)=>{
                ambientLight.intensity = v;
            });
            roomFolder.add(roomSettings, 'ceilingLightIntensity', 0, 15, 0.1).name('Ceiling Light Intensity').onChange((v)=>{
                mainCeilingLight.intensity = v;
            });
            roomFolder.add(roomSettings, 'bulbGlow', 0, 8, 0.1).name('Bulb Glow').onChange((v)=>{
                lightBulb.material.emissiveIntensity = v;
            });
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            const timeNow = performance.now();
            
            world.step(1/60);
            updateCameraAnimation(timeNow);
            updateShuffleTweens(timeNow);
            
            const allCards = getAllCardRefs();
            for (let sc of allCards) {
                if (!sc.body || !sc.body.world) continue;
                
                // Prevent tunneling below the intended stack height while keeping motion natural
                if (sc.body.userData?.pileLock && sc.body.userData?.targetY !== undefined) {
                    if (sc.body.position.y < sc.body.userData.targetY) {
                        sc.body.position.y = sc.body.userData.targetY;
                        if (sc.body.velocity.y < 0) sc.body.velocity.y = 0;
                    }
                }
                
                clampFaceUpTilt(sc);
                sc.mesh.position.copy(sc.body.position);
                sc.mesh.quaternion.copy(sc.body.quaternion);
                setMeshBasePosition(sc.mesh);
            }

            updateHoveredCard();
            applyHoverOffsets();
            applyAiOffsets();
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
        const sortHandButton = document.getElementById('sort-hand');
        const playButton = document.getElementById('play-hand');
        const passButton = document.getElementById('pass-hand');
        sortHandButton.addEventListener('click', () => {
            // In debug mode, sort current player's hand; in AI mode, only player 0
            const controllablePlayer = gameMode === 'debug' ? gameState.currentPlayer : 0;
            sortPlayerHand(controllablePlayer);
        });
        playButton.addEventListener('click', () => {
            playSelectedCards();
        });
        passButton.addEventListener('click', () => {
            passTurn();
        });

        // Game mode selection
        window.selectGameMode = function(mode) {
            try {
                console.log('selectGameMode called with mode:', mode);
                gameMode = mode;
                const modal = document.getElementById('mode-selector-modal');
                if (modal) {
                    modal.style.display = 'none';
                    console.log('Modal hidden');
                } else {
                    console.error('Modal element not found!');
                    return;
                }
                console.log('Game mode set to:', mode);
                
                setTimeout(() => {
                    try {
                        console.log('Initializing shoe...');
                        initializeShoe();
                        setTimeout(() => {
                            console.log('Starting shuffle...');
                            shuffleShoe(true);
                        }, st(600));
                    } catch (err) {
                        console.error('Error in initialization:', err);
                    }
                }, 0);
            } catch (err) {
                console.error('Error in selectGameMode:', err);
            }
        };
    </script>
</body>
