<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Blackjack - Justin M. Perez</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        }

        body {
            overflow: hidden;
            background: #1a1a1a;
        }

        #c {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        nav {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
        }

        nav a {
            color: white;
            margin-right: 14px;
            text-decoration: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .btn {
            display: inline-block;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            background: rgba(255,255,255,0.1);
        }

        .game-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .game-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        .game-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-btn.primary {
            background: rgba(46, 204, 113, 0.8);
        }

        .game-btn.primary:hover {
            background: rgba(46, 204, 113, 1);
        }

        .game-btn.danger {
            background: rgba(231, 76, 60, 0.8);
        }

        .game-btn.danger:hover {
            background: rgba(231, 76, 60, 1);
        }

        .game-info {
            position: fixed;
            top: 60px;
            left: 10px;
            z-index: 100;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-size: 14px;
            line-height: 1.6;
        }

        .game-info h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .game-info .score {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0;
        }

        .game-info .dealer-score {
            color: #e74c3c;
        }

        .game-info .player-score {
            color: #2ecc71;
        }

        /* Hand history panel */
        .hand-history {
            position: fixed;
            top: 60px;
            right: 10px;
            z-index: 100;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-size: 13px;
            line-height: 1.4;
            max-width: 200px;
        }
        .hand-history h3 { margin: 0 0 8px 0; font-size: 16px; }
        .hand-history .entry { opacity: 0.85; margin-bottom: 6px; }
        .hand-history .entry.win { color: #2ecc71; }
        .hand-history .entry.loss { color: #e74c3c; }
        .hand-history .entry.push { color: #f1c40f; }
        .hand-history .entry.blackjack { text-shadow: 0 0 6px #f39c12; }
        .hand-history .label { font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="./index.html">Home</a>
        <a href="./projects.html">Projects</a>
        <a href="./resume.pdf" class="btn">Resume</a>
    </nav>

    <div class="game-info">
        <h3>Blackjack</h3>
        <div>Dealer: <span class="score dealer-score" id="dealerScore">0</span></div>
        <div>Player: <span class="score player-score" id="playerScore">0</span></div>
        <div style="margin-top: 10px;">Current Bet: <span class="score" id="currentBet" style="color: #f39c12;">$0</span></div>
        <div id="gameStatus" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div class="hand-history" id="handHistory">
        <h3>Recent Hands</h3>
        <div id="handHistoryEntries"></div>
    </div>

    <canvas id="c"></canvas>
    
    <div class="game-controls">
        <button id="dealBtn" class="game-btn primary">Deal</button>
        <button id="hitBtn" class="game-btn" disabled>Hit</button>
        <button id="standBtn" class="game-btn" disabled>Stand</button>
    </div>

    <script type="module">
        // Import cannon-es as ES module
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm';
        // Make it globally available
        window.CANNON = CANNON;
    </script>
    <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/": "./lib/three/",
        "lil-gui": "./lib/lil-gui/lil-gui.esm.js"
      }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- Real-world scaling helpers ---
        // Straight dealer-side width of our table in scene units (see createBlackjackTableShape)
        const TABLE_WIDTH_UNITS = 10.4;
        // Approx real blackjack table dealer-side width in meters (~83")
        const REAL_TABLE_WIDTH_M = 2.1;
        // Scene unit in meters
        const UNIT_IN_METERS = REAL_TABLE_WIDTH_M / TABLE_WIDTH_UNITS;

        // Standard casino card dimensions (meters)
        const CARD_REAL = { length: 0.0889, width: 0.0635, thickness: 0.0003 };
        // Derived card dimensions in scene units
        const CARD = {
            length: CARD_REAL.length / UNIT_IN_METERS,
            width: CARD_REAL.width / UNIT_IN_METERS,
            // Use a visual minimum thickness to avoid z-fighting while staying plausible
            thickness: Math.max(CARD_REAL.thickness / UNIT_IN_METERS, 0.0015)
        };
        // Horizontal spacing between cards when fanning a hand
        const CARD_SPACING = CARD.width * 1.2;

        // Standard casino chip dimensions (39mm diameter, 3mm thick in real world)
        const CHIP_REAL = { diameter: 0.039, thickness: 0.003 };
        const CHIP = {
            radius: (CHIP_REAL.diameter / 2) / UNIT_IN_METERS,
            thickness: CHIP_REAL.thickness / UNIT_IN_METERS
        };
        
        // Chip denominations with colors
        const CHIP_TYPES = {
            1: { color: 0xf0f0f0, edgeColor: 0xd0d0d0, label: '$1' },
            5: { color: 0xcc2222, edgeColor: 0x991111, label: '$5' },
            25: { color: 0x22bb22, edgeColor: 0x118811, label: '$25' },
            100: { color: 0x111111, edgeColor: 0x333333, label: '$100' },
            500: { color: 0x8822cc, edgeColor: 0x551188, label: '$500' }
        };

        // Global vertical adjustment so we can nudge the whole table up/down
        // Negative values lower the table relative to world y=0 (grid plane)
    const TABLE_Y_SHIFT = -0.13; // small nudge down for visual table body only
    // Canonical felt top Y (physics surface): x–z plane at y=0
    const FELT_TOP_Y = 0;
    // Drag plane height (defaults to felt). Update via setDragPlaneHeight(y).
        let DRAG_PLANE_Y = 0.2;
        // Duration in ms for chip to gently rise to the drag plane
        let DRAG_RISE_DURATION_MS = 500;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 6, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('c'),
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Anisotropy caps and current setting for card textures
        const MAX_ANISO = (renderer.capabilities.getMaxAnisotropy
            ? renderer.capabilities.getMaxAnisotropy()
            : (renderer.capabilities.maxAnisotropy || 1));
        let CARD_TEXTURE_ANISO = MAX_ANISO; // default to maximum supported

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 2.1;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xfff4e6, 0.5);
        scene.add(ambientLight);

    // --- Debug helpers: axes and wireframe plane on x-y at y=0 ---
    const axes = new THREE.AxesHelper(5);
    axes.visible = false; // hidden by default in man cave
    scene.add(axes);

    // Grid on x-z plane at y=0 to visualize table placement
    const grid = new THREE.GridHelper(30, 30, 0x00aaff, 0x334455);
    grid.material.opacity = 0.35;
    grid.material.transparent = true;
    grid.visible = false; // hidden by default in man cave
    scene.add(grid);

    // --- Man Cave Room ---
    const roomGroup = new THREE.Group();
    
    // Room dimensions (scaled to table; table is ~10 units wide, typical ceiling ~2.4-2.7m real)
    const ROOM = {
        width: 24,
        depth: 18,
        height: 12,          // increased from 8 to 12 for more realistic proportions
        wallThickness: 0.3,
        wainscotHeight: 2.6,
        floorY: -3.65,       // aligned with table base
        ceilingY: 8.35       // 12 units above floor
    };
    
    // Materials
    const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0xc9b89a, 
        roughness: 0.8, 
        metalness: 0.0 
    });
    
    // Upper walls - lighter charcoal with subtle texture variation
    const wallUpperMat = new THREE.MeshStandardMaterial({ 
        color: 0x3a3a3a,  // lighter than before (was 0x2a2a2a)
        roughness: 0.85, 
        metalness: 0.0,
        flatShading: false
    });
    
    // Wood paneling - richer tone with more variation
    const woodPanelMat = new THREE.MeshStandardMaterial({ 
        color: 0x4a3520,  // slightly warmer brown
        roughness: 0.65, 
        metalness: 0.05 
    });
    
    const ceilingMat = new THREE.MeshStandardMaterial({ 
        color: 0xe8dcc8, 
        roughness: 0.9, 
        metalness: 0.0 
    });
    
    const trimMat = new THREE.MeshStandardMaterial({ 
        color: 0x5a4738,  // slightly lighter trim for contrast
        roughness: 0.5, 
        metalness: 0.2 
    });
    
    // Floor
    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(ROOM.width, 0.2, ROOM.depth),
        floorMat
    );
    floor.position.set(0, ROOM.floorY, 0);
    floor.receiveShadow = true;
    roomGroup.add(floor);
    
    // Ceiling
    const ceiling = new THREE.Mesh(
        new THREE.BoxGeometry(ROOM.width, 0.2, ROOM.depth),
        ceilingMat
    );
    ceiling.position.set(0, ROOM.ceilingY, 0);
    ceiling.receiveShadow = true;
    roomGroup.add(ceiling);
    
    // Helper to create wall with wainscot
    function createWallWithWainscot(w, h, x, y, z, rotY) {
        const wallGroup = new THREE.Group();
        
        // Lower wood panel (wainscot)
        const wainscot = new THREE.Mesh(
            new THREE.BoxGeometry(w, ROOM.wainscotHeight, ROOM.wallThickness),
            woodPanelMat
        );
        wainscot.position.set(0, ROOM.wainscotHeight/2 + ROOM.floorY + 0.1, 0);
        wainscot.castShadow = true;
        wainscot.receiveShadow = true;
        wallGroup.add(wainscot);
        
        // Add vertical wood panel lines for texture (reduced density for performance)
        const panelLineCount = Math.floor(w / 1.2); // increased spacing from 0.8 to 1.2
        const panelLineMat = new THREE.MeshStandardMaterial({ 
            color: 0x332211, 
            roughness: 0.7, 
            metalness: 0.05 
        });
        for (let i = 0; i < panelLineCount; i++) {
            const lineX = -w/2 + (i + 0.5) * (w / panelLineCount);
            const line = new THREE.Mesh(
                new THREE.BoxGeometry(0.02, ROOM.wainscotHeight, ROOM.wallThickness + 0.02),
                panelLineMat
            );
            line.position.set(lineX, ROOM.wainscotHeight/2 + ROOM.floorY + 0.1, 0.01);
            line.castShadow = false; // disable shadow casting on decorative lines
            line.receiveShadow = false;
            wallGroup.add(line);
        }
        
        // Upper wall (dark paint)
        const upperH = h - ROOM.wainscotHeight - 0.3;
        const upper = new THREE.Mesh(
            new THREE.BoxGeometry(w, upperH, ROOM.wallThickness),
            wallUpperMat
        );
        upper.position.set(0, ROOM.wainscotHeight + upperH/2 + ROOM.floorY + 0.1, 0);
        upper.castShadow = true;
        upper.receiveShadow = true;
        wallGroup.add(upper);
        
        // Crown molding at top
        const crown = new THREE.Mesh(
            new THREE.BoxGeometry(w, 0.12, ROOM.wallThickness + 0.08),
            trimMat
        );
        crown.position.set(0, ROOM.ceilingY - 0.1, 0);
        crown.castShadow = true;
        wallGroup.add(crown);
        
        // Baseboard at bottom
        const baseboard = new THREE.Mesh(
            new THREE.BoxGeometry(w, 0.15, ROOM.wallThickness + 0.06),
            trimMat
        );
        baseboard.position.set(0, ROOM.floorY + 0.075, 0);
        baseboard.castShadow = true;
        wallGroup.add(baseboard);
        
        wallGroup.position.set(x, y, z);
        wallGroup.rotation.y = rotY;
        return wallGroup;
    }
    
    // Back wall (behind dealer)
    const roomBackWall = createWallWithWainscot(
        ROOM.width, 
        ROOM.height, 
        0, 
        0, 
        -ROOM.depth/2,
        0
    );
    roomGroup.add(roomBackWall);
    
    // Front wall (behind player) - mostly open for camera but with side segments
    const frontLeftWall = createWallWithWainscot(
        ROOM.width * 0.25,
        ROOM.height,
        -ROOM.width/2 + ROOM.width * 0.125,
        0,
        ROOM.depth/2,
        0
    );
    roomGroup.add(frontLeftWall);
    
    const frontRightWall = createWallWithWainscot(
        ROOM.width * 0.25,
        ROOM.height,
        ROOM.width/2 - ROOM.width * 0.125,
        0,
        ROOM.depth/2,
        0
    );
    roomGroup.add(frontRightWall);
    
    // Left wall with windows
    const leftWallWidth = ROOM.depth;
    const roomLeftWall = createWallWithWainscot(
        leftWallWidth,
        ROOM.height,
        -ROOM.width/2,
        0,
        0,
        Math.PI/2
    );
    roomGroup.add(roomLeftWall);
    
    // Right wall with windows
    const roomRightWall = createWallWithWainscot(
        leftWallWidth,
        ROOM.height,
        ROOM.width/2,
        0,
        0,
        Math.PI/2
    );
    roomGroup.add(roomRightWall);
    
    // Single large central ceiling light - wide angle to light entire room
    const mainCeilingLight = new THREE.SpotLight(0xfff4e6, 12, 40, Math.PI * 0.85, 0.25, 1.5);
    mainCeilingLight.position.set(0, ROOM.ceilingY - 0.2, 0);
    mainCeilingLight.castShadow = true;
    mainCeilingLight.shadow.mapSize.width = 1024; // reduced from 2048 for better performance
    mainCeilingLight.shadow.mapSize.height = 1024;
    mainCeilingLight.shadow.camera.near = 0.5;
    mainCeilingLight.shadow.camera.far = 40;
    mainCeilingLight.shadow.camera.fov = 110;
    mainCeilingLight.shadow.bias = -0.0001;
    mainCeilingLight.shadow.radius = 2; // soften shadows with blur instead of high resolution
    
    const lightTarget = new THREE.Object3D();
    lightTarget.position.set(0, 0, 0);
    scene.add(lightTarget);
    mainCeilingLight.target = lightTarget;
    roomGroup.add(mainCeilingLight);
    
    // Large ceiling fixture/ring for the main light
    const mainFixture = new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 0.7, 0.15, 16), // reduced segments from 32 to 16
        new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3, metalness: 0.7 })
    );
    mainFixture.position.set(0, ROOM.ceilingY - 0.08, 0);
    mainFixture.rotation.x = Math.PI;
    mainFixture.castShadow = false; // decorative element doesn't need to cast shadow
    roomGroup.add(mainFixture);
    
    // Visible light bulb (emissive sphere)
    const lightBulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 16, 12), // reduced segments from 24,16
        new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            emissive: 0xfff4e6, 
            emissiveIntensity: 5.0,
            roughness: 0.2,
            metalness: 0.1
        })
    );
    lightBulb.position.set(0, ROOM.ceilingY - 0.4, 0);
    roomGroup.add(lightBulb);
    
    // Built-in shelving on back wall
    function createShelf(width, depth, x, y, z) {
        const shelfGroup = new THREE.Group();
        
        // Main shelf surface
        const shelf = new THREE.Mesh(
            new THREE.BoxGeometry(width, 0.08, depth),
            woodPanelMat
        );
        shelf.position.set(0, 0, 0);
        shelf.castShadow = true;
        shelf.receiveShadow = true;
        shelfGroup.add(shelf);
        
        // Back support strip (against wall)
        const backSupport = new THREE.Mesh(
            new THREE.BoxGeometry(width, 0.12, 0.1),
            trimMat
        );
        backSupport.position.set(0, 0, -depth/2 + 0.05);
        backSupport.castShadow = true;
        backSupport.receiveShadow = true;
        shelfGroup.add(backSupport);
        
        // Side supports (vertical brackets)
        const sideSupport1 = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.3, depth * 0.7),
            trimMat
        );
        sideSupport1.position.set(-width/2 + 0.15, -0.15, 0);
        sideSupport1.castShadow = true;
        sideSupport1.receiveShadow = true;
        shelfGroup.add(sideSupport1);
        
        const sideSupport2 = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.3, depth * 0.7),
            trimMat
        );
        sideSupport2.position.set(width/2 - 0.15, -0.15, 0);
        sideSupport2.castShadow = true;
        sideSupport2.receiveShadow = true;
        shelfGroup.add(sideSupport2);
        
        shelfGroup.position.set(x, y, z);
        return shelfGroup;
    }
    
    // Left bookcase section
    const shelfDepth = 0.8;
    const shelfY1 = ROOM.wainscotHeight + 0.8 + ROOM.floorY;
    const shelfY2 = shelfY1 + 1.2;
    const shelfY3 = shelfY2 + 1.2;
    
    roomGroup.add(createShelf(3.5, shelfDepth, -7, shelfY1, -ROOM.depth/2 + shelfDepth/2 + 0.15));
    roomGroup.add(createShelf(3.5, shelfDepth, -7, shelfY2, -ROOM.depth/2 + shelfDepth/2 + 0.15));
    roomGroup.add(createShelf(3.5, shelfDepth, -7, shelfY3, -ROOM.depth/2 + shelfDepth/2 + 0.15));
    
    // Right shelf section
    roomGroup.add(createShelf(3.5, shelfDepth, 7, shelfY1, -ROOM.depth/2 + shelfDepth/2 + 0.15));
    roomGroup.add(createShelf(3.5, shelfDepth, 7, shelfY2, -ROOM.depth/2 + shelfDepth/2 + 0.15));
    roomGroup.add(createShelf(3.5, shelfDepth, 7, shelfY3, -ROOM.depth/2 + shelfDepth/2 + 0.15));
    
    // Simple book blocks on shelves
    function addBook(width, height, depth, x, y, z, colorHex) {
        const book = new THREE.Mesh(
            new THREE.BoxGeometry(width, height, depth),
            new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.8 })
        );
        book.position.set(x, y, z);
        book.castShadow = true;
        book.receiveShadow = true;
        roomGroup.add(book);
    }
    
    // Left shelf books
    const bookZ = -ROOM.depth/2 + 0.5;
    addBook(0.15, 0.5, 0.3, -8.2, shelfY1 + 0.29, bookZ, 0x8b0000);
    addBook(0.15, 0.45, 0.3, -8.0, shelfY1 + 0.27, bookZ, 0x2f4f4f);
    addBook(0.15, 0.52, 0.3, -7.8, shelfY1 + 0.30, bookZ, 0x556b2f);
    addBook(0.15, 0.48, 0.3, -7.6, shelfY1 + 0.28, bookZ, 0x8b4513);
    addBook(0.15, 0.50, 0.3, -7.4, shelfY1 + 0.29, bookZ, 0x191970);
    
    addBook(0.15, 0.48, 0.3, -8.1, shelfY2 + 0.28, bookZ, 0x800020);
    addBook(0.15, 0.50, 0.3, -7.9, shelfY2 + 0.29, bookZ, 0x2f4f2f);
    addBook(0.15, 0.46, 0.3, -7.7, shelfY2 + 0.27, bookZ, 0x654321);
    
    // Right shelf books
    addBook(0.15, 0.50, 0.3, 6.4, shelfY1 + 0.29, bookZ, 0x8b0000);
    addBook(0.15, 0.48, 0.3, 6.6, shelfY1 + 0.28, bookZ, 0x2f4f4f);
    addBook(0.15, 0.52, 0.3, 6.8, shelfY1 + 0.30, bookZ, 0x8b4513);
    addBook(0.15, 0.47, 0.3, 7.0, shelfY1 + 0.28, bookZ, 0x191970);
    
    scene.add(roomGroup);

        // --- Physics World ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);
        
        // Enable better collision detection between all shape types
        // This is critical for Trimesh-Cylinder collisions to work
        world.solver.iterations = 30; // Much higher for robust collision resolution
        world.solver.tolerance = 0.0001;
        world.defaultContactMaterial.contactEquationStiffness = 1e10; // Maximum stiffness
        world.defaultContactMaterial.contactEquationRelaxation = 1; // Less relaxation for firmer contacts
        
        // Allow narrowphase to check all collision pairs (slower but more accurate)
        if (world.narrowphase) {
            world.allowSleep = true;
        }
        
        // Physics materials for better collision
        const physTableMaterial = new CANNON.Material('table');
        const physCardMaterial = new CANNON.Material('card');
        
        const tableCardContact = new CANNON.ContactMaterial(physTableMaterial, physCardMaterial, {
            friction: 0.6,
            restitution: 0.1
        });
        world.addContactMaterial(tableCardContact);
        
        const cardCardContact = new CANNON.ContactMaterial(physCardMaterial, physCardMaterial, {
            friction: 0.5,
            restitution: 0.0
        });
        world.addContactMaterial(cardCardContact);
        
        // DEBUG: Log collision events
        world.addEventListener('beginContact', (event) => {
            const bodyA = event.bodyA;
            const bodyB = event.bodyB;
            const typeA = bodyA.userData?.type || 'unknown';
            const typeB = bodyB.userData?.type || 'unknown';
            if (typeA === 'chip' || typeB === 'chip') {
                // Try to extract contact details (penetration, normal, etc.)
                let contactInfo = '';
                if (event.contact) {
                    const c = event.contact;
                    contactInfo = ` | Penetration: ${c.penetration || c.getPenetration?.() || 'n/a'} | Normal: ${c.ni ? c.ni.toString() : 'n/a'} | rA: ${c.ri ? c.ri.toString() : 'n/a'} | rB: ${c.rj ? c.rj.toString() : 'n/a'}`;
                }
                console.log('COLLISION DETECTED:', typeA, 'vs', typeB, contactInfo);
            }
        });

        // --- Room Physics Boundaries ---

        // --- Blackjack Table ---
        // Create a proper blackjack table shape (curved player side, straight dealer side)
        function createBlackjackTableShape() {
            const shape = new THREE.Shape();
            
            // Table dimensions (scaled up by 30%)
            const tableWidth = 10.4; // 8 * 1.3
            const tableDepth = 6.5; // 5 * 1.3
            const curveRadius = 5.2; // 4 * 1.3
            
            // Start at bottom-left corner (dealer side)
            shape.moveTo(-tableWidth / 2, -tableDepth / 2);
            
            // Dealer side (straight)
            shape.lineTo(tableWidth / 2, -tableDepth / 2);
            
            // Right side
            shape.lineTo(tableWidth / 2, tableDepth / 2 - curveRadius);
            
            // Curved player side (using quadratic curve for smooth arc)
            const numCurveSegments = 32;
            for (let i = 0; i <= numCurveSegments; i++) {
                const angle = (i / numCurveSegments) * Math.PI;
                const x = Math.cos(angle) * curveRadius;
                const z = Math.sin(angle) * curveRadius;
                shape.lineTo(x, tableDepth / 2 - curveRadius + z);
            }
            
            // Left side
            shape.lineTo(-tableWidth / 2, tableDepth / 2 - curveRadius);
            shape.lineTo(-tableWidth / 2, -tableDepth / 2);
            
            return shape;
        }

        function createRailInnerPerimeterBoxColliders(options = {}) {
            if (!rapierReady || !rail || !rail.geometry) return 0;
            const cfg = Object.assign({ wireColor: 0xff00ff }, railPerimeterBoxConfig, options);
            const { spacing, bottomY, topY, radialDepth, tangentialWidth, normalOffset, wireColor } = cfg;
            const shape = createBlackjackTableShape();
            const totalLen = (typeof shape.getLength === 'function') ? shape.getLength() : null;
            const count = totalLen ? Math.max(4, Math.round(totalLen / spacing)) : 600;
            const pts = shape.getSpacedPoints(count);
            if (!pts || pts.length < 3) return 0;
            const halfY = (topY - bottomY) * 0.5;
            const hx = radialDepth * 0.5;
            const hz = tangentialWidth * 0.5;
            const centerY = bottomY + halfY;
            let created = 0;
            for (let i = 0; i < pts.length - 1; i++) {
                const pPrev = pts[(i - 1 + pts.length - 1) % (pts.length - 1)];
                const p = pts[i];
                const pNext = pts[(i + 1) % (pts.length - 1)];
                let tx = pNext.x - pPrev.x;
                let ty = pNext.y - pPrev.y;
                const tlen = Math.hypot(tx, ty); if (tlen < 1e-6) continue; tx /= tlen; ty /= tlen;
                const nA = { x: -ty, y: tx }; const nB = { x: ty, y: -tx };
                const dotA = nA.x * p.x + nA.y * p.y;
                const n2d = (dotA >= 0) ? nA : nB;
                const nLen = Math.hypot(n2d.x, n2d.y); if (nLen < 1e-6) continue;
                const inx = -n2d.x / nLen; const inz = -n2d.y / nLen;
                const cx = p.x + inx * (normalOffset + hx);
                const cz = p.y + inz * (normalOffset + hx);
                const yaw = Math.atan2(-inz, inx);
                const halfYaw = yaw * 0.5;
                const q = new RAPIER.Quaternion(0, Math.sin(halfYaw), 0, Math.cos(halfYaw));
                const colDesc = RAPIER.ColliderDesc.cuboid(hx, halfY, hz)
                    .setTranslation(cx, centerY, cz)
                    .setRotation(q)
                    .setFriction(0.6)
                    .setRestitution(0.1);
                const collider = rapierWorld.createCollider(colDesc);
                rapierRailPerimeterBoxColliders.push(collider);
                created++;
                const wfGeom = new THREE.BoxGeometry(hx * 2, halfY * 2, hz * 2);
                const edges = new THREE.EdgesGeometry(wfGeom);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: wireColor }));
                line.position.set(cx, centerY, cz);
                line.rotation.y = yaw;
                line.visible = debugState.showRapierWireframes;
                scene.add(line);
                rapierTableWireframes.push(line);
                rapierRailPerimeterBoxWireframes.push(line);

            if (debugState.showRapierWireframes) rapierRailPerimeterBoxWireframes.forEach(w => { if (w) w.visible = true; });
            return created;
        }

        // Helper to build Rapier trimesh from a mesh with world transform baked in
        function createRapierTrimeshFromMesh(mesh, offsetY = 0) {
            mesh.updateMatrixWorld(true);
            const geom = mesh.geometry.clone();
            geom.applyMatrix4(mesh.matrixWorld);
            const posAttr = geom.getAttribute('position');
            const indexAttr = geom.index;
            const verts = new Float32Array(posAttr.count * 3);
            for (let i = 0; i < posAttr.count; i++) {
                verts[i * 3 + 0] = posAttr.getX(i);
                verts[i * 3 + 1] = posAttr.getY(i);
                verts[i * 3 + 2] = posAttr.getZ(i);
            }
            let inds;
            if (indexAttr) {
                inds = new Uint32Array(indexAttr.count);
                for (let i = 0; i < indexAttr.count; i++) inds[i] = indexAttr.getX(i);
            } else {
                inds = new Uint32Array(posAttr.count);
                for (let i = 0; i < posAttr.count; i++) inds[i] = i;
            }
            const colDesc = RAPIER.ColliderDesc.trimesh(verts, inds)
                .setFriction(0.6)
                .setRestitution(0.1);
            if (offsetY !== 0) colDesc.setTranslation(0, offsetY, 0);
            return { colDesc, verts, inds };
        }

        // Helper: create a narrow top-band collider from triangles within a Y-band near the mesh top.
        // The band is optionally translated so its top aligns with targetTopY, preserving lower geometry for the step.
        function createRapierTopBandCollider(mesh, bandHeight = 0.012, targetTopY = null) {
            mesh.updateMatrixWorld(true);
            const geom = mesh.geometry.clone();
            geom.applyMatrix4(mesh.matrixWorld);
            const posAttr = geom.getAttribute('position');
            const indexAttr = geom.index;
            const triCount = (indexAttr ? indexAttr.count : posAttr.count) / 3;
            const getIndex = (i) => indexAttr ? indexAttr.getX(i) : i;
            let maxY = -Infinity;
            for (let i=0;i<posAttr.count;i++) maxY = Math.max(maxY, posAttr.getY(i));
            const minBandY = maxY - bandHeight - 1e-5;

            // Build compact vertex/index arrays for triangles fully inside the band
            const newPositions = [];
            const newIndices = [];
            const remap = new Map();
            let nextIdx = 0;
            for (let t=0;t<triCount;t++) {
                const ia = getIndex(t*3), ib = getIndex(t*3+1), ic = getIndex(t*3+2);
                const ay = posAttr.getY(ia), by = posAttr.getY(ib), cy = posAttr.getY(ic);
                if (ay >= minBandY && by >= minBandY && cy >= minBandY) {
                    const vv = [ia, ib, ic];
                    for (const v of vv) {
                        if (!remap.has(v)) {
                            remap.set(v, nextIdx++);
                            newPositions.push(posAttr.getX(v), posAttr.getY(v), posAttr.getZ(v));
                        }
                    }
                    newIndices.push(remap.get(ia), remap.get(ib), remap.get(ic));
                }
            }
            if (newIndices.length === 0) return null;

            const verts = new Float32Array(newPositions);
            const inds = new Uint32Array(newIndices);
            const colDesc = RAPIER.ColliderDesc.trimesh(verts, inds)
                .setFriction(0.6)
                .setRestitution(0.1);
            let liftApplied = 0;
            if (targetTopY != null && Number.isFinite(targetTopY)) {
                liftApplied = targetTopY - maxY;
                if (Math.abs(liftApplied) > 1e-6) colDesc.setTranslation(0, liftApplied, 0);
            }

            return { colDesc, verts, inds, liftApplied, originalTopY: maxY };
        }



        // Create wireframe for Rapier static collider
        function createRapierWireframe(mesh, offsetY = 0, color = 0x00ff00) {
            mesh.updateMatrixWorld(true);
            const geom = mesh.geometry.clone();
            geom.applyMatrix4(mesh.matrixWorld);
            const edges = new THREE.EdgesGeometry(geom);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: color }));
            if (offsetY !== 0) line.position.y += offsetY;
            line.visible = debugState.showRapierWireframes;
            scene.add(line);
            rapierTableWireframes.push(line);
            return line;
        }

        // Aggregate Group into Rapier trimesh collider (walls composed of many meshes)
        function createRapierTrimeshFromObject(object3D) {
            object3D.updateMatrixWorld(true);
            const meshes = [];
            object3D.traverse(child => { if (child.isMesh) meshes.push(child); });
            let vertCount = 0, indexCount = 0;
            for (const m of meshes) {
                const g = m.geometry;
                vertCount += g.getAttribute('position').count;
                indexCount += g.index ? g.index.count : g.getAttribute('position').count;
            }
            const verts = new Float32Array(vertCount * 3);
            const inds = new Uint32Array(indexCount);
            let vOffset = 0, iOffset = 0, globalIndexBase = 0;
            for (const m of meshes) {
                const g = m.geometry.clone();
                g.applyMatrix4(m.matrixWorld);
                const posAttr = g.getAttribute('position');
                for (let i = 0; i < posAttr.count; i++) {
                    verts[(vOffset + i) * 3 + 0] = posAttr.getX(i);
                    verts[(vOffset + i) * 3 + 1] = posAttr.getY(i);
                    verts[(vOffset + i) * 3 + 2] = posAttr.getZ(i);
                }
                const idxAttr = g.index;
                if (idxAttr) {
                    for (let i = 0; i < idxAttr.count; i++) inds[iOffset + i] = globalIndexBase + idxAttr.getX(i);
                    iOffset += idxAttr.count;
                } else {
                    for (let i = 0; i < posAttr.count; i++) inds[iOffset + i] = globalIndexBase + i;
                    iOffset += posAttr.count;
                }
                vOffset += posAttr.count;
                globalIndexBase += posAttr.count;
            }
            const colDesc = RAPIER.ColliderDesc.trimesh(verts, inds)
                .setFriction(0.8)
                .setRestitution(0.05);
            return { colDesc, verts, inds };
        }

        // Helper function to create wireframe visualization for physics body
        // Optionally pass shapeOrientation (CANNON.Quaternion) and shapeOffset (CANNON.Vec3)
        function createPhysicsWireframe(body, shape, shapeOrientation = null, shapeOffset = null) {
            let geometry;
            
            if (shape instanceof CANNON.Box) {
                const halfExtents = shape.halfExtents;
                geometry = new THREE.BoxGeometry(
                    halfExtents.x * 2,
                    halfExtents.y * 2,
                    halfExtents.z * 2
                );
            } else if (shape instanceof CANNON.Cylinder) {
                // Extract dimensions robustly; some Cannon builds don't expose radiusTop/height
                const hasShapeRTop = Number.isFinite(shape.radiusTop);
                const hasShapeRBot = Number.isFinite(shape.radiusBottom);
                const hasShapeH = Number.isFinite(shape.height);

                const fallbackRadius = (body && body.userData && Number.isFinite(body.userData.radius)) ? body.userData.radius : 0.1;
                const fallbackHeight = (body && body.userData && Number.isFinite(body.userData.height)) ? body.userData.height : 0.02;

                const rTop = hasShapeRTop ? shape.radiusTop : fallbackRadius;
                const rBot = hasShapeRBot ? shape.radiusBottom : fallbackRadius;
                const h = hasShapeH ? shape.height : fallbackHeight;

                console.log('Wireframe Cylinder dims ->', { rTop, rBot, h, from: {
                    radiusTop: hasShapeRTop ? 'shape' : 'fallback',
                    radiusBottom: hasShapeRBot ? 'shape' : 'fallback',
                    height: hasShapeH ? 'shape' : 'fallback'
                }});

                // Use 16 radial segments for cylinder wireframe
                geometry = new THREE.CylinderGeometry(
                    rTop,
                    rBot,
                    h,
                    16
                );
                // Note: Cannon.js cylinders are Y-axis aligned; we rely on body.quaternion for orientation
            } else if (shape instanceof CANNON.Trimesh) {
                // Reconstruct Three.js geometry from Trimesh vertices/indices
                const positions = new Float32Array(shape.vertices.length);
                for (let i = 0; i < shape.vertices.length; i++) positions[i] = shape.vertices[i];
                const indices = new (shape.indices.length > 65535 ? Uint32Array : Uint16Array)(shape.indices.length);
                for (let i = 0; i < shape.indices.length; i++) indices[i] = shape.indices[i];

                geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                geometry.computeVertexNormals();
                } else if (shape instanceof CANNON.ConvexPolyhedron) {
                    // Reconstruct Three.js geometry from ConvexPolyhedron vertices/faces
                    const positions = [];
                    const indices = [];
                
                    // Convert CANNON.Vec3 vertices to flat array
                    for (let i = 0; i < shape.vertices.length; i++) {
                        const v = shape.vertices[i];
                        positions.push(v.x, v.y, v.z);
                    }
                
                    // Convert faces to triangle indices
                    for (let i = 0; i < shape.faces.length; i++) {
                        const face = shape.faces[i];
                        // Triangulate the face (assuming convex polygons)
                        for (let j = 1; j < face.length - 1; j++) {
                            indices.push(face[0], face[j], face[j + 1]);
                        }
                    }
                
                    geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
                    geometry.setIndex(indices);
                    geometry.computeVertexNormals();
                
                    console.log('Created ConvexPolyhedron wireframe:', positions.length / 3, 'vertices,', indices.length / 3, 'triangles');
            }
            
            if (!geometry) return; // Skip if shape not supported
            
            // Create a group to represent the body's transform
            const group = new THREE.Group();
            group.position.copy(body.position);
            group.quaternion.copy(body.quaternion);
            group.visible = debugState.showCannonWireframes;

            const edgesMesh = new THREE.LineSegments(
                new THREE.EdgesGeometry(geometry),
                new THREE.LineBasicMaterial({ color: 0x00ff00 })
            );

            // Apply shape-local orientation/offset if provided (e.g., rotated shapes)
            // Note: Three.js CylinderGeometry is already Y-axis aligned.
            // If the physics used a Cannon cylinder with a local rotation to become Y-aligned,
            // we should NOT apply that rotation to the Three wireframe cylinder, otherwise it
            // will appear upright again. So skip orientation for cylinders.
            if (shapeOrientation && !(shape instanceof CANNON.Cylinder)) {
                edgesMesh.quaternion.set(
                    shapeOrientation.x,
                    shapeOrientation.y,
                    shapeOrientation.z,
                    shapeOrientation.w
                );
            }
            if (shapeOffset) {
                edgesMesh.position.set(shapeOffset.x, shapeOffset.y, shapeOffset.z);
            }

            group.add(edgesMesh);
            // Remove triangles variant (deprecated)
            scene.add(group);
            cannonWireframes.push({ wireframe: group, body });
            
            return group;
        }

        // Create card back texture (classic playing card back design)
        function createCardBackTexture() {
            const canvas = document.createElement('canvas');
            // Use a single high-quality back texture (2048x3072) - only one instance in memory

            canvas.height = 3072; // 8x of 384
            const ctx = canvas.getContext('2d');
            
            // Background color (classic blue)
            ctx.fillStyle = '#0a4a8a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // White border (scaled proportionally)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 64; // 8x from 8
            ctx.strokeRect(96, 96, canvas.width - 192, canvas.height - 192); // 8x from 12,24
            
            // Inner decorative border (scaled)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 24; // 8x from 3
            ctx.strokeRect(192, 192, canvas.width - 384, canvas.height - 384); // 8x from 24,48
            
            // Create diamond/geometric pattern
            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 16; // 8x from 2
            
            // Central ornate design
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Draw decorative circles and patterns (scaled)
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const radius = 480; // 8x from 60
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                ctx.beginPath();
                ctx.arc(x, y, 64, 0, Math.PI * 2); // 8x from 8
                ctx.fill();
            }
            
            // Center circle (scaled)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 200, 0, Math.PI * 2); // 8x from 25
            ctx.stroke();
            ctx.lineWidth = 32; // 8x from 4
            ctx.beginPath();
            ctx.arc(centerX, centerY, 120, 0, Math.PI * 2); // 8x from 15
            ctx.fill();
            
            // Diamond pattern in corners (scaled)
            function drawCornerDiamond(x, y, size) {
                ctx.beginPath();
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size, y);
                ctx.lineTo(x, y + size);
                ctx.lineTo(x - size, y);
                ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y - size/2);
                ctx.lineTo(x + size/2, y);
                ctx.lineTo(x, y + size/2);
                ctx.lineTo(x - size/2, y);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.lineWidth = 16; // 8x from 2
            drawCornerDiamond(480, 480, 160); // 8x from 60,60,20
            drawCornerDiamond(canvas.width - 480, 480, 160);
            drawCornerDiamond(480, canvas.height - 480, 160);
            
            // Curved decorative lines (scaled)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 24; // 8x from 3
            for (let i = 0; i < 4; i++) {
                const offset = 640 + i * 120; // 8x from 80,15
                ctx.beginPath();
                ctx.moveTo(centerX - offset, 320); // 8x from 40
                ctx.quadraticCurveTo(centerX, centerY - 320, centerX + offset, 320); // 8x from 40
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(centerX - offset, canvas.height - 320); // 8x from 40
                ctx.quadraticCurveTo(centerX, centerY + 320, centerX + offset, canvas.height - 320); // 8x from 40
                ctx.stroke();
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = CARD_TEXTURE_ANISO;
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = true;
            return texture;

            // Main chip color
            ctx.fillStyle = `#${chipType.color.toString(16).padStart(6, '0')}`;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Edge spots (8 spots around perimeter)
            ctx.fillStyle = `#${chipType.edgeColor.toString(16).padStart(6, '0')}`;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const spotX = centerX + Math.cos(angle) * (radius * 0.8);
                const spotY = centerY + Math.sin(angle) * (radius * 0.8);
                ctx.beginPath();
                ctx.arc(spotX, spotY, radius * 0.15, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Center circle (inlay)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            texture.anisotropy = CARD_TEXTURE_ANISO;
            return texture;
