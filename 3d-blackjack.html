        // --- Custom shader anisotropy boost (multi-tap sampling along screen-space gradient) ---
        let ANISO_BOOST = 1.0; // scales how far we sample along the gradient (0 = off)
        const customAnisoMaterials = [];
        
        function applyCustomAnisoToMaterial(mat) {
            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uAnisoBoost = { value: ANISO_BOOST };
                // Use vMapUv (the UV used by standard map sampling in recent Three.js)
                const injection = `#include <map_fragment>
#ifdef USE_MAP
if (uAnisoBoost > 0.001) {
    vec2 dx = dFdx( vMapUv );
    vec2 dy = dFdy( vMapUv );
    vec2 dir = ( dot(dx,dx) > dot(dy,dy) ) ? dx : dy;
    // Small, angle-independent step to avoid streaking/banding
    vec2 stepDir = normalize(dir) * (uAnisoBoost * 0.0007);
    vec3 anisoRGB =
          texture2D( map, vMapUv - 2.0 * stepDir ).rgb * 0.12 +
          texture2D( map, vMapUv - 1.0 * stepDir ).rgb * 0.20 +
          texture2D( map, vMapUv                 ).rgb * 0.36 +
          texture2D( map, vMapUv + 1.0 * stepDir ).rgb * 0.20 +
          texture2D( map, vMapUv + 2.0 * stepDir ).rgb * 0.12;
    float blend = clamp( uAnisoBoost / 3.0, 0.0, 1.0 );
    diffuseColor.rgb = mix( diffuseColor.rgb, anisoRGB, blend );
}
#endif`;
                shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', injection);
                // Ensure the uniform is declared in the fragment shader
                shader.fragmentShader = 'uniform float uAnisoBoost;\n' + shader.fragmentShader;
                mat.userData._shader = shader;
            };
            customAnisoMaterials.push(mat);
            mat.needsUpdate = true;
        }

        function setAnisoBoost(v) {
            ANISO_BOOST = Math.max(0.0, v);
            customAnisoMaterials.forEach((m) => {
                if (m.userData && m.userData._shader) {
                    m.userData._shader.uniforms.uAnisoBoost.value = ANISO_BOOST;
                }
            });
        }

        function getFaceMaterial(card, res = '1k') {
            const key = `${card.rank}-${card.suit}@${res}`;
            let tex = faceTextureCache.get(key);
            if (!tex) {
                const canvas = document.createElement('canvas');
                // Choose resolution per requested quality
                if (res === '2k') {
                    canvas.width = 2048;
                    canvas.height = 3072;
                } else {
                    canvas.width = 1024;
                    canvas.height = 1536;
                }
                const ctx = canvas.getContext('2d');
                const isRed = card.suit === '♥' || card.suit === '♦';
                // Background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Border
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = (res === '2k') ? 32 : 16;
                const pad = (res === '2k') ? 64 : 32;
                ctx.strokeRect(pad, pad, canvas.width - pad*2, canvas.height - pad*2);
                // Rank and suit
                ctx.fillStyle = isRed ? '#cc0000' : '#000000';
                ctx.font = `bold ${res === '2k' ? 640 : 320}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const cx = (res === '2k') ? 512 : 256;
                ctx.fillText(card.rank, cx, (res === '2k') ? 640 : 320);
                ctx.fillText(card.suit, cx, (res === '2k') ? 1280 : 640);
                tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = CARD_TEXTURE_ANISO;
                tex.minFilter = THREE.LinearMipmapLinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = true;
                faceTextureCache.set(key, tex);
            }
            const mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide });
            applyCustomAnisoToMaterial(mat);
            return mat;
        }

        // Ensure a shoe card has its face material applied (used when dealing)
        function ensureCardFaceMaterial(shoeCard, res = '1k') {
            if (!shoeCard || !shoeCard.card || !shoeCard.mesh) return;
            const mesh = shoeCard.mesh.children.find(c => c.isMesh);
            if (!mesh) return;
            const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
            // Index 2 is top (face)
            const faceMat = mats[2];
            const hasMap = faceMat && faceMat.map;
            if (!hasMap) {
                mats[2] = getFaceMaterial(shoeCard.card, res);
                mesh.material = mats;
                mesh.material.needsUpdate = true;
            }
        }

        // Create physical card mesh and body
        function createPhysicalCard(card, position, isRedCard = false, deferFace = false) {
            const cardGroup = new THREE.Group();
            
            const cardGeom = new THREE.BoxGeometry(CARD.width, CARD.thickness, CARD.length);
            
            if (isRedCard) {
                // Red cut card
                const cardMat = new THREE.MeshStandardMaterial({
                    color: 0xff0000,
                    roughness: 0.3,
                    metalness: 0.1
                });
                const cardMesh = new THREE.Mesh(cardGeom, cardMat);
                cardMesh.castShadow = true;
                cardMesh.receiveShadow = true;
                cardGroup.add(cardMesh);
            } else {
                // Regular card with texture
                const isRed = card.suit === '♥' || card.suit === '♦';
                const faceMat = deferFace ? new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }) : getFaceMaterial(card, '2k');
                
                const backMat = new THREE.MeshStandardMaterial({
                    map: cardBackTexture,
                    roughness: 0.3,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });
                applyCustomAnisoToMaterial(backMat);
                
                const edgeMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.3,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });
                
                // Apply texture to top face (face) and bottom face (back)
                const cardWithTexture = new THREE.Mesh(cardGeom, [
                    edgeMat, // right
                    edgeMat, // left
                    faceMat, // top (face)
                    backMat, // bottom (back)
                    edgeMat, // front
                    edgeMat  // back
                ]);
                cardWithTexture.castShadow = true;
                cardWithTexture.receiveShadow = true;
                cardGroup.add(cardWithTexture);
            }
            
            cardGroup.position.set(position.x, position.y, position.z);
            // Rotate cards face down in the shoe (180° around X-axis so card back faces up)
            if (!isRedCard) {
                cardGroup.rotation.x = Math.PI;
            }
            scene.add(cardGroup);
            
            // Physics body
            const shape = new CANNON.Box(new CANNON.Vec3(CARD.width/2, CARD.thickness/2, CARD.length/2));
            const body = new CANNON.Body({
                mass: 0, // Start as kinematic (frozen) - will be made dynamic when drawn
                shape: shape,
                material: physCardMaterial,
                position: new CANNON.Vec3(position.x, position.y, position.z),
                linearDamping: 0.5,
                angularDamping: 0.5
            });
            // Match body rotation to mesh rotation (face down)
            if (!isRedCard) {
                body.quaternion.setFromEuler(Math.PI, 0, 0);
            }
            world.addBody(body);
            
            return { mesh: cardGroup, body: body };
        }

        // Global reference to cut card (kept outside deck until insertion)
        let cutCardObj = null;

        // Initialize shoe with 312 stacked cards (no cut card inserted here on initial load)
    function initializeShoe() {
            // Clear existing shoe cards
            for (let sc of shoeCards) {
                scene.remove(sc.mesh);
                world.removeBody(sc.body);
            }
            shoeCards = [];
            
            const deckData = create6DeckShoe();
            const shoePos = shoeGroup.position;
            
            // Stack cards in the shoe
            for (let i = 0; i < deckData.length; i++) {
                const yOffset = i * CARD.thickness;
                const position = {
                    x: shoePos.x,
                    y: shoePos.y + yOffset,
                    z: shoePos.z
                };
                
                const physCard = createPhysicalCard(deckData[i], position, false, true); // defer face texture for shoe
                shoeCards.push({
                    card: deckData[i],
                    mesh: physCard.mesh,
                    body: physCard.body
                });
            }
            
            // Create (or recreate) cut card positioned on felt in front of shoe (not in shoeCards yet)
            const frontZ = shoePos.z + (SHOE_DEPTH / 2) + CARD.length * 0.9;
            const frontPos = { x: shoePos.x, y: CARD.thickness/2 + 0.0015, z: frontZ };
            if (cutCardObj) {
                scene.remove(cutCardObj.mesh);
                world.removeBody(cutCardObj.body);
            }
            const physCut = createPhysicalCard({ suit: '', rank: 'CUT' }, frontPos, true);
            cutCardObj = { card: { suit: '', rank: 'CUT' }, mesh: physCut.mesh, body: physCut.body, isRedCard: true };
            redCardIndex = -1; // not inserted yet
        }

        // Shuffle the shoe - instant reordering since cards are kinematic
        // Helper for planar slide tween (linear X/Z move at constant Y)
        function addSlideTween(sc, fromX, fromZ, toX, toZ, y, duration = 260) {
            const startTime = performance.now();
            activeTweens.push({
                sc,
                slide: true,
                fromX,
                fromZ,
                toX,
                toZ,
                y,
                duration,
                start: startTime
            });
        }

        // Card dealing animation tween (slide + arc + flip)
        function addCardDealTween(sc, fromPos, toPos, duration = 800, flipDuration = 300, stayFaceDown = false) {
            const startTime = performance.now();
            activeTweens.push({
                sc,
                deal: true,
                fromPos: { ...fromPos },
                toPos: { ...toPos },
                duration,
                flipDuration,
                start: startTime,
                arcHeight: 0.5, // Arc height for the card's flight path
                stayFaceDown: stayFaceDown // Whether card should stay face down
            });
        }

        function shuffleShoe(initialLoad = false) {
            if (isShuffling) return;
            isShuffling = true;
            
            updateStatus('Shuffling shoe...');
            
            // Animate camera to shoe for cinematic view
            animateCameraToShoe(st(1000));
            
            const shoePos = shoeGroup.position;
            
            // 1) If cut card exists in shoe, animate it out and temporarily remove it from array
            const existingCutIdx = shoeCards.findIndex(sc => sc.isRedCard);
            if (existingCutIdx !== -1) {
                // Removal during reshuffle
                cutCardObj = shoeCards.splice(existingCutIdx, 1)[0];
                const liftY = shoePos.y + (shoeCards.length + 8) * CARD.thickness;
                const parkX = shoePos.x + CARD.width * 1.4; // park to side
                addShuffleTween(cutCardObj, liftY, { duration: st(300), bump: 0.05, swayX: (parkX - cutCardObj.body.position.x) * 0.06 });
                setTimeout(() => {
                    cutCardObj.body.position.set(parkX, liftY, shoePos.z);
                    cutCardObj.mesh.position.copy(cutCardObj.body.position);
                }, st(320));
            } else if (initialLoad && cutCardObj) {
                // On initial load the cut card starts on felt in front; leave it there until insertion phase
            }
            
            // We will perform a series of small localized shuffles (packet moves)
            const PACKET_SIZE_MIN = 3;
            const PACKET_SIZE_MAX = 16;
            const MOVES = 120; // more packet moves for stronger randomness
            const operations = [];
            for (let m = 0; m < MOVES; m++) {
                const size = Math.floor(Math.random() * (PACKET_SIZE_MAX - PACKET_SIZE_MIN + 1)) + PACKET_SIZE_MIN;
                const startIdx = Math.floor(Math.random() * Math.max(1, shoeCards.length - size));
                let insertIdx = Math.floor(Math.random() * shoeCards.length);
                if (insertIdx >= startIdx && insertIdx <= startIdx + size) {
                    insertIdx = (insertIdx + size + 5) % shoeCards.length; // avoid noop move
                }
                operations.push({ startIdx, size, insertIdx });
                // Occasionally schedule a cut operation marker
                if (m % 15 === 14) operations.push({ cut: true });
            }

            let opIndex = 0;
            function performNextOp() {
                if (opIndex >= operations.length) {
                    // Final tidy placement animation to reflect the order resulting from packet moves (real shuffle)
                    shoeCards.forEach((sc, idx) => {
                        const targetY = shoePos.y + idx * CARD.thickness;
                        addShuffleTween(sc, targetY, { duration: st(220), bump: 0.02, centerX: shoePos.x, centerZ: shoePos.z, centerLerp: 0.35 });
                    });
                    // After settle, insert cut card back at 20-30%
                    setTimeout(() => {
                        let insertPct = 0.2 + Math.random() * 0.1; // 20-30%
                        let insertIndex = Math.min(shoeCards.length, Math.max(0, Math.floor(shoeCards.length * insertPct)));
                        if (cutCardObj) {
                            const targetY = shoePos.y + insertIndex * CARD.thickness;
                            const finalX = shoePos.x; // deck x center
                            const finalZ = shoePos.z; // deck z center
                            const startX = cutCardObj.body.position.x;
                            const startZ = cutCardObj.body.position.z;
                            // Phase 1: vertical align (retain current X/Z)
                            addShuffleTween(cutCardObj, targetY, { duration: st(340), bump: 0.05, swayX: 0 });
                            // Phase 2: planar slide (X/Z) into stack
                            setTimeout(() => {
                                if (!shoeCards.includes(cutCardObj)) {
                                    shoeCards.splice(insertIndex, 0, cutCardObj);
                                }
                                addSlideTween(cutCardObj, startX, startZ, finalX, finalZ, targetY, st(340));
                            }, st(350));
                        }
                        // Update index tracking and finish
                        redCardIndex = shoeCards.findIndex(sc => sc.isRedCard);
                        setTimeout(() => {
                            isShuffling = false;
                            updateStatus('Shuffle complete!');
                            // Animate camera back to original position
                            animateCameraBack(st(1200));
                            setTimeout(() => updateStatus(''), st(1200));
                        }, st(360));
                    }, st(260));
                    return;
                }
                const op = operations[opIndex++];
                if (op.cut) {
                    // Perform a random cut: take top k cards and move to bottom
                    const k = Math.floor(shoeCards.length * (0.2 + Math.random()*0.3)); // 20-50%
                    const top = shoeCards.splice(shoeCards.length - k, k); // top is at end
                    shoeCards.unshift(...top);
                    // Animate all cards to their new Y to reflect the cut
                    shoeCards.forEach((sc, idx) => {
                        const targetY = shoePos.y + idx * CARD.thickness;
                        addShuffleTween(sc, targetY, { duration: st(240), bump: 0.02, centerX: shoePos.x, centerZ: shoePos.z, centerLerp: 0.25 });
                    });
                } else {
                    const packet = shoeCards.splice(op.startIdx, op.size);
                    // Insert packet
                    const clampedInsert = Math.min(op.insertIdx, shoeCards.length);
                    shoeCards.splice(clampedInsert, 0, ...packet);
                    // Animate only moved packet to new vertical positions
                    packet.forEach((sc, localIdx) => {
                        const globalIdx = clampedInsert + localIdx;
                        const targetY = shoePos.y + globalIdx * CARD.thickness;
                        addShuffleTween(sc, targetY, { duration: st(300), bump: 0.04, centerX: shoePos.x, centerZ: shoePos.z, centerLerp: 0.15 });
                    });
                }
                // Schedule next op
                {
                    const delay = (30 + Math.random()*40) * SHUFFLE_TIME_SCALE;
                    setTimeout(performNextOp, Math.max(10, delay)); // varied cadence between moves, scaled
                }
            }
            performNextOp();
        }

        function createDeck() {
            deck = [];
            for (let suit of suits) {
                for (let rank of ranks) {
                    deck.push({ suit, rank });
                }
            }
            // Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function getCardValue(card) {
            if (card.rank === 'A') return 11;
            if (['J', 'Q', 'K'].includes(card.rank)) return 10;
            return parseInt(card.rank);
        }

        function calculateHandValue(hand) {
            let value = 0;
            let aces = 0;
            
            for (let card of hand) {
                const cardValue = getCardValue(card);
                value += cardValue;
                if (card.rank === 'A') aces++;
            }
            
            // Adjust for aces
            while (value > 21 && aces > 0) {
                value -= 10;
                aces--;
            }
            
            return value;
        }

        function createCard(card, position, rotation = { x: 0, y: 0, z: 0 }) {
            const cardGroup = new THREE.Group();
            
            // Card geometry (sized to real-world proportions relative to the table)
            const cardGeom = new THREE.BoxGeometry(CARD.width, CARD.thickness, CARD.length);
            const cardMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.3,
                metalness: 0.1
            });
            const cardMesh = new THREE.Mesh(cardGeom, cardMat);
            cardMesh.castShadow = true;
            cardMesh.receiveShadow = true;
            cardGroup.add(cardMesh);

            // Card text (rank and suit)
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Border
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
            
            // Rank and suit
            const isRed = card.suit === '♥' || card.suit === '♦';
            ctx.fillStyle = isRed ? '#cc0000' : '#000000';
            // Scale font relative to card aspect ratio to remain readable at realistic size
            ctx.font = 'bold 120px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(card.rank, canvas.width / 2, canvas.height / 3);
            ctx.font = 'bold 100px Arial';
            ctx.fillText(card.suit, canvas.width / 2, canvas.height * 2 / 3);
            
            const texture = new THREE.CanvasTexture(canvas);
            const faceMat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.3,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            
            const backMat = new THREE.MeshStandardMaterial({
                map: cardBackTexture,
                roughness: 0.3,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            
            const edgeMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.3,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            
            // Apply texture to top face
            const cardWithTexture = new THREE.Mesh(cardGeom, [
                edgeMat, // right
                edgeMat, // left
                faceMat, // top (face)
                backMat, // bottom (back)
                edgeMat, // front
                edgeMat  // back
            ]);
            cardWithTexture.castShadow = true;
            cardWithTexture.receiveShadow = true;
            
            cardGroup.remove(cardMesh);
            cardGroup.add(cardWithTexture);
            
            cardGroup.position.set(position.x, position.y, position.z);
            cardGroup.rotation.set(rotation.x, rotation.y, rotation.z);
            
            scene.add(cardGroup);
            cardMeshes.push(cardGroup);
            
            return cardGroup;
        }

        function clearCards() {
            // Move dealt cards to discard (don't remove from scene)
            // This function is now only called when we want to completely clear everything
            for (let dealtCard of dealtCards) {
                scene.remove(dealtCard.mesh);
                world.removeBody(dealtCard.body);
            }
            dealtCards = [];
            cardMeshes = [];
        }

        // Animate cards sliding to discard tray
        function discardCardsToTray(callback) {
            if (dealtCards.length === 0) {
                if (callback) callback();
                return;
            }

            const discardPos = discardTrayGroup.position;
            const targetX = discardPos.x;
            const targetZ = discardPos.z;
            // Discard tray bottom mesh is at (0, 0, 0) within group with height 0.02
            // Top of bottom surface is at group.y + 0.01 (half of 0.02)
            // Then add half card thickness so card center sits on top of tray bottom
            const trayBottomTopY = discardPos.y + 0.01 + CARD.thickness / 2;

            let cardsAnimated = 0;
            const totalCards = dealtCards.length;
            
            // Reverse order so most recently played is on top
            const cardsToDiscard = [...dealtCards].reverse();

            cardsToDiscard.forEach((dc, index) => {
                const currentPos = {
                    x: dc.body.position.x,
                    y: dc.body.position.y,
                    z: dc.body.position.z
                };
                
                // Step 1: Position in front of discard tray
                const frontOfTrayZ = discardPos.z + (SHOE_DEPTH / 2) + CARD.length * 0.6;
                const frontPosition = {
                    x: discardPos.x,
                    y: CARD.thickness/2 + 0.0015, // Keep at table level
                    z: frontOfTrayZ
                };
                
                // Step 2: Stack height based on current discard pile + this card's position
                const stackIndex = discardedCards.length + index;
                const finalY = trayBottomTopY + (stackIndex * CARD.thickness);
                const finalPosition = {
                    x: targetX,
                    y: finalY,
                    z: targetZ
                };
                
                const delay = index * 120; // Stagger animations (increased for two-step animation)
                
                setTimeout(() => {
                    // First animation: slide to front of tray with flip (500ms)
                    const slideToFrontDuration = 500;
                    const startTime = performance.now();
                    
                    activeTweens.push({
                        discard: true,
                        sc: dc,
                        fromPos: currentPos,
                        toPos: frontPosition,
                        duration: slideToFrontDuration,
                        start: startTime,
                        onComplete: () => {
                            // Second animation: slide into tray and stack (300ms)
                            const slideInDuration = 300;
                            const slideInStart = performance.now();
                            
                            activeTweens.push({
                                slideIn: true, // New type for sliding into tray (no flip)
                                sc: dc,
                                fromPos: frontPosition,
                                toPos: finalPosition,
                                duration: slideInDuration,
                                start: slideInStart,
                                onComplete: () => {
                                    cardsAnimated++;
                                    
                                    // Mark card state for discard pile
                                    dc.isFaceDown = true;
                                    dc.isDealt = false; // Allow rotation sync again
                                    
                                    // Move to discarded array
                                    discardedCards.push(dc);
                                    
                                    if (cardsAnimated === totalCards) {
                                        // All cards discarded, clear dealt cards array
                                        dealtCards = [];
                                        cardMeshes = [];
                                        if (callback) callback();
                                    }
                                }
                            });
                        }
                    });
                }, delay);
            });
        }

        function dealCard(hand, isDealer, cardIndex, isFaceDown, callback) {
            // Check if we've reached the red cut card
            if (shoeCards.length > 0 && shoeCards[shoeCards.length - 1].isRedCard) {
                updateStatus('Cut card reached! Reshuffling after this hand...');
                // We'll trigger reshuffle after the hand completes
            }
            
            // Pull card from the top of the shoe (end of array)
            if (shoeCards.length === 0) {
                updateStatus('Shoe is empty! Reinitializing...');
                initializeShoe();
                shuffleShoe();
                if (callback) callback();
                return null;
            }
            
            const shoeCard = shoeCards.pop();
            // Ensure the card has its face material ready (in case it was deferred in the shoe)
            // Use 2k for dealt cards for maximum oblique-angle clarity
            ensureCardFaceMaterial(shoeCard, '2k');
            
            // Skip the red cut card
            if (shoeCard.isRedCard) {
                // Red card reached - mark for reshuffle
                needsReshuffle = true;
                updateStatus('Cut card reached! Will reshuffle before next hand.');
                scene.remove(shoeCard.mesh);
                world.removeBody(shoeCard.body);
                
                // Try to get the next card
                if (shoeCards.length === 0) {
                    updateStatus('Reshuffling...');
                    setTimeout(() => {
                        initializeShoe();
                        shuffleShoe();
                        needsReshuffle = false;
                    }, 2000);
                    if (callback) callback();
                    return null;
                }
                return dealCard(hand, isDealer, cardIndex, isFaceDown, callback); // Recursive call to get next card
            }
            
            hand.push(shoeCard.card);
            
            // Move card from shoe to dealt cards array
            dealtCards.push(shoeCard);
            
            // Mark if this is the dealer's hole card (face down)
            if (isFaceDown) {
                shoeCard.isFaceDown = true;
                shoeCard.isHoleCard = true;
            }
            
            // Center the cards on the table (adjust X to be more centered)
            const xOffset = isDealer ? -0.5 : -0.5; // More centered X position
            const zOffset = isDealer ? -1.5 : 1.5; // Closer to center Z position
            const spacing = CARD_SPACING;
            
            const shoePos = shoeGroup.position;
            
            // Step 1: Slide card out to front of shoe
            const frontOfShoeZ = shoePos.z + (SHOE_DEPTH / 2) + CARD.length * 0.6;
            const slideOutPosition = {
                x: shoePos.x,
                y: shoeCard.body.position.y,
                z: frontOfShoeZ
            };
            
            // Step 2: Final position on table
            const finalPosition = {
                x: xOffset + (cardIndex * spacing),
                y: CARD.thickness/2 + 0.0015,
                z: zOffset
            };
            
            // Make card kinematic (mass = 0) so animation controls it
            shoeCard.body.mass = 0;
            shoeCard.body.updateMassProperties();
            
            // First animation: slide out from shoe (200ms)
            const slideOutDuration = 200;
            addSlideTween(
                shoeCard,
                shoeCard.body.position.x,
                shoeCard.body.position.z,
                slideOutPosition.x,
                slideOutPosition.z,
                slideOutPosition.y,
                slideOutDuration
            );
            
            // Second animation: deal to table with flip (starts after slide out)
            setTimeout(() => {
                addCardDealTween(shoeCard, slideOutPosition, finalPosition, 600, 300, isFaceDown);
            }, slideOutDuration + 50);
            
            // Store the card mesh for tracking
            cardMeshes.push(shoeCard.mesh);
            
            // Call callback after both animations complete
            if (callback) {
                setTimeout(callback, slideOutDuration + 850);
            }
            
            return shoeCard.card;
        }

        function updateScores() {
            const playerValue = calculateHandValue(playerHand);
            
            // Check if dealer has a face-down hole card
            const hasHoleCard = dealtCards.some(dc => dc.isHoleCard && dc.isFaceDown);
            
            if (hasHoleCard && dealerHand.length >= 1) {
                // Only show the value of the first (visible) card
                const visibleCardValue = getCardValue(dealerHand[0]);
                document.getElementById('dealerScore').textContent = visibleCardValue;
            } else {
                // Show full dealer hand value
                const dealerValue = calculateHandValue(dealerHand);
                document.getElementById('dealerScore').textContent = dealerValue;
            }
            
            document.getElementById('playerScore').textContent = playerValue;
        }

        function updateStatus(message) {
            document.getElementById('gameStatus').textContent = message;
        }

        // --- Hand History ---
        function isBlackjack(hand) {
            return hand.length === 2 && calculateHandValue(hand) === 21;
        }
        function isSoftHand(hand) {
            // Determine if any ace is counted as 11 (soft)
            let rawTotal = 0; let aces = 0;
            for (const c of hand) { rawTotal += getCardValue(c); if (c.rank === 'A') aces++; }
            while (rawTotal > 21 && aces > 0) { rawTotal -= 10; aces--; }
            return aces > 0; // any remaining ace counted as 11 => soft
        }
        function addHandHistoryEntry(resultKey) {
            const playerValue = calculateHandValue(playerHand);
            const dealerValue = calculateHandValue(dealerHand);
            const entry = {
                timestamp: Date.now(),
                result: resultKey,
                playerValue,
                dealerValue,
                playerBJ: isBlackjack(playerHand),
                dealerBJ: isBlackjack(dealerHand)
            };
            handHistory.unshift(entry);
            if (handHistory.length > MAX_HISTORY) handHistory.pop();
            updateHandHistoryUI();
        }
        function formatResultLabel(entry) {
            switch (entry.result) {
                case 'blackjack-player': return 'Player Blackjack';
                case 'blackjack-dealer': return 'Dealer Blackjack';
                case 'blackjack-push': return 'Push (Blackjack)';
                case 'player': return 'Win';
                case 'dealer': return 'Loss';
                case 'push': return 'Push';
                default: return entry.result;
            }
        }
        function updateHandHistoryUI() {
            const container = document.getElementById('handHistoryEntries');
            if (!container) return;
            container.innerHTML = handHistory.map(e => {
                const clsBase = e.result.includes('blackjack') ? 'entry blackjack' : 'entry';
                const cls = clsBase + ' ' + (e.result.startsWith('player') || e.result === 'blackjack-player' ? 'win' : (e.result.startsWith('dealer') || e.result === 'blackjack-dealer' ? 'loss' : (e.result.includes('push') ? 'push' : '')));
                const timeStr = new Date(e.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                return `<div class="${cls}"><span class="label">${formatResultLabel(e)}</span> ${e.playerBJ?'★':''} P:${e.playerValue} / D:${e.dealerValue} ${e.dealerBJ?'★':''}<br><span style="font-size:11px;opacity:.7">${timeStr}</span></div>`;
            }).join('');
        }

        // --- Chip Win/Loss Handling ---
        function getBetChips() {
            // Get all chips in the bet zone (Rapier only)
            const betChips = [];
            if (rapierChips && rapierChips.length) {
                for (let chip of rapierChips) {
                    const t = chip.rb.translation();
                    const dx = t.x - BET_ZONE.center.x;
                    const dz = t.z - BET_ZONE.center.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    if (distance <= BET_ZONE.radius) {
                        betChips.push({ chip, type: 'rapier' });
                    }
                }
            }
            return betChips;
        }

        function collectLostChips() {
            const betChips = getBetChips();
            
            // Animate chips sliding off table (toward dealer/bank)
            betChips.forEach(({ chip }, index) => {
                setTimeout(() => {
                    // Rapier chip: apply impulse toward bank
                    const t = chip.rb.translation();
                    const dx = -t.x * 0.5;
                    const dz = -6 - t.z;
                    const len = Math.sqrt(dx*dx + dz*dz) || 1;
                    chip.rb.applyImpulse({ x: dx/len * 0.003, y: 0.002, z: dz/len * 0.003 }, true);
                    chip.rb.wakeUp();
                    
                    // Remove chip after it falls off table
                    setTimeout(() => {
                        scene.remove(chip.mesh);
                        if (chip.rb && rapierWorld) {
                            rapierWorld.removeRigidBody(chip.rb);
                        }
                        const chipIndex = rapierChips.indexOf(chip);
                        if (chipIndex > -1) {
                            rapierChips.splice(chipIndex, 1);
                        }
                    }, 2000);
                }, index * 50); // Stagger the collection
            });
        }

        function payoutWinningChips(isBlackjack = false) {
            const betAmount = calculateBetAmount();
            const payoutAmount = isBlackjack ? Math.floor(betAmount * 1.5) : betAmount;
            
            // Move bet chips to stockpile (keep original bet)
            const betChips = getBetChips();
            betChips.forEach(({ chip }, index) => {
                setTimeout(() => {
                    const targetX = STOCKPILE_ZONE.center.x + (Math.random() - 0.5) * 0.5;
                    const targetZ = STOCKPILE_ZONE.center.z + (Math.random() - 0.5) * 0.5;
                    
                    const t = chip.rb.translation();
                    const dx = targetX - t.x;
                    const dz = targetZ - t.z;
                    const len = Math.sqrt(dx*dx + dz*dz) || 1;
                    chip.rb.applyImpulse({ x: dx/len * 0.002, y: 0.001, z: dz/len * 0.002 }, true);
                    chip.rb.wakeUp();
                }, index * 50);
            });
            
            // Spawn winning chips from bank
            setTimeout(() => {
                spawnChipsFromBank(payoutAmount);
            }, betChips.length * 50 + 300);
        }

        function spawnChipsFromBank(amount) {
            // Break down amount into chip denominations (greedy algorithm)
            const denominations = [500, 100, 25, 5, 1];
            let remaining = amount;
            const chipsToSpawn = [];
            
            for (let denom of denominations) {
                while (remaining >= denom) {
                    chipsToSpawn.push(denom);
                    remaining -= denom;
                }
            }
            
            // Spawn chips from bank area (dealer side) sliding to stockpile
            chipsToSpawn.forEach((value, index) => {
                setTimeout(() => {
                    const bankX = -2 + (Math.random() - 0.5) * 1;
                    const bankZ = -3;
                    const bankY = (rapierReady ? FELT_TOP_Y_RAPIER : FELT_TOP_Y) + CHIP.thickness / 2 + 0.5;
                    
                    const chip = createRapierValueChip(value, {
                        x: bankX,
                        y: bankY,
                        z: bankZ
                    });
                    
                    if (chip && chip.rb) {
                        // Apply impulse toward stockpile
                        const targetX = STOCKPILE_ZONE.center.x + (Math.random() - 0.5) * 0.8;
                        const targetZ = STOCKPILE_ZONE.center.z + (Math.random() - 0.5) * 0.8;
                        
                        const dx = targetX - bankX;
                        const dz = targetZ - bankZ;
                        const len = Math.sqrt(dx*dx + dz*dz) || 1;
                        chip.rb.applyImpulse({ x: dx/len * 0.003, y: 0.0005, z: dz/len * 0.003 }, true);
                        chip.rb.wakeUp();
                    }
                }, index * 80);
            });
        }

        function returnPushChips() {
            // On push, just slide bet chips back to stockpile
            const betChips = getBetChips();
            betChips.forEach(({ chip }, index) => {
                setTimeout(() => {
                    const targetX = STOCKPILE_ZONE.center.x + (Math.random() - 0.5) * 0.5;
                    const targetZ = STOCKPILE_ZONE.center.z + (Math.random() - 0.5) * 0.5;
                    
                    const t = chip.rb.translation();
                    const dx = targetX - t.x;
                    const dz = targetZ - t.z;
                    const len = Math.sqrt(dx*dx + dz*dz) || 1;
                    chip.rb.applyImpulse({ x: dx/len * 0.002, y: 0.001, z: dz/len * 0.002 }, true);
                    chip.rb.wakeUp();
                }, index * 50);
            });
        }

        // --- Chip Glow / Pulse in Bet Zone ---
        const CHIP_PULSE_STRENGTH = 0.06; // scale amplitude
        const CHIP_PULSE_SPEED = 0.004; // ms multiplier
        function initChipPulsePhases() {
            rapierChips.forEach((chip, i) => { chip._pulsePhase = i * 0.9; });
        }
        function updateBetZoneChipEffects(timeNow) {
            if (!rapierChips || rapierChips.length === 0) return;
            const tFactor = timeNow * CHIP_PULSE_SPEED;
            rapierChips.forEach(chip => {
                const tr = chip.rb.translation();
                const dx = tr.x - BET_ZONE.center.x;
                const dz = tr.z - BET_ZONE.center.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                const inside = dist <= BET_ZONE.radius;
                const mesh = chip.mesh.children.find(c => c.isMesh) || chip.mesh;
                if (!mesh) return;
                if (inside) {
                    const pulse = Math.sin(tFactor + (chip._pulsePhase || 0)) * CHIP_PULSE_STRENGTH;
                    const s = 1 + pulse;
                    mesh.scale.set(s, s, s);
                    // Emissive highlight
                    if (Array.isArray(mesh.material)) {
                        // top (index 1) & bottom (index 2) share glow
                        [1,2].forEach(idx => {
                            const m = mesh.material[idx];
                            if (m && m.emissive) {
                                m.emissive.setHex(0xffdd55);
                                m.emissiveIntensity = 0.6 + pulse * 2.0;
                            }
                        });
                    } else if (mesh.material && mesh.material.emissive) {
                        mesh.material.emissive.setHex(0xffdd55);
                        mesh.material.emissiveIntensity = 0.6 + pulse * 2.0;
                    }
                } else {
                    mesh.scale.set(1,1,1);
                    if (Array.isArray(mesh.material)) {
                        [1,2].forEach(idx => {
                            const m = mesh.material[idx];
                            if (m && m.emissive) {
                                m.emissive.setHex(0x000000);
                                m.emissiveIntensity = 0.0;
                            }
                        });
                    } else if (mesh.material && mesh.material.emissive) {
                        mesh.material.emissive.setHex(0x000000);
                        mesh.material.emissiveIntensity = 0.0;
                    }
                }
            });
        }

        function checkWinner() {
            const dealerValue = calculateHandValue(dealerHand);
            const playerValue = calculateHandValue(playerHand);
            
            if (playerValue > 21) {
                updateStatus('Bust! Dealer wins.');
                return 'dealer';
            } else if (dealerValue > 21) {
                updateStatus('Dealer busts! You win!');
                return 'player';
            } else if (dealerValue > playerValue) {
                updateStatus('Dealer wins.');
                return 'dealer';
            } else if (playerValue > dealerValue) {
                updateStatus('You win!');
                return 'player';
            } else {
                updateStatus('Push (tie).');
                return 'push';
            }
        }

                        initializeShoe();

                        function waitForShuffleThenStart() {

                            } else {
                                setTimeout(waitForShuffleThenStart, 120);
                            }
                        }
                        waitForShuffleThenStart();
                    } else {
                        startNewHand();
                    }
                });
                return;
            }
            
            // No cards on table, check if reshuffle is needed before starting new hand
            if (needsReshuffle) {
                updateStatus('Reshuffling shoe...');
                initializeShoe();
                shuffleShoe();
                needsReshuffle = false;
                // Poll until shuffle animation completes
                function waitForShuffleThenStart() {
                    if (!isShuffling) {
                        startNewHand();
                    } else {
                        setTimeout(waitForShuffleThenStart, 120);
                    }
                }
                waitForShuffleThenStart();
                return;
            }
            startNewHand();
        });
        
        function startNewHand() {
            createDeck();
            dealerHand = [];
            playerHand = [];
            clearCards();
            updateStatus('Dealing...');
            
            // Sequential card dealing animation
            // Order: Player card 1, Dealer card 1, Player card 2, Dealer card 2 (face down)
            let dealSequence = [
                { hand: playerHand, isDealer: false, handIndex: 0, faceDown: false },
                { hand: dealerHand, isDealer: true, handIndex: 0, faceDown: false },
                { hand: playerHand, isDealer: false, handIndex: 1, faceDown: false },
                { hand: dealerHand, isDealer: true, handIndex: 1, faceDown: true } // Dealer's hole card
            ];
            
            let currentDealIndex = 0;
            
            function dealNextCard() {
                if (currentDealIndex >= dealSequence.length) {
                    // All initial cards dealt
                    updateScores();
                    updateStatus('');
                    gameInProgress = true;
                    dealBtn.disabled = true;
                    hitBtn.disabled = false;
                    standBtn.disabled = false;
                    evaluateInitialHands();
                    return;
                }
                
                const deal = dealSequence[currentDealIndex];
                currentDealIndex++;
                
                // Deal card with callback to deal next card after animation
                dealCard(deal.hand, deal.isDealer, deal.handIndex, deal.faceDown, () => {
                    updateScores();
                    dealNextCard();
                });
            }
            
            // Start the sequence
            dealNextCard();
        }

        // Evaluate initial hands for early blackjack detection (dealer hole-card peek)
        function evaluateInitialHands() {
            const playerBJ = isBlackjack(playerHand);
            const dealerBJ = isBlackjack(dealerHand);
            if (!playerBJ && !dealerBJ) return; // no early resolution needed
            // Reveal dealer hole card if hidden
            const holeCard = dealtCards.find(dc => dc.isHoleCard && dc.isFaceDown);
            if (holeCard) {
                flipHoleCard(() => finalizeInitialBlackjack(playerBJ, dealerBJ));
            } else {
                finalizeInitialBlackjack(playerBJ, dealerBJ);
            }
        }
        function finalizeInitialBlackjack(playerBJ, dealerBJ) {
            updateScores();
            if (playerBJ && dealerBJ) {
                updateStatus('Both Blackjack - Push');
                lastResult = 'blackjack-push';
                handleGameResult('push');
                endGame();
            } else if (dealerBJ) {
                updateStatus('Dealer Blackjack');
                lastResult = 'blackjack-dealer';
                handleGameResult('dealer');
                endGame();
            } else if (playerBJ) {
                updateStatus('Blackjack!');
                lastResult = 'blackjack-player';
                handleGameResult('player');
                endGame();
            }
        }

        hitBtn.addEventListener('click', () => {
            hitBtn.disabled = true; // Disable during animation
            dealCard(playerHand, false, playerHand.length, false, () => {
                updateScores();
                
                if (calculateHandValue(playerHand) > 21) {
                    updateStatus('Bust! Dealer wins.');
                    collectLostChips();
                    endGame();
                } else {
                    hitBtn.disabled = false; // Re-enable if still playing
                }
            });
        });

        // Flip the dealer's hole card
        function flipHoleCard(callback) {
            // Find the dealer's hole card (second card, face down)
            const holeCard = dealtCards.find(dc => dc.isHoleCard && dc.isFaceDown);
            
            if (!holeCard) {
                if (callback) callback();
                return;
            }
            
            // Animate the flip
            const duration = 400;
            const startTime = performance.now();
            
            activeTweens.push({
                flip: true,
                sc: holeCard,
                duration: duration,
                start: startTime,
                fromRotation: Math.PI,
                toRotation: 0,
                originalY: holeCard.body.position.y // Store original Y position
            });
            
            // Mark as no longer face down
            holeCard.isFaceDown = false;
            
            // Call callback after flip completes
            if (callback) {
                setTimeout(callback, duration + 50);
            }
        }

        function stand() {
            hitBtn.disabled = true;
            standBtn.disabled = true;
            
            // First, flip the dealer's hole card
            updateStatus('Dealer reveals...');
            flipHoleCard(() => {
                updateScores();
                
                // Then dealer draws until 17 or higher (sequential animation)
                function dealerDrawSequence() {
                    if (calculateHandValue(dealerHand) < 17) {
                        dealCard(dealerHand, true, dealerHand.length, false, () => {
                            updateScores();
                            dealerDrawSequence(); // Continue drawing if needed
                        });
                    } else {
                        // Dealer done drawing
                        setTimeout(() => {
                            const result = checkWinner();
                            handleGameResult(result);
                            endGame();
                        }, 500);
                    }
                }
                
                dealerDrawSequence();
            });
        }

        standBtn.addEventListener('click', stand);

        function handleGameResult(result) {
            if (result === 'dealer') {
                collectLostChips();
            } else if (result === 'player') {
                // Check if it was blackjack (2 cards totaling 21)
                const isBlackjack = playerHand.length === 2 && calculateHandValue(playerHand) === 21;
                payoutWinningChips(isBlackjack);
            } else if (result === 'push') {
                returnPushChips();
            }
            // Store lastResult if not already set by early blackjack evaluation
            if (!lastResult) {
                lastResult = result;
            }
        }

            gameInProgress = false;
            hitBtn.disabled = true;
            standBtn.disabled = true;
            dealBtn.disabled = false; // Re-enable deal button for next hand

                addHandHistoryEntry(lastResult);
                lastResult = null; // reset for next hand

        // Visual wireframe mode: make all standard meshes wireframe & semi-transparent
        const originalVisualMaterialProps = new Map(); // mesh.uuid -> [ { material, wireframe, transparent, opacity, depthWrite } ]
        function setVisualWireframeMode(on) {
            scene.traverse(obj => {
                if (!obj.isMesh) return;
                // Skip existing debug wireframe helpers (LineSegments) and physics wireframe groups
                if (obj.type === 'LineSegments') return;
                const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                if (on) {
                    if (!originalVisualMaterialProps.has(obj.uuid)) {
                        const stored = mats.map(m => ({ material: m, wireframe: m.wireframe, transparent: m.transparent, opacity: m.opacity, depthWrite: m.depthWrite }));
                        originalVisualMaterialProps.set(obj.uuid, stored);
                    }
                    mats.forEach(m => {
                        m.wireframe = true;
                        m.transparent = true;
                        m.opacity = 0.18;
                        m.depthWrite = false;
                        m.needsUpdate = true;
                    });
                } else {
                    const stored = originalVisualMaterialProps.get(obj.uuid);
                    if (stored) {
                        stored.forEach(s => {
                            s.material.wireframe = s.wireframe;
                            s.material.transparent = s.transparent;
                            s.material.opacity = s.opacity;
                            s.material.depthWrite = s.depthWrite;
                            s.material.needsUpdate = true;
                        });
                    }
                }
            });
            if (!on) {
                // Optionally clear map to allow GC (keep if we want fast re-toggle retaining originals)
                // originalVisualMaterialProps.clear();
            }

        // --- Chip Interaction Handlers ---
        function updateMousePosition(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function getChipUnderMouse() {
            raycaster.setFromCamera(mouse, camera);
            
            // Test against Rapier chip meshes (may be Group or Mesh)
            const rapierChipMeshes = rapierChips.map(c => {
                if (c.mesh.children && c.mesh.children.length > 0) {
                    // Find first non-wireframe child
                    for (let child of c.mesh.children) {
                        if (child.type === 'Mesh') return child;
                    }
                }
                return c.mesh;
            });
            
            const intersects = raycaster.intersectObjects(rapierChipMeshes, false);
            
            if (intersects.length > 0) {
                const hitObject = intersects[0].object;
                
                // Check Rapier chips
                for (let chip of rapierChips) {
                    if (chip.mesh === hitObject || chip.mesh.children.includes(hitObject)) {
                        return { chip, type: 'rapier' };
                    }
                }
            }
            return null;
        }

        function updateDraggedChipPosition() {
            if (!draggedChip) return;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(dragPlane, _dragPlaneIntersect)) {
                const { chip } = draggedChip;
                const targetY = DRAG_PLANE_Y + CHIP.thickness / 2 + 0.002;
                let yNow = targetY;
                if (chip.dragAnim) {
                    const now = performance.now();
                    const d = chip.dragAnim.duration || DRAG_RISE_DURATION_MS;
                    const t = (now - chip.dragAnim.startTime) / Math.max(1, d);
                    const k = easeOutCubic(t);
                    yNow = chip.dragAnim.startY + (targetY - chip.dragAnim.startY) * k;
                    if (t >= 1) chip.dragAnim = null;
                }
                const newPos = _dragPlaneIntersect.clone().add(dragOffset);
                newPos.y = yNow;
                chip.rb.setNextKinematicTranslation({ x: newPos.x, y: newPos.y, z: newPos.z });
                chip.mesh.position.set(newPos.x, newPos.y, newPos.z);
            }
        }

        function onMouseDown(event) {
            if (event.button !== 0) return; // Only left click
            if (gameInProgress) return; // Can't move chips during game
            
            updateMousePosition(event);
            const result = getChipUnderMouse();
            
            if (result) {
                draggedChip = result;
                const { chip } = result;
                chip.isDragging = true;
                
                // Make Rapier chip kinematic while dragging
                chip.rb.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased);
                chip.rb.setLinvel({ x: 0, y: 0, z: 0 }, true);
                chip.rb.setAngvel({ x: 0, y: 0, z: 0 }, true);
                
                // Start rise animation from current height
                chip.dragAnim = { startTime: performance.now(), startY: chip.mesh.position.y, duration: DRAG_RISE_DURATION_MS };
                
                // Calculate drag offset and immediately position once so pickup is instant
                raycaster.setFromCamera(mouse, camera);
                if (raycaster.ray.intersectPlane(dragPlane, _dragPlaneIntersect)) {
                    dragOffset.copy(chip.mesh.position).sub(_dragPlaneIntersect);
                    // Trigger an initial update so it starts rising on click
                    updateDraggedChipPosition();
                }
                
                controls.enabled = false; // Disable camera controls while dragging
            }
        }

        function onMouseMove(event) {
            updateMousePosition(event);
            
            if (draggedChip) {
                updateDraggedChipPosition();
            }
        }

        function onMouseUp(event) {
            if (draggedChip) {
                const { chip } = draggedChip;
                
                // Restore dynamic physics for Rapier chip
                chip.rb.setBodyType(RAPIER.RigidBodyType.Dynamic);
                chip.rb.wakeUp();
                
                // Clear any active drag animation state
                chip.dragAnim = null;
                
                chip.isDragging = false;
                draggedChip = null;
                
                controls.enabled = true;
            }
        }

        // Add event listeners
        renderer.domElement.addEventListener('mousedown', onMouseDown, false);
        renderer.domElement.addEventListener('mousemove', onMouseMove, false);
        renderer.domElement.addEventListener('mouseup', onMouseUp, false);
        renderer.domElement.addEventListener('mouseleave', onMouseUp, false);

        // Expose a simple API to adjust drag plane height at runtime
            function setDragPlaneHeight(y) {
            DRAG_PLANE_Y = y;
            // For plane (n dot p + c = 0) with n=(0,1,0), y = -c
            dragPlane.constant = -DRAG_PLANE_Y;
        }
        window.setDragPlaneHeight = setDragPlaneHeight;
            // Expose API to adjust rise duration (ms)
            function setDragRiseDuration(ms){ DRAG_RISE_DURATION_MS = Math.max(0, ms|0); }
            window.setDragRiseDuration = setDragRiseDuration;

        // Calculate total bet in the bet zone
        function calculateBetAmount() {
            let total = 0;
            // Include Rapier chips with value
            if (rapierChips && rapierChips.length) {
                for (let rc of rapierChips) {
                    if (rc.value == null) continue; // skip debug chips
                    const t = rc.rb.translation();
                    const dx = t.x - BET_ZONE.center.x;
                    const dz = t.z - BET_ZONE.center.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    if (distance <= BET_ZONE.radius) total += rc.value;
                }
            }
            return total;
        }

        // Initialize starting chips in stockpile
        function initializeChipStockpile() {
            // Debug spawn: one chip of each type, centered on table, faces up
            const demoValues = [1, 5, 25, 100, 500];
            const spacing = 0.25; // slight offset so they don't overlap
            const baseX = -spacing * ((demoValues.length - 1) / 2);
            const centerZ = 0; // center of table
            const centerY = FELT_TOP_Y + (CHIP.thickness / 2) + 0.001; // epsilon above felt (y=0)

            console.log('[Chip Init] Creating', demoValues.length, 'value chips');
            for (let i = 0; i < demoValues.length; i++) {
                const x = baseX + i * spacing;
                const chip = createRapierValueChip(demoValues[i], {
                    x,
                    y: (typeof FELT_TOP_Y_RAPIER === 'number' ? FELT_TOP_Y_RAPIER : 0) + (CHIP.thickness / 2) + 0.001,
                    z: centerZ
                });
                console.log('[Chip Init] Created chip', i+1, 'value:', demoValues[i], 'at x:', x.toFixed(3));
            }
            console.log('[Chip Init] Total rapierChips:', rapierChips.length);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            const timeNow = performance.now();
            
            // Update physics
            world.step(1/60);
            if (rapierReady) {
                rapierWorld.step();
            }
            
            // Update camera animation
            updateCameraAnimation(timeNow);
            
            // Update shuffle tweens (kinematic motion)
            updateShuffleTweens(timeNow);
            
            // Sync card meshes with physics bodies for cards in shoe
            for (let sc of shoeCards) {
                sc.mesh.position.copy(sc.body.position);
                sc.mesh.quaternion.copy(sc.body.quaternion);
            }
            
            // Sync dealt cards with their physics bodies
            for (let dc of dealtCards) {
                dc.mesh.position.copy(dc.body.position);
                // Only sync rotation if card hasn't been dealt (is still animating or in shoe)
                if (!dc.isDealt) {
                    dc.mesh.quaternion.copy(dc.body.quaternion);
                }
            }
            
            // Sync discarded cards with their physics bodies
            for (let dc of discardedCards) {
                dc.mesh.position.copy(dc.body.position);
                dc.mesh.quaternion.copy(dc.body.quaternion);
            }
            
            // Sync Rapier chips
            if (rapierReady && rapierChips.length) {
                const EPS = 0.0001;
                for (const chip of rapierChips) {
                    if (!chip.isDragging) {
                        const t = chip.rb.translation();
                        const r = chip.rb.rotation();
                        // Allow chips to fall off table: remove clamp that forced them to stay on felt.
                        // We only sync visual mesh to current rigid body translation.
                        chip.mesh.position.set(t.x, t.y, t.z);
                        chip.mesh.quaternion.set(r.x, r.y, r.z, r.w);
                    }
                }
            }

            // Chip glow/pulse effect
            updateBetZoneChipEffects(timeNow);
            
            // Update deal button state based on bet amount
            if (!gameInProgress && !isShuffling) {
                const betAmount = calculateBetAmount();
                dealBtn.disabled = betAmount === 0;
                document.getElementById('currentBet').textContent = '$' + betAmount;
            }
            
            // Sync physics wireframes
            if (debugState.showCannonWireframes) {
                cannonWireframes.forEach(({ wireframe, body }) => {
                    wireframe.position.copy(body.position);
                    wireframe.quaternion.copy(body.quaternion);
                });
                
                // Update debug spheres showing center of mass
                if (window.debugSpheres) {
                    window.debugSpheres.forEach(({ sphere, body }) => {
                        sphere.position.copy(body.position);
                    });
                }
            }

            // While dragging, continuously update chip position so pickup works on click
            if (draggedChip) {
                updateDraggedChipPosition();
            }
            
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start rendering first to avoid a blank screen, then init shoe and shuffle
        animate();
        // Defer heavy initialization slightly so the first frame paints
        setTimeout(() => {
            initializeShoe();
            initializeChipStockpile();
            // Give a bit more time so the shoe appears before we start shuffling
            setTimeout(() => {
                shuffleShoe(true);
            }, st(600));
            // Initialize chip pulse phases after initial stockpile spawn
            initChipPulsePhases();
        }, 0);

        // Dev: expose a quick Rapier chip spawn for testing
        window.spawnRapierChip = (x=0, y=null, z=0) => {
            const yy = y == null ? (rapierReady ? FELT_TOP_Y_RAPIER + 0.5 : 0.5) : y;
            return spawnRapierChip(x, yy, z);
        };
    </script>
</body>
</html>
